async function deleteStudent(sid, after) {
  const s = S.students.find(x => x.id === sid);
  if (!s) return;
  const recN = Array.from(S.records.keys()).filter(k => k.endsWith('::' + sid)).length;
  const scoreN = Array.from(S.scores.keys()).filter(k => k.endsWith('::' + sid)).length;
  const mkN = S.mistakes.filter(m => m.studentId === sid).length;
  const parts = [];
  if (recN) parts.push(recN + ' 条作业登记');
  if (scoreN) parts.push(scoreN + ' 条考试成绩');
  if (mkN) parts.push(mkN + ' 条错题');
  const msg = '删除 ' + s.no + ' ' + s.name + '？' +
    (parts.length ? '\n\n将同时删除：' + parts.join('、') + '。' : '\n\n该学生暂无登记、成绩、错题。') +
    '\n此操作不可恢复。';
  if (!confirm(msg)) return;
  for (const k of Array.from(S.records.keys())) {
    if (k.endsWith('::' + sid)) { S.records.delete(k); await DB.del('records', k); }
  }
  for (const k of Array.from(S.scores.keys())) {
    if (k.endsWith('::' + sid)) { S.scores.delete(k); await DB.del('scores', k); }
  }
  for (const m of S.mistakes.filter(m => m.studentId === sid)) await DB.del('mistakes', m.id);
  await DB.del('students', sid);
  await reloadAll();
  if (S.selectMode) { S.selected.delete(sid); if (!S.selected.size) S.selectMode = false; }
  if (S.filter === 'tag:') S.filter = '';
  renderAll();
  toast('已删除 ' + s.name + (parts.length ? '（含 ' + parts.join('、') + '）' : ''), 'ok');
  if (after) after();
}

/* ---------------------------------------------------------------
   16.1  Excel / CSV 名单解析（无第三方库）
   ---------------------------------------------------------------
   支持：
     · .xlsx  —— 自行解压（DecompressionStream + DOMParser）
     · .csv/.tsv/.txt —— 自动识别分隔符与 GBK/UTF-8 编码
     · 从 Excel 直接复制粘贴（制表符分隔）
   学号 → 序号：学号 37101 = 班级号 371 + 序号 01
   --------------------------------------------------------------- */

/** 解压 zip，返回 Map<path, {method, bytes}> */
async function unzip(buf) {
  const u8 = new Uint8Array(buf);
  const dv = new DataView(buf);
  // 1) 找中央目录结束标记 EOCD
  let eocd = -1;
  const minPos = Math.max(0, u8.length - 66000);
  for (let i = u8.length - 22; i >= minPos; i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('不是有效的 xlsx 文件（未找到 zip 结构）');

  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const entries = new Map();
  const dec = new TextDecoder('utf-8');

  for (let i = 0; i < count; i++) {
    if (p + 46 > u8.length || dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true);
    const compSize = dv.getUint32(p + 20, true);
    const nameLen = dv.getUint16(p + 28, true);
    const extraLen = dv.getUint16(p + 30, true);
    const cmtLen = dv.getUint16(p + 32, true);
    const localOff = dv.getUint32(p + 42, true);
    const name = dec.decode(u8.subarray(p + 46, p + 46 + nameLen));

    if (localOff + 30 <= u8.length && dv.getUint32(localOff, true) === 0x04034b50) {
      const lnLen = dv.getUint16(localOff + 26, true);
      const leLen = dv.getUint16(localOff + 28, true);
      const start = localOff + 30 + lnLen + leLen;
      const size = compSize || (u8.length - start);
      entries.set(name, { method, data: u8.subarray(start, start + size) });
    }
    p += 46 + nameLen + extraLen + cmtLen;
  }

  // 2) 只解压需要的 XML
  for (const [, e] of entries) {
    if (e.method === 0) { e.bytes = e.data; }
    else if (e.method === 8) { e.bytes = await inflateRaw(e.data); }
    else { e.bytes = null; }
  }
  return entries;
}

async function inflateRaw(u8) {
  if (typeof DecompressionStream === 'undefined') {
    throw new Error('当前浏览器不支持解压 xlsx，请把 Excel 另存为 CSV 后导入');
  }
  try {
    const ds = new DecompressionStream('deflate-raw');
    const stream = new Blob([u8]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  } catch (e) {
    throw new Error('解压失败，请把 Excel 另存为 CSV 后导入');
  }
}

function xmlDoc(text) {
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('Excel 内容解析失败');
  return doc;
}

function parseSharedStrings(xml) {
  const doc = xmlDoc(xml);
  const sis = doc.getElementsByTagName('si');
  const out = [];
  for (let i = 0; i < sis.length; i++) {
    const ts = sis[i].getElementsByTagName('t');
    let s = '';
    for (let k = 0; k < ts.length; k++) s += ts[k].textContent;
    out.push(s);
  }
  return out;
}

function colIndexOf(ref) {
  let n = 0;
  for (let i = 0; i < ref.length; i++) {
    const c = ref.charCodeAt(i);
    if (c >= 65 && c <= 90) n = n * 26 + (c - 64);
    else break;
  }
  return n - 1;
}

function parseSheetXml(xml, strings) {
  const doc = xmlDoc(xml);
  const rowEls = doc.getElementsByTagName('row');
  const rows = [];
  for (let i = 0; i < rowEls.length; i++) {
    const rowEl = rowEls[i];
    const rAttr = parseInt(rowEl.getAttribute('r') || '0', 10);
    const idx = rAttr > 0 ? rAttr - 1 : rows.length;
    const cells = rowEl.getElementsByTagName('c');
    const arr = [];
    for (let k = 0; k < cells.length; k++) {
      const c = cells[k];
      const col = colIndexOf(c.getAttribute('r') || '');
      const t = c.getAttribute('t');
      let v = '';
      if (t === 's') {
        const vEl = c.getElementsByTagName('v')[0];
        v = vEl ? (strings[parseInt(vEl.textContent, 10)] || '') : '';
      } else if (t === 'inlineStr') {
        const tEl = c.getElementsByTagName('t')[0];
        v = tEl ? tEl.textContent : '';
      } else {
        const vEl = c.getElementsByTagName('v')[0];
        v = vEl ? vEl.textContent : '';
      }
      arr[col >= 0 ? col : k] = v;
    }
    rows[idx] = arr;
  }
  return rows.filter(Boolean);
}

async function readXlsx(buf) {
  const zip = await unzip(buf);
  const text = async path => {
    const e = zip.get(path);
    if (!e || !e.bytes) return '';
    return new TextDecoder('utf-8').decode(e.bytes);
  };
  const sharedXml = await text('xl/sharedStrings.xml');
  const strings = sharedXml ? parseSharedStrings(sharedXml) : [];

  let sheetPath = '';
  const wbRels = await text('xl/_rels/workbook.xml.rels');
  if (wbRels) {
    const m = wbRels.match(/Target="([^"]*worksheets\/sheet[^"]*)"/);
    if (m) {
      const t = m[1].replace(/^\/?xl\//, '').replace(/^\.\.\//, '');
      sheetPath = 'xl/' + t.replace(/^xl\//, '');
    }
  }
  if (!sheetPath || !zip.has(sheetPath)) {
    for (const k of zip.keys()) {
      if (/^xl\/worksheets\/sheet\d+\.xml$/.test(k)) { sheetPath = k; break; }
    }
  }
  if (!sheetPath) throw new Error('这个 Excel 里没有找到工作表');
  return parseSheetXml(await text(sheetPath), strings);
}

function decodeText(buf) {
  let t = '';
  try { t = new TextDecoder('utf-8').decode(buf); } catch (e) { t = ''; }
  if (t.indexOf('\uFFFD') >= 0) {
    try { t = new TextDecoder('gbk').decode(buf); } catch (e) { /* 保持 utf-8 */ }
  }
  return t.replace(/^\uFEFF/, '');
}

function parseDelimited(text) {
  const t = String(text).replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const firstLine = t.split('\n')[0] || '';
  const cands = [
    [',', (firstLine.match(/,/g) || []).length],
    ['\t', (firstLine.match(/\t/g) || []).length],
    [';', (firstLine.match(/;/g) || []).length]
  ].sort((a, b) => b[1] - a[1]);
  const D = cands[0][1] > 0 ? cands[0][0] : ',';

  const rows = [];
  let row = [], cur = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) {
      if (ch === '"') {
        if (t[i + 1] === '"') { cur += '"'; i++; }
        else q = false;
      } else cur += ch;
    } else {
      if (ch === '"') q = true;
      else if (ch === D) { row.push(cur); cur = ''; }
      else if (ch === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
      else cur += ch;
    }
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }

  // 整表只有一列时，尝试按空白拆两列（兼容「12 张三」「5 李四」这类粘贴格式）
  const maxCols = rows.reduce((m, r) => Math.max(m, r.length), 0);
  if (maxCols <= 1) {
    return rows.map(r => {
      const line = String(r[0] == null ? '' : r[0]).trim();
      if (!line) return r;
      const m = line.match(/^(\S+)[\s\u3000]+(.+)$/);
      return m ? [m[1], m[2].trim()] : [line];
    });
  }
  return rows;
}

async function readRosterFile(file) {
  const name = String(file.name || '').toLowerCase();
  if (/\.xls$/.test(name)) {
    throw new Error('不支持旧版 .xls，请在 Excel 里「另存为」.xlsx 或 .csv 后再导入');
  }
  const buf = await file.arrayBuffer();
  if (/\.xlsx$/.test(name)) return await readXlsx(buf);
  return parseDelimited(decodeText(buf));
}

/** 从学号列表推断班级号前缀（最长公共前缀） */
function guessSidPrefix(ids) {
  const list = (ids || []).map(s => String(s == null ? '' : s).replace(/[^\d]/g, '')).filter(Boolean);
  if (list.length < 2) return '';
  let p = list[0];
  for (const s of list.slice(1)) {
    let i = 0;
    while (i < p.length && i < s.length && p[i] === s[i]) i++;
    p = p.slice(0, i);
    if (!p) break;
  }
  const minLen = Math.min.apply(null, list.map(x => x.length));
  return (p.length >= 2 && p.length < minLen) ? p : '';
}

/** 学号 → 序号：去前缀后取数字 */
function sidToNo(sid, prefix) {
  const s = String(sid == null ? '' : sid).replace(/[^\dA-Za-z]/g, '');
  if (!s) return NaN;
  let rest = s;
  if (prefix && s.indexOf(prefix) === 0) rest = s.slice(prefix.length);
  if (!/^\d+$/.test(rest)) return NaN;
  return parseInt(rest, 10);
}

/**
 * 二维表 → 名单条目
 * @returns {{prefix, headerFound, sidCol, nameCol, total, entries}}
 *   entries: [{ sid, name, no, ok, reason, skip }]
 */
function buildRosterFromRows(rows, prefix) {
  const clean = (rows || []).filter(r => r && r.some(c => String(c == null ? '' : c).trim() !== ''));
  const out = { prefix: prefix || '', headerFound: false, sidCol: -1, nameCol: -1, total: clean.length, entries: [] };
  if (!clean.length) return out;

  const cell = v => String(v == null ? '' : v).trim();

  // 1) 表头识别
  let headerIdx = -1, sidCol = -1, nameCol = -1, ordCol = -1;
  for (let i = 0; i < Math.min(5, clean.length); i++) {
    const r = clean[i].map(cell);
    const si = r.findIndex(c => /学号|学籍号|考号|学籍编号/.test(c));
    const ni = r.findIndex(c => /姓名|名字/.test(c));
    const qi = r.findIndex(c => /^(序号|编号|序|no\.?|#)$/i.test(c));
    if (si >= 0 || ni >= 0 || qi >= 0) { headerIdx = i; sidCol = si; nameCol = ni; ordCol = qi; break; }
  }

  const dataStart = headerIdx >= 0 ? headerIdx + 1 : 0;
  const dataRows = clean.slice(dataStart);
  out.total = dataRows.length;

  // 2) 列推断（无表头或缺列时）
  if (sidCol < 0 || nameCol < 0) {
    const width = dataRows.reduce((m, r) => Math.max(m, r.length), 0);
    let bestSid = -1, bestSidScore = 0, bestName = -1, bestNameScore = 0;
    for (let c = 0; c < width; c++) {
      let sn = 0, nm = 0, tot = 0;
      dataRows.slice(0, 30).forEach(r => {
        const v = cell(r[c]);
        if (!v) return;
        tot++;
        if (/^\d{4,}$/.test(v)) sn++;
        if (/[\u4e00-\u9fa5]/.test(v)) nm++;
      });
      if (tot && sn / tot > 0.5 && sn > bestSidScore) { bestSidScore = sn; bestSid = c; }
      if (tot && nm / tot > 0.5 && nm > bestNameScore) { bestNameScore = nm; bestName = c; }
    }
    if (sidCol < 0) sidCol = bestSid;
    if (nameCol < 0) nameCol = bestName;

    // 没有学号列时，找一个"全是 1~3 位整数"的列作为序号列
    if (ordCol < 0 && sidCol < 0) {
      for (let c = 0; c < width; c++) {
        let ok = 0, tot = 0;
        dataRows.slice(0, 30).forEach(r => {
          const v = cell(r[c]);
          if (!v) return;
          tot++;
          if (/^\d{1,3}$/.test(v)) ok++;
        });
        if (tot > 0 && ok === tot) { ordCol = c; break; }
      }
    }
  }
  if (sidCol >= 0 && sidCol === nameCol) nameCol = sidCol + 1;

  out.headerFound = headerIdx >= 0;
  out.sidCol = sidCol;
  out.nameCol = nameCol;
  out.ordCol = ordCol;

  // 3) 逐行解析
  const usedNo = new Set();
  let seq = 0;
  dataRows.forEach((r, i) => {
    const sid = sidCol >= 0 ? cell(r[sidCol]) : '';
    const name = (nameCol >= 0 ? cell(r[nameCol]) : '').replace(/\s+/g, '')
      .replace(/[（(].*?[)）]/g, '');
    if (!sid && !name) return;                       // 整行空白，静默跳过

    const e = { sid, name, no: null, ok: false, reason: '', skip: false };

    if (!name) { e.reason = '姓名为空'; out.entries.push(e); return; }

    let no;
    if (sid) {
      no = sidToNo(sid, out.prefix);
      if (!isFinite(no)) { e.reason = '学号无法解析出序号'; out.entries.push(e); return; }
    } else if (ordCol >= 0 && /^\d{1,3}$/.test(cell(r[ordCol]))) {
      no = parseInt(cell(r[ordCol]), 10);            // 显式序号列
    } else {
      no = ++seq;                                     // 无学号：按行号编号
    }

    if (no < 1 || no > 999) { e.reason = '序号 ' + no + ' 超出 1–999'; out.entries.push(e); return; }
    if (usedNo.has(no)) { e.reason = '序号 ' + no + ' 重复'; out.entries.push(e); return; }

    usedNo.add(no);
    e.no = no;
    e.ok = true;
    out.entries.push(e);
  });

  return out;
}

/** 写入名单（replace=true 时清空本班原名单及其登记记录） */
async function writeRosterItems(classId, items, replace) {
  if (replace) {
    const hws = S.assignments.filter(a => a.classId === classId).map(a => a.id);
    // 名单重建后学生 id 全变，旧成绩记录已无意义
    for (const k of Array.from(S.scores.keys())) {
      const rc = S.scores.get(k);
      if (rc && rc.classId === classId) { S.scores.delete(k); await DB.del('scores', k); }
    }
    for (const s of S.students.filter(x => x.classId === classId)) {
      await DB.del('students', s.id);
      for (const h of hws) {
        const key = recKey(h, s.id);
        if (S.records.has(key)) { S.records.delete(key); await DB.del('records', key); }
      }
    }
    S.students = S.students.filter(x => x.classId !== classId);
  }

  const used = new Set(S.students.filter(s => s.classId === classId).map(s => Number(s.no)));
  let auto = used.size ? Math.max.apply(null, Array.from(used)) + 1 : 1;
  const arr = [];
  items.forEach(it => {
    let no = it.no;
    if (no == null || used.has(no)) { while (used.has(auto)) auto++; no = auto; }
    used.add(no);
    arr.push({ id: uid(), classId, no, name: it.name, createdAt: Date.now() });
  });
  if (!arr.length) return 0;
  await DB.putMany('students', arr);
  S.students.push(...arr);
  return arr.length;
}

/** 兼容旧入口：纯文本名单（支持「12 张三」或仅姓名） */
async function importRosterText(classId, text, replace) {
  const lines = String(text).split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const flat = [];
  lines.forEach(line => {
    const parts = line.split(/[、,，\t]+/).map(p => p.trim()).filter(Boolean);
    if (parts.length > 1 && !/\d/.test(line)) parts.forEach(p => flat.push(p));
    else flat.push(line);
  });
  const items = [];
  flat.forEach(line => {
    let no = null, name = '';
    const m = line.match(/^(\d{1,3})\s*[.、,，:：\-\s]\s*(.+)$/);
    if (m) { no = parseInt(m[1], 10); name = m[2].trim(); } else { name = line; }
    name = name.replace(/\s+/g, '').replace(/[（(].*?[)）]/g, '');
    if (name) items.push({ no, name });
  });
  if (!items.length) { toast('没有解析到有效姓名', 'bad'); return 0; }
  return await writeRosterItems(classId, items, replace);
}

   16.2  导入名单面板（Excel / CSV / 粘贴）
   --------------------------------------------------------------- */
async function openRosterImport() {
  await ensureClass();
  const cls = curClass();
  if (!cls) { toast('请先创建班级', 'bad'); return; }

  const body =
    '<div class="field">' +
      '<label>选择 Excel / CSV 文件</label>' +
      '<button class="btn pri block" id="riPick">选择文件（.xlsx / .csv）</button>' +
      '<div class="hint" id="riFileTip">Excel 里需有「学号」「姓名」两列；也可直接从 Excel 复制两列粘贴到下方。</div>' +
    '</div>' +
    '<div class="field">' +
      '<label>或直接粘贴</label>' +
      '<textarea id="riText" placeholder="学号&#9;姓名&#10;37101&#9;李小白&#10;37102&#9;王芳" ' +
        'style="min-height:96px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px"></textarea>' +
    '</div>' +
    '<div class="field">' +
      '<label>班级号 / 学号前缀</label>' +
      '<input id="riPrefix" placeholder="自动识别，如 371" inputmode="numeric">' +
      '<div class="hint">37101 → 班级号 371 + 序号 01 → 1 号。自动识别不准时可手动改。</div>' +
    '</div>' +
    '<div id="riPreview"></div>' +
    '<div style="display:flex;gap:8px;margin-top:14px">' +
      '<button class="btn" id="riAppend" style="flex:1">追加到现有名单</button>' +
      '<button class="btn pri" id="riReplace" style="flex:2">覆盖本班名单</button>' +
    '</div>';

  const close = openSheet('导入名单 · ' + cls.name, body, root => {
    const q = sel => root.querySelector(sel);
    const ta = q('#riText');
    const prefixInp = q('#riPrefix');
    const preview = q('#riPreview');
    let rows = [];
    let result = null;

    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = '.xlsx,.csv,.tsv,.txt,text/csv';
    fileInput.className = 'hide';
    root.appendChild(fileInput);

    const refresh = () => {
      if (!rows.length && ta.value.trim()) rows = parseDelimited(ta.value);
      const sids = [];
      rows.forEach(r => (r || []).forEach((c, i) => {
        const v = String(c == null ? '' : c).trim();
        if (/^\d{4,}$/.test(v)) sids.push(v);
      }));
      if (!prefixInp.dataset.touched) {
        prefixInp.value = guessSidPrefix(sids);
      }
      result = buildRosterFromRows(rows, prefixInp.value.trim());
      paint();
    };

    const paint = () => {
      if (!result || !result.entries.length) {
        preview.innerHTML = rows.length
          ? '<div class="hint">没有识别到有效数据行，请检查是否有「学号」「姓名」两列。</div>'
          : '';
        return;
      }
      const okList = result.entries.filter(e => e.ok && !e.skip);
      const badList = result.entries.filter(e => !e.ok);
      const skipList = result.entries.filter(e => e.ok && e.skip);

      const sum = '<b>' + result.total + '</b> 行 → 可导入 <b>' + okList.length + '</b> 人' +
        (badList.length ? '，跳过 <b style="color:#cf3a3a">' + badList.length + '</b> 行' : '') +
        (skipList.length ? '，手动排除 ' + skipList.length + ' 行' : '');

      const head = '<div class="ri-row head"><span>序号</span><span>学号</span><span>姓名</span><span style="text-align:right">状态</span></div>';
      const bodyRows = result.entries.slice(0, 200).map((e, i) => {
        const cls2 = !e.ok ? ' bad' : (e.skip ? ' off' : '');
        const st = !e.ok ? esc(e.reason) : (e.skip ? '已排除' : '✓ 导入');
        return '<div class="ri-row' + cls2 + '" data-i="' + i + '">' +
          '<span class="no">' + (e.ok ? e.no : '—') + '</span>' +
          '<span class="sid">' + esc(e.sid || '') + '</span>' +
          '<span class="nm">' + esc(e.name || '') + '</span>' +
          '<span class="ri-st ' + (e.ok && !e.skip ? 'ok' : 'no') + '">' + st + '</span>' +
        '</div>';
      }).join('');

      preview.innerHTML = '<div class="ri-sum">' + sum + '</div>' +
        '<div class="ri-box">' + head + bodyRows + '</div>' +
        '<div class="hint">' + (result.headerFound ? '已识别表头。' : '未发现表头，已按列内容自动判断。') +
        '点任意一行可排除/恢复该学生；序号不连续时保留空缺，不会自动重排。</div>';

      preview.querySelectorAll('.ri-row[data-i]').forEach(el => {
        el.onclick = () => {
          const e = result.entries[Number(el.dataset.i)];
          if (!e || !e.ok) return;
          e.skip = !e.skip;
          paint();
        };
      });
    };

    q('#riPick').onclick = () => fileInput.click();
    fileInput.onchange = async () => {
      const f = fileInput.files && fileInput.files[0];
      fileInput.value = '';
      if (!f) return;
      try {
        toast('正在解析 ' + f.name + '…');
        rows = await readRosterFile(f);
        ta.value = '';
        delete prefixInp.dataset.touched;
        q('#riFileTip').textContent = '已读取：' + f.name;
        refresh();
        const n = result ? result.entries.filter(e => e.ok).length : 0;
        toast(n ? ('识别到 ' + n + ' 名学生，请核对后导入') : '未识别到有效数据', n ? 'ok' : 'bad');
      } catch (e) {
        toast('读取失败：' + e.message, 'bad');
        q('#riFileTip').textContent = '读取失败：' + e.message;
      }
    };

    ta.addEventListener('input', () => {
      rows = [];
      delete prefixInp.dataset.touched;
      refresh();
    });
    prefixInp.addEventListener('input', () => {
      prefixInp.dataset.touched = '1';
      refresh();
    });

    const doImport = async (replace) => {
      if (!result) refresh();          // 不重复 refresh，否则会重置用户手动排除的行
      const items = (result ? result.entries : []).filter(e => e.ok && !e.skip)
        .map(e => ({ no: e.no, name: e.name }));
      if (!items.length) { toast('没有可导入的数据', 'bad'); return; }
      if (replace && !confirm('覆盖本班现有名单？\n现有学生及其登记记录将被清除。')) return;
      const n = await writeRosterItems(S.classId, items, replace);
      close();
      renderClassSelect();
      renderAll();
      toast('已导入 ' + n + ' 名学生', 'ok');
    };

    q('#riAppend').onclick = () => doImport(false);
    q('#riReplace').onclick = () => doImport(true);

    refresh();
  });
}

let sheetStack = 0;
function openSheet(title, bodyHtml, onMount) {
  const wrap = document.createElement('div');
  wrap.className = 'sheet-mask';
  wrap.innerHTML = '<div class="sheet-panel"><div class="sheet-head"><span>' + esc(title) +
    '</span><button class="sheet-close" aria-label="关闭">✕</button></div>' +
    '<div class="sheet-body">' + bodyHtml + '</div></div>';
  document.body.appendChild(wrap);
  sheetStack++;
  const openedAt = Date.now();
  requestAnimationFrame(() => wrap.classList.add('show'));
  const close = () => {
    wrap.classList.remove('show');
    sheetStack = Math.max(0, sheetStack - 1);
    setTimeout(() => wrap.remove(), 220);
  };
  // 触摸长按弹面板时，抬手会补一个落在遮罩上的 click；350ms 内忽略它，免得刚打开就被关掉
  wrap.addEventListener('click', e => {
    if (e.target !== wrap) return;
    if (Date.now() - openedAt < 350) return;
    close();
  });
  wrap.querySelector('.sheet-close').addEventListener('click', close);
  const body = wrap.querySelector('.sheet-body');
  if (onMount) { try { onMount(body, close); } catch (e) { console.error(e); } }
  return close;
}
function closeSheet() {
  const masks = $$('.sheet-mask');
  const last = masks[masks.length - 1];
  if (last) { last.classList.remove('show'); setTimeout(() => last.remove(), 220); }
}

}

/** 是否以「添加到主屏幕」的独立窗口运行（iOS / Android PWA） */
function isStandalone() {
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
    navigator.standalone === true;
}

/**
 * 主屏幕模式 + 本地无数据：大概率是「Safari 里的数据」和「主屏幕图标」
 * 存储不互通（iOS 的两个独立存储分区）。引导用备份文件恢复。
 */
function showStandaloneRestore() {
  const body =
    '<div style="font-size:13.5px;line-height:1.75;color:#37474f">' +
      '你是从<b>主屏幕图标</b>打开的。主屏幕图标和 Safari 浏览器是<b>两个独立的存储空间</b>，' +
      '数据互不相通——之前在 Safari 里登记的数据不会出现在这里，这不是数据丢失。</div>' +
    '<div style="font-size:13.5px;line-height:1.75;color:#37474f;margin-top:10px">把数据带过来：</div>' +
    '<div style="font-size:13px;line-height:1.8;color:#5f716e;margin-top:6px">' +
      '1. 用 Safari 打开本页 → 统计页 → <b>完整备份</b>（或<b>分享备份</b>存到文件/发给自己）<br>' +
      '2. 回到这里点下方按钮，选择那个备份文件即可</div>' +
    '<button class="btn pri block" id="saRestore" style="margin-top:14px">从备份文件恢复</button>' +
    '<button class="btn ghost block" id="saSkip" style="margin-top:9px">直接开始使用</button>' +
    '<div class="hint" style="margin-top:10px">以后换手机 / 换设备，也是用「完整备份 → 恢复」搬家。</div>';
  const closeMe = openSheet('数据说明', body, root => {
    root.querySelector('#saRestore').onclick = () => { closeMe(); $('#fileImport').click(); };
    root.querySelector('#saSkip').onclick = () => { closeMe(); };
  });
}

async function boot() {
  try {
    await DB.open();
  } catch (e) {
    document.body.innerHTML = '<div style="padding:40px 24px;font-family:sans-serif;line-height:1.8">' +
      '<h2>无法打开本地数据库</h2><p>' + esc(e.message) + '</p>' +
      '<p>请尝试：① 使用 Safari / Chrome 的普通模式（非无痕）；② 清理浏览器存储后重试。</p></div>';
    return;
  }
  await reloadAll();

  const emptyData = !S.students.length && !S.assignments.length &&
    !S.mistakes.length && !S.exams.length && S.classes.length <= 1;
  if (isStandalone() && emptyData && !localStorage.getItem('chemhw_sa_hinted')) {
    localStorage.setItem('chemhw_sa_hinted', '1');
    showStandaloneRestore();
  }

  // 首次使用：自动建一个班级
  if (!S.classes.length) {
    const c = { id: uid(), name: '高一(1)班', createdAt: Date.now() };
    S.classes.push(c);
    await DB.put('classes', c);
  }
  S.classId = S.classes[0].id;
  const hws = classHw();
  S.hwId = hws.length ? hws[0].id : null;

  bindEvents();
  ensureKnList();
  renderClassSelect();
  renderAll();
  S.ready = true;
}

/* ---------------------------------------------------------------
   20. 事件绑定
   --------------------------------------------------------------- */
async function submitExamInput() {
  const inp = $('#examInput');
  const v = inp.value.trim();
  if (!v) return;
  await handleScoreVoice(v);
  inp.value = '';
  try { inp.focus(); } catch (e) {}
}

function openScoreHelp() {
  openSheet('成绩批量输入说明', [
    '<div style="font-size:13.5px;line-height:1.85">',
    '<p style="margin:0 0 10px"><b>怎么输入</b></p>',
    '<div class="hint" style="font-size:13px;background:#f7faf9;padding:10px;border-radius:9px;margin-bottom:12px">',
    '「34号 62分」→ 34 号记 62 分<br>',
    '「张三 62分」→ 张三记 62 分<br>',
    '「张三62」→ 不带「分」也能认<br>',
    '「张三 62分，李四 78分」→ 一次登记多人，整批一次撤销<br>',
    '「34号 缺考」→ 记为缺考<br>',
    '「张三 满分」→ 按本次考试满分记录<br>',
    '「撤销」→ 撤销上一次（整句一起撤）',
    '</div>',
    '<p style="margin:0 0 8px"><b>读音相近也能认</b></p>',
    '<p style="margin:0 0 12px;color:#5f716e">和作业登记共用一套匹配：「李那」能对上「李娜」，结果带 <b>≈</b> 标记。</p>',
    '<p style="margin:0 0 8px"><b>分数超出满分</b></p>',
    '<p style="margin:0;color:#5f716e">会提示「62 分超过满分 100」并跳过，不会写错。满分在「考试设置」里改。</p>',
    '</div>'
  ].join(''), null);
}

function bindEvents() {
  // 班级切换
  $('#classSelect').addEventListener('change', e => switchClass(e.target.value));

  // 管理
  $('#btnManage').addEventListener('click', openManage);

  // Tab
  $('#tabbar').addEventListener('click', e => {
    const b = e.target.closest('button[data-view]');
    if (b) switchView(b.dataset.view);
  });

  // 文字批量登记
  const submitVoiceText = async () => {
    const inp = $('#voiceInput');
    const v = inp.value.trim();
    if (!v) return;
    if (!curHw()) { toast('请先选择一次作业', 'bad'); return; }
    if (!classStudents().length) { toast('当前班级还没有学生，请先导入名单', 'bad'); return; }
    await handleVoiceText(v);
    inp.value = '';
    try { inp.focus(); } catch (e) {}
  };
  $('#voiceSendBtn').addEventListener('click', submitVoiceText);
  $('#voiceInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); submitVoiceText(); }
  });

  $('#btnVoiceUndo').addEventListener('click', () => doUndo('button'));

  $('#btnAutoJump').addEventListener('click', () => {
    const on = !autoJumpOn();
    setAutoJump(on);
    toast(on ? '自动定位已开启' : '自动定位已关闭', on ? 'ok' : '');
  });

  $('#btnVoiceHelp').addEventListener('click', () => {
    openSheet('文字批量登记说明', [
      '<div style="font-size:13.5px;line-height:1.85">',
      '<p style="margin:0 0 10px"><b>怎么用</b></p>',
      '<p style="margin:0 0 10px">在输入框里直接打序号或姓名，一次可以输入多个，回车或点「登记」提交：</p>',
      '<div class="hint" style="font-size:13px;background:#f7faf9;padding:10px;border-radius:9px;margin-bottom:12px">',
      '「十二号」「十二」「12」→ 都指向 12 号<br>',
      '「11 十二 13 14号」→ 一次批量登记多人<br>',
      '「张三」「张三 李四 王五」→ 依次标记<br>',
      '「一到十号」→ 1~10 号一次标完<br>',
      '「撤销」「撤回」「上一步」→ 撤销上一次（整句一起撤）',
      '</div>',

      '<p style="margin:0 0 8px"><b>打错了也能认出来</b></p>',
      '<p style="margin:0 0 12px;color:#5f716e">名字打得不对也没关系。系统会把没对上的片段转成<b>拼音</b>再比对一遍，'
      + '同音字（李娜/李那）直接命中，近音字（差一个字母）也能命中。这类结果带 <b>≈</b> 标记。'
      + '如果同一个读音在班里对应两个人，<b>宁可不动</b>，会在结果里提示，交给人工确认。</p>',

      '<p style="margin:0 0 8px"><b>一句话批量分类</b></p>',
      '<p style="margin:0 0 6px;color:#5f716e">句子里写出分类，这个分类就作用于这句话里的所有人：</p>',
      '<div class="hint" style="font-size:13px;background:#f7faf9;padding:10px;border-radius:9px;margin-bottom:10px">',
      '已交 / 交了 / 交齐 / 交完 → 已交<br>',
      '未交 / 没交 / 没带 / 没写 / 没做 → 未交<br>',
      '补交 / 补做 → 补交 &nbsp;·&nbsp; 请假 / 病假 / 事假 → 请假<br>',
      '免交 / 不用交 → 免交',
      '</div>',
      '<p style="margin:0 0 12px;color:#5f716e">还能一句话里换分类，用逗号隔开：<br>'
      + '「张三 李四 <b>补交</b>，王五 <b>请假</b>」<br>'
      + '「<b>全班</b> 已交」→ 全班一次标记（可用撤销整句还原）</p>',

      '<p style="margin:0 0 10px"><b>匹配规则</b></p>',
      '<p style="margin:0 0 12px;color:#5f716e">系统只在<b>当前班级名单</b>里做最长匹配：只有当名单里存在 12 号学生时，「十二」才会被识别成 12 号，绝不拆成 1 和 2。</p>',

      '<p style="margin:0 0 10px"><b>没写分类的时候</b></p>',
      '<p style="margin:0;color:#5f716e">句子里没出现分类词时，就用登记页上方下拉框的状态（默认「已交」）。</p>',
      '</div>'
    ].join(''));
  });

  // 快速输入
  const quickAdd = async () => {
    const raw = $('#quickInput').value.trim();
    if (!raw) return;
    if (!curHw()) { toast('请先选择一次作业', 'bad'); return; }
    const index = buildAliasIndex(S.classId);
    const res = parseUtterance(raw, index);
    const target = $('#quickStatus').value;
    if (!res.hits.length) { toast('名单里没有匹配到「' + raw + '」', 'bad'); return; }
    await setStatusBatch(res.hits.map(s => s.id), target, { source: 'manual', tag: S.quickTag || '' });
    $('#quickInput').value = '';
    renderRegister();
    flashStudents(res.hits.map(s => s.id));
    toast('已登记 ' + res.hits.map(s => s.no + ' ' + s.name).join('、'), 'ok');
  };
  $('#btnQuickAdd').addEventListener('click', quickAdd);
  $('#quickInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); quickAdd(); }
  });

  // 作业页
  $('#btnNewHw').addEventListener('click', () => openHwForm(null));

  // 错题页
  $('#misSeg').addEventListener('click', e => {
    const b = e.target.closest('button[data-tab]');
    if (!b) return;
    S.misTab = b.dataset.tab;
    renderMistake();
  });
  $('#btnAddMistake').addEventListener('click', () => openMistakeForm());

  // 文档导入 / 拍照转文字
  $('#fileHwDoc').addEventListener('change', async e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (f) await handleHwDocFile(f);
  });
  $('#fileDocCam').addEventListener('change', async e => {
    if (e.target.files && e.target.files.length) await handleDocPhotoFiles(e.target.files);
    e.target.value = '';
  });
  $('#fileDocLib').addEventListener('change', async e => {
    if (e.target.files && e.target.files.length) await handleDocPhotoFiles(e.target.files);
    e.target.value = '';
  });

  // 照片
  $('#filePhotoCam').addEventListener('change', async e => {
    if (e.target.files && e.target.files.length) await handlePhotoFiles(e.target.files);
    e.target.value = '';
  });
  $('#filePhotoLib').addEventListener('change', async e => {
    if (e.target.files && e.target.files.length) await handlePhotoFiles(e.target.files);
    e.target.value = '';
  });

  // 备份导入
  $('#fileImport').addEventListener('change', async e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (f) await importBackup(f);
  });

  // ---- 成绩页 ----
  const examInput = $('#examInput');
  examInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); submitExamInput(); }
  });
  $('#examAddBtn').addEventListener('click', submitExamInput);
  $('#examUndoBtn').addEventListener('click', () => undoExam());
  $('#examImportBtn').addEventListener('click', openScoreImport);
  $('#examTrendBtn').addEventListener('click', openTrendPicker);
  $('#examExportBtn').addEventListener('click', exportExamCSV);
  $('#examClearBtn').addEventListener('click', clearExamScores);
  $('#examVoiceHelp').addEventListener('click', openScoreHelp);
  $('#examSortSeg').addEventListener('click', e => {
    const b = e.target.closest('button[data-sort]');
    if (!b) return;
    S.examSort = b.dataset.sort;
    $$('#examSortSeg button').forEach(x => x.classList.toggle('on', x === b));
    renderExamRoster();
  });


  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
      e.preventDefault();
      if (S.view === 'exam') undoExam();
      else doUndo('button');
    }
  });

  // 说明：不做双击缩放拦截（会吞掉快速连点），改用 CSS touch-action:manipulation
}

/* 启动 */
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
</script>
</body>
</html>
