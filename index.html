      : '') +
    '<button class="btn pri" id="ntOk" style="width:100%;margin-top:6px">添加并选中</button>';
  const close = openSheet('添加分类', body, root => {
    const inp = root.querySelector('#ntIn');
    const listEl = root.querySelector('#ntList');
    const renderNtList = () => {
      if (!listEl) return;
      listEl.innerHTML = S.myTags.map(t =>
        '<button class="tp" data-edit="' + esc(t) + '">' + esc(t) + ' ✎</button>').join('');
    };
    if (listEl) {
      /* 点一下改名；按住拖动 = 调整顺序 */
      listEl.onpointerdown = ev => {
        const it = ev.target.closest('[data-edit]');
        if (!it) return;
        const t = it.dataset.edit, x0 = ev.clientX, y0 = ev.clientY;
        let moved = false, ghost = null, w = 0;
        const stop = () => {
          if (ghost) { ghost.remove(); ghost = null; }
          it.style.opacity = '';
          window.removeEventListener('pointermove', mv);
          window.removeEventListener('pointerup', up);
          window.removeEventListener('pointercancel', up);
        };
        const mv = e => {
          if (!moved) {
            if (Math.hypot(e.clientX - x0, e.clientY - y0) < 8) return;
            moved = true;
            w = it.offsetWidth;
            ghost = it.cloneNode(true);
            ghost.style.cssText = 'position:fixed;z-index:999;pointer-events:none;opacity:.92;' +
              'box-shadow:0 6px 18px rgba(15,50,45,.25);background:#fff;left:' + (x0 - w / 2) +
              'px;top:' + (y0 - 18) + 'px;width:' + w + 'px;';
            document.body.appendChild(ghost);
            it.style.opacity = .35;
          }
          ghost.style.left = (e.clientX - w / 2) + 'px';
          ghost.style.top = (e.clientY - 18) + 'px';
          const el = document.elementFromPoint(e.clientX, e.clientY);
          const tgt = el && el.closest ? el.closest('#ntList [data-edit]') : null;
          const tt = tgt && tgt.dataset.edit;
          if (tt && tt !== t) {
            const from = S.myTags.indexOf(t);
            if (from < 0) return;
            S.myTags.splice(from, 1);
            const to = S.myTags.indexOf(tt);
            if (to < 0) return;
            S.myTags.splice(to, 0, t);
            saveMyTags();
            renderNtList();
          }
        };
        const up = () => {
          const was = moved;
          stop();
          if (was) {
            listEl._skipClick = true;
            renderTagBar(); renderSubRow();     // 背后的分类条顺序同步
            setTimeout(() => { listEl._skipClick = false; }, 80);
          }
        };
        window.addEventListener('pointermove', mv);
        window.addEventListener('pointerup', up);
        window.addEventListener('pointercancel', up);
      };
      listEl.onclick = ev => {
        if (listEl._skipClick) return;

    inp.onkeydown = ev => { if (ev.key === 'Enter') { ev.preventDefault(); submit(); } };

function openRenameTag(oldT) {
  const body =
    '<div class="field"><label>分类名称</label>' +
      '<input id="rtIn" maxlength="12" value="' + esc(oldT) + '" autocomplete="off">' +
      '<div class="hint">改名会同步更新本次作业里已经打了这个分类的学生，筛选和「本次登记」也跟着换。</div>' +
    '</div>' +
    '<button class="btn pri" id="rtOk" style="width:100%;margin-top:6px">保存</button>';
  const close = openSheet('重命名分类', body, root => {
    const inp = root.querySelector('#rtIn');
    setTimeout(() => { try { inp.focus(); inp.select(); } catch (e) {} }, 120);
    const submit = async () => {
      const v = inp.value.trim().slice(0, 12);
      if (!v) { toast('请输入分类名', 'bad'); return; }
      if (v === oldT) { close(); return; }
      if (S.myTags.includes(v)) { toast('已经有「' + v + '」这个分类了，换个名字', 'bad'); return; }
      const n = await renameMyTag(oldT, v);
      close();
      renderRegister();
      toast(n ? '已改名为「' + v + '」，同步更新 ' + n + ' 名学生' : '已改名为「' + v + '」', 'ok');
    };
    root.querySelector('#rtOk').onclick = submit;
    inp.onkeydown = ev => { if (ev.key === 'Enter') { ev.preventDefault(); submit(); } };
  });
}

/** 改名：本次分类 + 当前作业里打过它的人一起改，筛选项跟着换 */
async function renameMyTag(oldT, newT) {
  const i = S.myTags.indexOf(oldT);
  if (i < 0) return 0;
  S.myTags[i] = newT;
  saveMyTags();
  let n = 0;
  const hw = curHw();
  if (hw) {
    for (const rec of S.records.values()) {
      if (rec.assignmentId !== hw.id) continue;
      const tags = rec.tags || [];
      if (!tags.includes(oldT)) continue;
      rec.tags = Array.from(new Set(tags.map(x => x === oldT ? newT : x)));
      await DB.put('records', rec);
      n++;
    }
  }
  if (S.quickTag === oldT) S.quickTag = newT;
  if (S.subTag === oldT) S.subTag = newT;
  if (S.filter === 'tag:' + oldT) S.filter = 'tag:' + newT;
  return n;
}

/** 本作业打了某个分类的人数 */
function countTagged(t) {
  const hw = curHw();
  if (!hw) return 0;
  let n = 0;
  S.records.forEach(r => { if (r.assignmentId === hw.id && (r.tags || []).includes(t)) n++; });
  return n;
}

/** 删除分类：从本次分类条移除 + 本次作业里学生身上的这个分类一并去掉 */
async function deleteMyTag(t) {
  removeMyTag(t);
  const hw = curHw();
  let n = 0;
  if (hw) {
    for (const rec of S.records.values()) {
      if (rec.assignmentId !== hw.id) continue;
      const tags = rec.tags || [];
      if (!tags.includes(t)) continue;
      rec.tags = tags.filter(x => x !== t);
      await DB.put('records', rec);
      n++;
    }
  }
  if (S.quickTag === t) S.quickTag = '';
  if (S.subTag === t) S.subTag = '';
  if (S.filter === 'tag:' + t) S.filter = 'tagged';
  return n;
}

function renderFilterRow() {
  const list = classStudents();
  const cnt = { all: list.length, pending: 0, submitted: 0, missing: 0, makeup: 0, leave: 0, exempt: 0 };
  let tagged = 0, excellent = 0;
  list.forEach(s => {
    const r = getRec(S.hwId, s.id);
    if (cnt[r.status] != null) cnt[r.status]++;
    if (r.tags && r.tags.length) tagged++;
    if (r.excellent) excellent++;
  });
  const items = [
    ['all', '全部'], ['pending', '未登记'], ['submitted', '已交'],
    ['missing', '未交'], ['makeup', '补交'], ['leave', '请假'], ['exempt', '免交']
  ];
  let html = '';
  html += items.map(([k, l]) =>
    '<button class="chip' + (S.filter === k ? ' active' : '') + '" data-f="' + k + '">' + l +
    '<span class="c">' + cnt[k] + '</span></button>'
  ).join('');
  html += '<button class="chip' + (S.filter === 'excellent' ? ' active' : '') + '" data-f="excellent">★ 优秀' +
    '<span class="c">' + excellent + '</span></button>';
  html += '<button class="chip' + (S.filter === 'tagged' ? ' active' : '') + '" data-f="tagged">有分类' +
    '<span class="c">' + tagged + '</span></button>';
  html += '<button class="chip sel-mode' + (S.selectMode ? ' active' : '') + '" id="chipSelect">' +
    (S.selectMode ? '退出多选' : '批量操作') + '</button>';
  const row = $('#filterRow');
  row.innerHTML = html;
  $$('.chip[data-f]', row).forEach(b => {
    b.onclick = () => {
      if (S.filter !== b.dataset.f) S.subTag = '';
      S.filter = b.dataset.f;
      S.selected.clear();
      renderRegister();
    };
  });
  $('#chipSelect').onclick = () => {
    S.selectMode = !S.selectMode;
    S.selected.clear();
    renderRegister();
  };
}

/** 「已交」的下一层：全部已交 + 本次手动添加过的分类（没加过的分类不出现） */
function renderSubRow() {
  const row = $('#subRow');
  if (!row) return;
  ensureMyTags();
  if (S.filter !== 'submitted' || !curHw() || !classStudents().length) {
    if (row.innerHTML) row.innerHTML = '';
    row.style.display = 'none';
    return;
  }
  const list = classStudents();
  const cntOf = t => list.filter(s => {
    const r = getRec(S.hwId, s.id);
    if (r.status !== 'submitted') return false;
    if (t === '__none') return !(r.tags || []).length;   // 已交但一个分类都没打
    return !t || (r.tags || []).includes(t);
  }).length;
  if (S.subTag && S.subTag !== '__none' && !S.myTags.includes(S.subTag)) S.subTag = '';

  let html = '<span class="sub-lb">已交</span><div class="sub-scroll" id="subScroll">' +
    '<button class="chip' + (S.subTag ? '' : ' active') + '" data-sub="">全部已交' +
    '<span class="c">' + cntOf('') + '</span></button>';
  html += S.myTags.map(t => {
    const n = cntOf(t);
    return '<button class="chip' + (S.subTag === t ? ' active' : '') + (n ? '' : ' zero') +
      '" data-sub="' + esc(t) + '" title="点一下只看这类，长按可改名或删除">' + esc(t) + '<span class="c">' + n + '</span></button>';
  }).join('');
  html += '</div>';
  // 兜底：已交但还没打分类的人，防止漏标（固定在右侧，任何宽度都看得见）
  const noneN = cntOf('__none');
  html += '<button class="chip none-chip' + (S.subTag === '__none' ? ' active' : '') + (noneN ? '' : ' zero') +
    '" data-sub="__none" title="已交但还没有分类的学生">未分类<span class="c">' + noneN + '</span></button>';
  row.innerHTML = html;
  row.style.display = '';
  $$('.chip[data-sub]', row).forEach(b => {
    b.onclick = () => {
      if (S.tagLongAt && Date.now() - S.tagLongAt < 600) { S.tagLongAt = 0; return; }
      S.subTag = b.dataset.sub || '';
      S.selected.clear();
      renderRegister();
    };
  });
  /* 长按二级条上的分类词，同样可以改名 / 移出 */
  row.onpointerdown = ev => {
    const b = ev.target.closest('.chip[data-sub]');
    if (!b || !b.dataset.sub || b.dataset.sub === '__none') return;
    const t = b.dataset.sub, x0 = ev.clientX, y0 = ev.clientY;
    if (row._pt) clearTimeout(row._pt);
    row._pt = setTimeout(() => {
      row._pt = null;
      S.tagLongAt = Date.now();
      openTagMenu(t);
    }, 550);
    row.onpointermove = e2 => {
      if (Math.abs(e2.clientX - x0) > 8 || Math.abs(e2.clientY - y0) > 8) {
        if (row._pt) { clearTimeout(row._pt); row._pt = null; }
      }
    };
  };
  row.onpointerup = row.onpointercancel = row.onpointerleave = () => {
    if (row._pt) { clearTimeout(row._pt); row._pt = null; }
  };
}

/** 当前筛选条件下实际显示的学生（批量全选只作用于这些人） */
function visibleStudents() {
  return classStudents().filter(s => {
    const r = getRec(S.hwId, s.id);
    if (S.filter === 'all') return true;
    if (S.filter === 'excellent') return !!r.excellent;
    if (S.filter === 'tagged') return r.tags && r.tags.length > 0;
    if (S.filter === 'submitted' && S.subTag) {
      if (S.subTag === '__none') return r.status === 'submitted' && !(r.tags || []).length;
      return r.status === 'submitted' && (r.tags || []).includes(S.subTag);
    }
    return r.status === S.filter;
  });
}

function renderRoster() {
  const list = classStudents();
  const hw = curHw();
  const wrap = $('#roster');

  if (!list.length) {
    wrap.innerHTML = '<div class="card"><div class="empty-state"><div class="big">当前班级还没有学生</div>' +
      '先导入名单才能开始登记<br><button class="btn pri sm" id="btnImportRoster" style="margin-top:10px">导入名单</button></div></div>';
    const b = $('#btnImportRoster');
    if (b) b.onclick = openRosterImport;
    return;
  }
  if (!hw) {
    wrap.innerHTML = '<div class="card"><div class="empty-state">选择一次作业后即可登记名单</div></div>';
    return;
  }

  const rows = visibleStudents();

  if (!rows.length) {
    wrap.innerHTML = '<div class="card"><div class="empty-state">该筛选条件下没有学生' +
      (S.filter !== 'all' ? '<br><span style="font-size:12px">点上方「全部」或其他状态可以查看其他学生</span>' : '') +
      '</div></div>';
    return;
  }

  wrap.innerHTML = rows.map(s => {
    const r = getRec(S.hwId, s.id);
    const st = STATUS[r.status] || STATUS.pending;
    const picked = S.selected.has(s.id);
    const tags = r.tags || [];
    const tagTxt = tags.length ? tags[0] + (tags.length > 1 ? '+' + (tags.length - 1) : '') : '';
    const noTxt = String(s.no).length < 2 ? '0' + s.no : String(s.no);

    return '<div class="stu' + (picked ? ' picked' : '') + '" data-sid="' + s.id + '" data-status="' + r.status + '">' +
      '<div class="stu-top">' +
        '<span class="stu-no">' + esc(noTxt) + '</span>' +
        '<span class="stu-name">' + esc(s.name) + '</span>' +
        (r.excellent ? '<span class="star">★</span>' : '') +
      '</div>' +
      '<div class="stu-bot">' +
        // 已交且有分类时不再重复写「已交」：底边绿条 + 分类色块已说明
        ((r.status === 'submitted' && tags.length) ? '' :
          '<span class="stu-st ' + st.cls + '">' + st.label + '</span>') +
        (tagTxt ? '<span class="stu-tagc" title="' + esc(tags.join('、')) + '">' + esc(tagTxt) + '</span>' : '') +
        (r.note ? '<span class="stu-nt">✎</span>' : '') +
      '</div>' +
      (S.selectMode ? '' : '<button class="stu-more" data-more="' + s.id + '" aria-label="详情">⋯</button>') +
    '</div>';
  }).join('');

  // 事件委托
  wrap.onclick = ev => {
    const moreBtn = ev.target.closest('.stu-more');
    if (moreBtn) { ev.stopPropagation(); openStudentSheet(moreBtn.dataset.more); return; }
    const row = ev.target.closest('.stu');
    if (!row) return;
    const sid = row.dataset.sid;
    // 长按刚触发（600ms 内）且就是这张卡 → 吞掉这次 click，避免刚选中又被点掉
    if (S.longPressedAt && Date.now() - S.longPressedAt < 600 &&
        (!S.longPressedSid || S.longPressedSid === sid)) {
      S.longPressedAt = 0; S.longPressedSid = '';
      return;
    }
    if (S.selectMode) {
      if (S.selected.has(sid)) S.selected.delete(sid); else S.selected.add(sid);
      row.classList.toggle('picked');
      renderBulkBar();
      return;
    }
    const cur = statusOf(sid);
    if (cur === 'submitted' || cur === 'makeup') {
      // 已交/补交单击**不再取消**：误触代价太高（把交了的同学标成没交）。
      // 想看详情或改状态，进详情面板点状态按钮；批量改走长按多选。
      openStudentSheet(sid);
      return;
    }
    const target = $('#quickStatus').value || 'submitted';
    setStatus(sid, target, { source: 'manual', tag: S.quickTag || '' }).then(ok => {
      renderRegister();
      flashStudents([sid]);
    });
  };

  /* 长按卡片（450ms）→ 进入批量模式并选中该生；手指一移动就取消，避免滚动误触 */
  const cancelPress = () => {
    if (wrap._pressT) { clearTimeout(wrap._pressT); wrap._pressT = null; }
  };
  let px = 0, py = 0, pSid = null;
  wrap.onpointerdown = ev => {
    if (ev.target.closest('.stu-more')) return;
    const row = ev.target.closest('.stu');
    if (!row) return;
    pSid = row.dataset.sid; px = ev.clientX; py = ev.clientY;
    cancelPress();
    wrap._pressT = setTimeout(() => {
      wrap._pressT = null;
      S.longPressedAt = Date.now();
      S.longPressedSid = pSid;
      if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }
      enterSelectMode(pSid);
    }, 450);
  };
  wrap.onpointermove = ev => {
    if (!wrap._pressT) return;
    if (Math.abs(ev.clientX - px) > 8 || Math.abs(ev.clientY - py) > 8) cancelPress();
  };
  wrap.onpointerup = cancelPress;
  wrap.onpointercancel = cancelPress;
  wrap.onpointerleave = cancelPress;
  // 桌面右键 / iOS 长按菜单：同样进批量，并阻止系统菜单
  wrap.oncontextmenu = ev => {
    const row = ev.target.closest('.stu');
    if (!row) return;
    ev.preventDefault();
    enterSelectMode(row.dataset.sid);
  };

  renderBulkBar();
}

/** 长按进入多选：就地更新卡片，不重建 DOM（手指还按在上面） */
function enterSelectMode(sid) {
  if (S.selectMode) {
    // 已在批量模式里再长按别人 = 把他加进来
    if (sid && !S.selected.has(sid)) {
      S.selected.add(sid);
      const el = document.querySelector('.stu[data-sid="' + sid + '"]');
      if (el) el.classList.add('picked');
      renderBulkBar();
    }
    return;
  }
  S.selectMode = true;
  S.selected.clear();
  if (sid) S.selected.add(sid);
  $$('#roster .stu').forEach(el => el.classList.toggle('picked', el.dataset.sid === sid));
  $$('#roster .stu-more').forEach(b => b.remove());
  renderFilterRow();
  renderBulkBar();
  toast('已进入批量模式，点其他人多选，再选分类', 'ok');
}

function renderBulkBar() {
  const bar = $('#bulkBar');
  const slot = $('#bulkSlot');
  const sync = () => {                    // 悬浮后给名单底部留出同高空间，最后几张卡不被遮
    if (slot) slot.style.height = (bar.style.display === 'none' ? '0px' : (bar.offsetHeight + 12) + 'px');
  };
  // 没有学生或没有当前作业时，批量条没有任何可执行动作，直接收起
  if (!classStudents().length || !curHw()) {
    bar.innerHTML = '';
    bar.style.display = 'none';
    sync();
    return;
  }
  bar.style.display = '';
  if (S.selectMode) {
    const n = S.selected.size;
    const all = visibleStudents();
    bar.classList.add('multi');
    bar.innerHTML =
      '<div class="bulk-status" id="bsRow">' +
        (n
          ? STATUS_KEYS.map(k =>
              '<button data-bs="' + k + '">' +
              '<i style="background:' + STATUS[k].color + '"></i>' + STATUS[k].label + '</button>'
            ).join('')
          : '<span class="bulk-tip">点学生卡片勾选（可多选），再选分类</span>'
        ) +
      '</div>' +
      '<div class="bulk-acts">' +
        '<button id="bSelectAll">' + (n === all.length ? '取消全选' : '全选') + '</button>' +
        '<button class="pri" id="bTag"' + (n ? '' : ' disabled') + '>分类 (' + n + ')</button>' +
        '<button class="danger" id="bSelCancel">退出</button>' +
      '</div>';
    $('#bsRow').onclick = async ev => {
      const b = ev.target.closest('button[data-bs]');
      if (!b || !S.selected.size) return;
      const st = b.dataset.bs;
      const ids = Array.from(S.selected);
      S.selectMode = false;
      S.selected.clear();
      const cnt = await setStatusBatch(ids, st, { source: 'bulk' });
      renderRegister();
      toast(cnt
        ? '已将 ' + cnt + ' 人设为「' + STATUS[st].label + '」，可撤销'
        : '这些人本来就是「' + STATUS[st].label + '」', cnt ? 'ok' : '');
    };
    $('#bSelectAll').onclick = () => {
      if (S.selected.size === all.length) S.selected.clear();
      else all.forEach(s => S.selected.add(s.id));
      renderRoster();
    };
    $('#bTag').onclick = () => { if (S.selected.size) openBatchTag(); };
    $('#bSelCancel').onclick = () => { S.selectMode = false; S.selected.clear(); renderRegister(); };
    sync();
    return;
  }
  bar.classList.remove('multi');
  const pendingCnt = classStudents().filter(s => statusOf(s.id) === 'pending').length;
  bar.innerHTML =
    '<button class="soft" id="bMissing">未登记→未交 (' + pendingCnt + ')</button>' +
    '<button id="bUndo">撤销</button>' +
    '<button id="bExport">导出名单</button>';
  $('#bMissing').onclick = bulkMarkMissing;
  $('#bUndo').onclick = () => doUndo('button');
  $('#bExport').onclick = () => openRosterExportSheet();
  sync();
}

function renderRegister() {
  renderHwBox();
  renderStatStrip();
  renderTagBar();
  renderFilterRow();
  renderSubRow();
  renderRoster();
  renderBulkBar();
  renderVoiceUI();
}

/* ---------------------------------------------------------------
   10. 学生详情 Sheet
   --------------------------------------------------------------- */
function openStudentSheet(sid) {
  const stu = S.students.find(s => s.id === sid);
  const hw = curHw();
  if (!stu || !hw) return;
  const r = getRec(hw.id, sid);
  ensureMyTags();
  // 只给「本次分类」+ 这个学生已经有的（旧分类仍可取消，但不再有预置列表）
  const allTags = Array.from(new Set([...(S.myTags || []), ...(r.tags || [])]));
  const tagSet = new Set(r.tags || []);

  const body =
    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">' +
      '<span class="stu-no" style="width:38px;height:38px;font-size:14px;background:#e6f4f2;color:#0b5c56">' + esc(stu.no) + '</span>' +
      '<div style="flex:1"><div style="font-size:17px;font-weight:700">' + esc(stu.name) + '</div>' +
      '<div style="font-size:12px;color:#8b9b98">' + esc(hw.title || '未命名作业') + '</div></div>' +
      '<button class="btn sm ghost" id="stEdit" style="padding:5px 11px;flex:none">编辑资料</button>' +
    '</div>' +
    '<div class="field"><label>作业状态</label><div class="status-grid" id="stGrid">' +
      STATUS_KEYS.map(k =>
        '<button class="status-btn' + (r.status === k ? ' on' : '') + '" data-s="' + k + '">' +
        '<span class="dot"></span>' + STATUS[k].label + '</button>'
      ).join('') +
    '</div></div>' +
    '<div class="field"><label>分类（单选，选新的自动替换旧的）</label><div class="tag-pick" id="tagPick">' +
      allTags.map(t => '<button class="tp' + (tagSet.has(t) ? ' on' : '') + '" data-t="' + esc(t) + '">' + esc(t) + '</button>').join('') +
    '</div>' +
    '<div style="display:flex;gap:7px;margin-top:8px"><input id="newTag" maxlength="12" placeholder="新建分类，如「优秀 / 不认真」" style="flex:1">' +
    '<button class="btn sm ghost" id="addTag">加入</button></div>' +
    (allTags.length ? '' : '<div class="hint" style="margin-top:7px">本次还没有分类，输入一个就会出现在名单上方。</div>') + '</div>' +
    '<div class="switch-row"><div><div class="t">优秀作业</div></div>' +
      '<div class="switch' + (r.excellent ? ' on' : '') + '" id="swExcellent"></div></div>' +
    '<div class="field" style="margin-top:12px"><label>备注</label>' +
      '<textarea id="stuNote" placeholder="如：未带作业本、课代表代收、第二题漏做…">' + esc(r.note || '') + '</textarea></div>' +
    '<div class="field"><label>快捷记录错题</label>' +
      '<div class="field-row"><input id="msQ" placeholder="题号 如 12 或 12(3)" style="flex:1">' +
      '<button class="btn sm pri" id="msAdd" style="flex:none;padding:0 14px">记入</button></div>' +
      '<input id="msK" list="knList" placeholder="知识点（可选）" style="margin-top:7px">' +
    '</div>';

  const close = openSheet('学生登记', body, (root) => {
    root.querySelector('#stGrid').addEventListener('click', async ev => {
      const b = ev.target.closest('.status-btn');
      if (!b) return;
      await setStatus(sid, b.dataset.s, { source: 'manual', force: true });
      $$('#stGrid .status-btn', root).forEach(x => x.classList.toggle('on', x === b));
      renderRegister();
    });

    root.querySelector('#tagPick').addEventListener('click', async ev => {
      const b = ev.target.closest('.tp');
      if (!b) return;
      const t = b.dataset.t;
      // 单选：点已选中的 = 清除；点别的 = 替换
      const next = (tagSet.has(t) && tagSet.size === 1) ? [] : [t];
      tagSet.clear();
      next.forEach(x => tagSet.add(x));
      $$('#tagPick .tp', root).forEach(x => x.classList.toggle('on', tagSet.has(x.dataset.t)));
      await patchRec(sid, { tags: Array.from(tagSet) });
      renderRegister();
    });

    root.querySelector('#addTag').addEventListener('click', async () => {
      const inp = root.querySelector('#newTag');
      const t = inp.value.trim().slice(0, 12);
      if (!t) return;
      tagSet.clear();
      tagSet.add(t);
      rememberTag(t);                      // 现场建的分类也进「本次分类」，方便筛选
      inp.value = '';
      await patchRec(sid, { tags: Array.from(tagSet) });
      const pick = root.querySelector('#tagPick');
      pick.querySelectorAll('.tp').forEach(x => x.classList.remove('on'));   // 单分类：其他全部取消
      const btn = document.createElement('button');
      btn.className = 'tp on';
      btn.dataset.t = t;
      btn.textContent = t;
      pick.appendChild(btn);
      renderRegister();
    });

    root.querySelector('#swExcellent').addEventListener('click', async ev => {
      const sw = ev.currentTarget;
      const val = !sw.classList.contains('on');
      sw.classList.toggle('on', val);
      await patchRec(sid, { excellent: val });
      renderRegister();
    });

    let noteTimer = null;
    root.querySelector('#stuNote').addEventListener('input', ev => {
      clearTimeout(noteTimer);
      const v = ev.target.value;
      noteTimer = setTimeout(() => patchRec(sid, { note: v }), 500);
    });

    root.querySelector('#msAdd').addEventListener('click', async () => {
      const q = root.querySelector('#msQ').value.trim();
      if (!q) { toast('请填写题号', 'bad'); return; }
      const k = root.querySelector('#msK').value.trim();
      await addMistake({ sid, questionNo: q, knowledge: k ? [k] : [], note: '' });
      root.querySelector('#msQ').value = '';
      root.querySelector('#msK').value = '';
      toast('已记录错题', 'ok');
      if (S.view === 'mistake') renderMistake();
    });

    root.querySelector('#stEdit').addEventListener('click', () => {
      close();
      setTimeout(() => openEditStudent(sid), 260);
    });
  });
  // 保证 datalist 存在
  ensureKnList();
}

function ensureKnList() {
  if ($('#knList')) return;
  const dl = document.createElement('datalist');
  dl.id = 'knList';
  dl.innerHTML = KN_PRESET.map(k => '<option value="' + esc(k) + '">').join('');
  document.body.appendChild(dl);
}

/** 分类词表 = 本次分类 + 学生身上已有的（用于语音识别与筛选，不再有预置） */
function collectAllTags() {
  const set = new Set(TAG_PRESET);
  (S.myTags || []).forEach(t => { if (t) set.add(t); });
  S.records.forEach(r => (r.tags || []).forEach(t => { if (t) set.add(t); }));
  return Array.from(set);
}

/* ---------------------------------------------------------------
   11. 批量分类：与「本次分类」共用同一套分类，不再有预置分类
   --------------------------------------------------------------- */
function openBatchTag() {
  const ids = Array.from(S.selected);
  ensureMyTags();
  let picked = '';
  const chipsHtml = () => S.myTags.map(t =>

      const inp = root.querySelector('#btNew');
      const t = inp.value.trim().slice(0, 12);

      if (!S.myTags.includes(t)) {
        if (S.myTags.length >= 12) { toast('本次最多 12 个分类，先长按删除一个', 'bad'); return; }
        rememberTag(t);                     // 同步进名单上方的「本次分类」条
      }
      picked = t;
      pick.innerHTML = chipsHtml();
      const em = root.querySelector('#btEmpty');
      if (em) em.style.display = 'none';
      inp.value = '';
      inp.focus();
    };
    root.querySelector('#btClear').onclick = async () => {
      if (!confirm('清除这 ' + ids.length + ' 名学生的分类？\n（可随后用撤销回退）')) return;
      for (const sid of ids) await patchRec(sid, { tags: [] }, { source: 'bulk' });
      close(); S.selectMode = false; S.selected.clear();
      renderRegister(); toast('已清除 ' + ids.length + ' 人的分类', 'ok');
    };
    root.querySelector('#btOk').onclick = async () => {
      if (!picked) { toast('请先点选一个分类', 'bad'); return; }
      for (const sid of ids) {
        await patchRec(sid, { tags: [picked] }, { source: 'bulk' });   // 替换式：只留这一个
      }
      close(); S.selectMode = false; S.selected.clear();
      renderRegister();
      toast('已把 ' + ids.length + ' 人设为：' + picked, 'ok');
    };
  });
}

  const list = classHw();

/* 照片选择处理 */
async function compressImage(file, maxSide, quality) {
  maxSide = maxSide || 1440;
  quality = quality || 0.72;
  const dataUrl = await new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = rej;
    fr.readAsDataURL(file);
  });
  const img = await new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = rej;
    im.src = dataUrl;
  });
  let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  const scale = Math.min(1, maxSide / Math.max(w, h));
  if (scale >= 1 && file.size < 380 * 1024) return dataUrl;
  w = Math.round(w * scale); h = Math.round(h * scale);
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
  ctx.drawImage(img, 0, 0, w, h);
  return cv.toDataURL('image/jpeg', quality);
}

async function handlePhotoFiles(files) {
  const arr = Array.from(files || []).filter(f => f.type && f.type.indexOf('image/') === 0);
  if (!arr.length) { toast('请选择图片文件', 'bad'); return; }
  toast('正在处理 ' + arr.length + ' 张照片…');
  let ok = 0;
  for (const f of arr) {
    try { hwFormPhotos.push(await compressImage(f)); ok++; }
    catch (e) { console.error('照片压缩失败', e); }
  }
  if (hwFormRedraw) hwFormRedraw();
  toast(ok ? ('已添加 ' + ok + ' 张照片') : '照片处理失败', ok ? 'ok' : 'bad');
}

/** 从 zip（docx/pptx）里抽取 XML 文本 */
function xmlParagraphText(xml, tag, sep) {
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const els = doc.getElementsByTagName(tag);
  const out = [];
  for (let i = 0; i < els.length; i++) {
    const t = (els[i].textContent || '').trim();
    if (t) out.push(t);
  }
  return out.join(sep);
}

/** docx：word/document.xml 按段落取文本 */
async function extractDocx(file) {
  const entries = await unzip(await file.arrayBuffer());
  const e = entries.get('word/document.xml');
  if (!e || !e.bytes) throw new Error('docx 里找不到正文');
  return xmlParagraphText(new TextDecoder('utf-8').decode(e.bytes), 'w:p', '\n');
}

/** pptx：所有幻灯片的 a:t 文本，按页合并 */
async function extractPptx(file) {
  const entries = await unzip(await file.arrayBuffer());
  const slides = Array.from(entries.keys())
    .filter(n => /^ppt\/slides\/slide\d+\.xml$/.test(n))
    .sort((a, b) => (parseInt(a.match(/slide(\d+)/)[1], 10)) - (parseInt(b.match(/slide(\d+)/)[1], 10)));
  if (!slides.length) throw new Error('pptx 里找不到幻灯片');
  const dec = new TextDecoder('utf-8');
  const pages = slides.map(n => xmlParagraphText(dec.decode(entries.get(n).bytes), 'a:t', ' '));
  return pages.filter(Boolean).join('\n');
}

/** pdf：懒加载 pdf.js（CDN）后逐页取文本 */
async function ensurePdfJs() {
  if (window.pdfjsLib) return window.pdfjsLib;
  const srcs = [
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
    'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js',
    'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js'
  ];
  for (const src of srcs) {
    try {
      await new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = res; s.onerror = () => rej(new Error('load fail'));
        document.head.appendChild(s);
      });
      break;
    } catch (e) { if (src === srcs[srcs.length - 1]) throw new Error('PDF 解析组件加载失败，请检查网络'); }
  }
  window.pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  return window.pdfjsLib;
}

async function extractPdf(file, onProg) {
  const lib = await ensurePdfJs();
  const pdf = await lib.getDocument({ data: await file.arrayBuffer() }).promise;
  let out = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const tc = await page.getTextContent();
    out += tc.items.map(it => it.str || '').join(' ') + '\n';
    if (onProg) onProg(i, pdf.numPages);
  }
  return out.trim();
}

/** txt / md / csv：utf-8 优先，乱码多时退回 gbk */
function decodeTextAuto(buf) {
  const dec = new TextDecoder('utf-8', { fatal: false });
  const s = dec.decode(buf);
  const bad = (s.match(/\uFFFD/g) || []).length;
  if (bad > Math.max(4, s.length * 0.02)) {
    try { return new TextDecoder('gbk').decode(buf); } catch (e) { /* 忽略 */ }
  }
  return s;
}

/** 统一入口：按扩展名分发 */
async function extractDocText(file, onProg) {
  const name = (file.name || '').toLowerCase();
  if (name.endsWith('.docx')) return extractDocx(file);
  if (name.endsWith('.pptx')) return extractPptx(file);
  if (name.endsWith('.pdf')) return extractPdf(file, onProg);
  if (/\.(txt|md|csv|log)$/.test(name)) return decodeTextAuto(new Uint8Array(await file.arrayBuffer()));
  throw new Error('暂不支持该格式（可另存为 docx / pdf / txt）');
}

/** 拍照 OCR：懒加载 tesseract.js（CDN），中文模型 */
let _tsWorker = null;
async function ensureTesseract(onProg) {
  if (!window.Tesseract) {
    const srcs = [
      'https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js',
      'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js',
      'https://unpkg.com/tesseract.js@5/dist/tesseract.min.js'
    ];
    for (const src of srcs) {
      try {
        await new Promise((res, rej) => {
          const s = document.createElement('script');
          s.src = src;
          s.onload = res; s.onerror = () => rej(new Error('load fail'));
          document.head.appendChild(s);
        });
        break;
      } catch (e) { if (src === srcs[srcs.length - 1]) throw new Error('识别组件加载失败，请检查网络'); }
    }
  }
  if (!_tsWorker) {
    _tsWorker = await window.Tesseract.createWorker('chi_sim', 1, {
      logger: m => { if (onProg && m.progress) onProg(m.progress); }
    });
  }
  return _tsWorker;
}

/** dataUrl 图片 → 文本 */
async function ocrImage(dataUrl, onProg) {
  try {
    const worker = await ensureTesseract(onProg);
    const { data } = await worker.recognize(dataUrl);
    return (data.text || '').replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
  } catch (e) {
    console.error('OCR 失败', e);
    toast(e.message || '文字识别失败', 'bad');
    return '';
  }
}

/** 从文本里识别题号：行首「12.」/「12、」/「（12）」/「第12题」/「12(3)」 */
function parseQNums(text) {
  if (!text) return [];
  const out = [], seen = new Set();
  const push = v => {
    v = String(v).trim();
    if (v && !seen.has(v) && out.length < 80) { seen.add(v); out.push(v); }
  };
  let m;
  const re1 = /(^|\n)\s*([0-9]{1,3})\s*[．.、,，)）:：]/g;
  while ((m = re1.exec(text))) push(m[2]);
  const re2 = /第\s*([0-9]{1,3})\s*题/g;
  while ((m = re2.exec(text))) push(m[1]);
  const re3 = /(^|\n|\s)([0-9]{1,3})\s*[（(]\s*([0-9]{1,2})\s*[)）]/g;
  while ((m = re3.exec(text))) push(m[2] + '(' + m[3] + ')');
  return out.sort((a, b) => (parseFloat(a) || 0) - (parseFloat(b) || 0));
}

/** 处理作业文档导入（表单打开时） */
async function handleHwDocFile(file) {
  if (!hwFormOcrTarget) { toast('请先打开作业表单再导入文档', 'bad'); return; }
  toast('正在解析 ' + (file.name || '文档') + '…');
  try {
    let txt = '';
    if (/\.pdf$/i.test(file.name || '')) {
      txt = await extractDocText(file, (i, n) => { toast('PDF 第 ' + i + '/' + n + ' 页…'); });
    } else {
      txt = await extractDocText(file);
    }
    txt = (txt || '').trim();
    if (!txt) { toast('文档里没有提取到文字（可能是扫描件，请拍照识别）', 'bad'); return; }
    hwFormDocName = file.name || '文档';
    const ta = hwFormOcrTarget();
    ta.value = (ta.value ? ta.value.replace(/\s+$/, '') + '\n\n' : '') + txt;
    if (hwFormDocRefresh) hwFormDocRefresh();
    toast('已导入 ' + txt.length + ' 字，题号已识别', 'ok');
  } catch (e) {
    console.error(e);
    toast(e.message || '文档解析失败', 'bad');
  }
}

/** 处理「拍照转文字」的图片（直接 OCR 进作业内容，不留底） */
async function handleDocPhotoFiles(files) {
  const arr = Array.from(files || []).filter(f => f.type && f.type.indexOf('image/') === 0);
  if (!arr.length) { toast('请选择图片文件', 'bad'); return; }
  if (!hwFormOcrDone) { toast('请先打开作业表单', 'bad'); return; }
  for (let i = 0; i < arr.length; i++) {
    toast('识别第 ' + (i + 1) + '/' + arr.length + ' 张…');
    const dataUrl = await compressImage(arr[i], 1600, 0.85);
    const txt = await ocrImage(dataUrl);
    if (txt) hwFormOcrDone(txt);
  }
  toast('识别完成，文字已填进作业内容', 'ok');
}

/* ---- 作业类型管理 ---- */
function openTypeMgr() {
  const body =
    '<div class="field"><label>已有类型（点一下改名）</label>' +
      '<div class="tag-pick" id="tmList"></div></div>' +
    '<div style="display:flex;gap:7px;margin-top:8px"><input id="tmNew" maxlength="8" placeholder="新类型，如：默写 / 卷子 / 预习" style="flex:1">' +
      '<button class="btn sm ghost" id="tmAdd">加入</button></div>' +
    '<div class="hint" style="margin-top:10px">删除类型只影响列表，已有作业上的类型字样会保留。颜色按顺序自动分配。</div>';
  const close = openSheet('作业类型管理', body, root => {
    const listEl = root.querySelector('#tmList');
    const draw = () => {
      listEl.innerHTML = classTypes().map(k =>
        '<button class="tp" data-k="' + esc(k) + '">' + esc(k) + ' <i style="font-style:normal;opacity:.55">✎</i></button>').join('') +
        (classTypes().length ? '' : '<span style="font-size:12.5px;color:#8b9b98">暂无类型，先在下面加入</span>');
    };
    draw();
    listEl.onclick = ev => {
      const b = ev.target.closest('.tp');
      if (!b) return;
      const old = b.dataset.k;
      const v = prompt('修改类型名称', old);
      if (v === null) return;
      const nv = v.trim().slice(0, 8);
      if (!nv) { toast('名称不能为空', 'bad'); return; }
      if (nv !== old && classTypes().includes(nv)) { toast('已有同名类型', 'bad'); return; }
      const list = classTypes();
      list[list.indexOf(old)] = nv;
      saveTypes().then(() => renderAll());
      S.assignments.forEach(a => { if (a.classId === S.classId && a.typeLabel === old) { a.typeLabel = nv; a.type = nv; DB.put('assignments', a); } });
      draw();
      toast('已改名', 'ok');
    };
    root.querySelector('#tmAdd').onclick = async () => {
      const v = root.querySelector('#tmNew').value.trim().slice(0, 8);
      if (!v) { toast('请填写类型名', 'bad'); return; }
      if (classTypes().includes(v)) { toast('已有同名类型', 'bad'); return; }
      classTypes().push(v);
      await saveTypes();
      root.querySelector('#tmNew').value = '';
      draw();
      toast('已加入类型：' + v, 'ok');
    };
    // 删除入口：长按类型词
    let press = null;
    const el = listEl;
    el.addEventListener('contextmenu', ev => {
      const b = ev.target.closest('.tp');
      if (!b) return;
      ev.preventDefault();
      delType(b.dataset.k, draw);
    });
    el.addEventListener('touchstart', ev => {
      const b = ev.target.closest('.tp');
      if (!b) return;
      press = setTimeout(() => { press = null; delType(b.dataset.k, draw); }, 600);
    }, { passive: true });
    el.addEventListener('touchend', () => { if (press) { clearTimeout(press); press = null; } });
    el.addEventListener('pointerdown', ev => {
      const b = ev.target.closest('.tp');
      if (!b || ev.pointerType !== 'mouse') return;
      press = setTimeout(() => { press = null; delType(b.dataset.k, draw); }, 600);
    });
    el.addEventListener('pointerup', () => { if (press) { clearTimeout(press); press = null; } });
  });
}
function delType(k, redraw) {
  if (!confirm('删除类型「' + k + '」？\n已有作业上的这个类型字样会保留，仅从可选列表移除。')) return;
  const list = classTypes();
  const i = list.indexOf(k);
  if (i >= 0) list.splice(i, 1);
  saveTypes().then(() => renderAll());
  redraw();
  toast('已删除类型：' + k, 'ok');
}

async function addMistake(o) {
  const hwId = o.hwId !== undefined ? o.hwId : (S.hwId || '');
  const hw = S.assignments.find(a => a.id === hwId) || null;
  const stu = o.sid ? S.students.find(s => s.id === o.sid) : null;
  const cnt = Math.max(1, Number(o.count) || 1);
  const m = {
    id: uid(),
    classId: S.classId,
    assignmentId: hw ? hw.id : '',
    assignmentTitle: hw ? hw.title : '',
    studentId: stu ? stu.id : '',
    studentName: stu ? stu.name : '',
    studentNo: stu ? stu.no : '',
    count: stu ? 1 : cnt,
    questionNo: String(o.questionNo || '').trim(),
    knowledge: Array.isArray(o.knowledge) ? o.knowledge.filter(Boolean) : (o.knowledge ? [o.knowledge] : []),
    note: o.note || '',
    createdAt: Date.now()
  };
  S.mistakes.unshift(m);
  await DB.put('mistakes', m);
  await addLog({ classId: S.classId, hwId: m.assignmentId, sid: m.studentId, name: m.studentName,
    from: '错题', to: '第 ' + m.questionNo + ' 题' + (m.count > 1 ? '·' + m.count + ' 人' : '') + (m.knowledge.length ? '·' + m.knowledge.join('/') : ''), source: 'manual' });
  return m;
}

/** 记录的「人次」：点名记录 1 人次，未点名的按填的人数 */
function mkCount(m) { return Math.max(1, Number(m.count) || 1); }

function renderMistake() {
  const seg = $('#misSeg');
  $$('button', seg).forEach(b => b.classList.toggle('on', b.dataset.tab === S.misTab));
  const body = $('#misBody');
  const list = classMistakes();

  if (!list.length) {
    body.innerHTML = '<div class="empty-state"><div class="big">还没有错题记录</div>点右上角「+ 记录错题」开始</div>';
    return;
  }

  if (S.misTab === 'q') {
    const map = new Map();
    list.forEach(m => {
      if (!map.has(m.questionNo)) map.set(m.questionNo, { q: m.questionNo, items: [] });
      map.get(m.questionNo).items.push(m);
    });
    const arr = Array.from(map.values()).sort((a, b) => {
      const na = parseFloat(a.q), nb = parseFloat(b.q);
      if (!isNaN(na) && !isNaN(nb) && na !== nb) return na - nb;
      return String(a.q).localeCompare(String(b.q), 'zh');
    });
    body.innerHTML = arr.map(g => {
      const named = Array.from(new Set(g.items.map(m => m.studentName).filter(Boolean)));
      const unpt = g.items.filter(m => !m.studentId).reduce((s, m) => s + mkCount(m), 0);
      const n = g.items.reduce((s, m) => s + mkCount(m), 0);
      const kn = Array.from(new Set(g.items.flatMap(m => m.knowledge))).filter(Boolean);
      return '<div class="mis-row"><div class="mis-q">' + esc(g.q) + ' 题</div>' +
        '<div class="mis-main"><div class="who">' + n + ' 人次</div>' +
        (named.length ? '<div class="kn">' + esc(named.join('、')) + '</div>' : '') +
        (unpt ? '<div class="kn">另有 ' + unpt + ' 人（未点名）</div>' : '') +
        (kn.length ? '<div class="nt">知识点：' + esc(kn.join('、')) + '</div>' : '') +
        '</div></div>';
    }).join('');
  } else if (S.misTab === 'k') {
    const map = new Map();
    list.forEach(m => {
      const ks = m.knowledge.length ? m.knowledge : ['（未标注）'];
      ks.forEach(k => {
        if (!map.has(k)) map.set(k, []);
        map.get(k).push(m);
      });
    });
    const arr = Array.from(map.entries()).sort((a, b) =>
      b[1].reduce((s, m) => s + mkCount(m), 0) - a[1].reduce((s, m) => s + mkCount(m), 0));
    const max = arr.length ? arr[0][1].reduce((s, m) => s + mkCount(m), 0) : 1;
    body.innerHTML = arr.map(([k, items]) => {
      const n = items.reduce((s, m) => s + mkCount(m), 0);
      const students = Array.from(new Set(items.map(m => m.studentName).filter(Boolean)));
      return '<div class="bar-item"><div class="bl"><b>' + esc(k) + '</b><span>' + n + ' 人次 · ' + students.length + ' 人</span></div>' +
        '<div class="bar-track"><i style="width:' + Math.round(n / max * 100) + '%"></i></div>' +
        '<div class="nt" style="font-size:11.5px;color:#8b9b98;margin-top:3px;word-break:break-word">' +
        esc(students.slice(0, 10).join('、')) + (students.length > 10 ? '…' : '') +
        (items.some(m => !m.studentId) ? (students.length ? ' · ' : '') + '含未点名记录' : '') + '</div></div>';
    }).join('');
  } else if (S.misTab === 's') {
    const map = new Map();
    list.forEach(m => {
      if (!m.studentId) return;
      const k = m.studentId;
      if (!map.has(k)) map.set(k, { name: m.studentName, no: m.studentNo, items: [] });
      map.get(k).items.push(m);
    });
    const arr = Array.from(map.values()).sort((a, b) => b.items.length - a.items.length);
    body.innerHTML = arr.map(g => {
      const qs = g.items.map(m => m.questionNo).join('、');
      const kn = Array.from(new Set(g.items.flatMap(m => m.knowledge))).filter(Boolean);
      return '<div class="mis-row"><div class="mis-q" style="background:#e6f4f2;color:#0b5c56">' + esc(g.no) + '</div>' +
        '<div class="mis-main"><div class="who">' + esc(g.name) + ' <span style="font-weight:400;color:#8b9b98;font-size:12px">' + g.items.length + ' 处</span></div>' +
        '<div class="kn">题号：' + esc(qs) + '</div>' +
        (kn.length ? '<div class="nt">' + esc(kn.join('、')) + '</div>' : '') +
        '</div></div>';
    }).join('');
  } else {
    // 按班级：跨班级对比
    const map = new Map();
    S.mistakes.forEach(m => {
      if (!map.has(m.classId)) map.set(m.classId, []);
      map.get(m.classId).push(m);
    });
    const arr = Array.from(map.entries()).sort((a, b) =>
      b[1].reduce((s, m) => s + mkCount(m), 0) - a[1].reduce((s, m) => s + mkCount(m), 0));
    const max = arr.length ? arr[0][1].reduce((s, m) => s + mkCount(m), 0) : 1;
    body.innerHTML = arr.map(([cid, items]) => {
      const c = S.classes.find(x => x.id === cid);
      const stuCnt = new Set(items.map(m => m.studentId).filter(Boolean)).size;
      const n = items.reduce((s, m) => s + mkCount(m), 0);
      return '<div class="bar-item"><div class="bl"><b>' + esc(c ? c.name : '未知班级') + '</b><span>' + n + ' 人次 · ' + stuCnt + ' 人</span></div>' +
        '<div class="bar-track"><i style="width:' + Math.round(n / max * 100) + '%"></i></div></div>';
    }).join('') +
      '<div class="hint" style="margin-top:10px">按班级隔离存储，此处为全班汇总。</div>';
  }
}

      if (sSet.size) {
        for (const sid of sSet) {
          await addMistake({ hwId: hwIdSel, sid, questionNo: q, knowledge: kn, note });
        }
        toast('已为 ' + sSet.size + ' 名学生记录错题', 'ok');
      } else {
        const n = Math.floor(Number(cntInp.value));
        if (!isFinite(n) || n < 1) { toast('请填写错误人数（至少 1）', 'bad'); return; }
        await addMistake({ hwId: hwIdSel, sid: '', count: n, questionNo: q, knowledge: kn, note });
        toast('已记录：第 ' + q + ' 题 ' + n + ' 人', 'ok');
      }
      close();
      renderMistake();
    };
  });
}

function renderStats() {
  const list = classStudents();
  const hw = curHw();
  const cid = S.classId;
  const cls = curClass();

  const cnt = { pending: 0, submitted: 0, missing: 0, makeup: 0, leave: 0, exempt: 0 };
  list.forEach(s => { const st = statusOf(s.id); if (cnt[st] != null) cnt[st]++; });
  const total = list.length;
  const due = total - cnt.leave - cnt.exempt;
  const done = cnt.submitted + cnt.makeup;
  const rate = due > 0 ? Math.round(done / due * 100) : 0;

  // 环形图
  const R = 44, C = 2 * Math.PI * R;
  let offset = 0;
  const segs = STATUS_KEYS.filter(k => cnt[k] > 0).map(k => {
    const frac = total ? cnt[k] / total : 0;
    const len = frac * C;
    const seg = '<circle cx="52" cy="52" r="' + R + '" fill="none" stroke="' + STATUS[k].color +
      '" stroke-width="13" stroke-dasharray="' + len + ' ' + (C - len) + '" stroke-dashoffset="' + (-offset) + '"/>';
    offset += len;
    return seg;
  }).join('');

    '<div class="lg"><i style="background:' + STATUS[k].color + '"></i><span class="nm">' + STATUS[k].label +

  // 错题

        '<circle cx="52" cy="52" r="' + R + '" fill="none" stroke="#eef3f2" stroke-width="13"/>' + segs +
      '</svg><div class="ctr"><div class="p">' + rate + '%</div><div class="l">上交率</div></div></div>' +
      '<div class="legend">' + legend + '</div>' +
    '</div>' +
    '<div class="stat-line">' +

    '</div>' +
    (tagArr.length ?

      tagArr.map(([t, n]) =>

      (S.logExpand && logs.length > 8 ? '<button class="log-more" id="logLess">收起</button>' : ''));

  const lm = $('#logMore');

  if (ll) ll.onclick = () => { S.logExpand = false; renderStats(); };
}

/* ---- CSV 工具 ---- */
function download(filename, content, mime) {
  const blob = new Blob(['\uFEFF' + content], { type: mime || 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 200);
}
function csvCell(v) {
  const s = String(v == null ? '' : v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function toCSV(rows) {
  return rows.map(r => r.map(csvCell).join(',')).join('\r\n');
}
function todayStr() {
  const d = new Date();
  return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
}
/** 文件名去掉系统非法字符，避免 iOS 下载失败 */
function safeName(s) {
  return String(s || '').replace(/[\\/:*?"<>|\r\n\t]/g, '_').replace(/_+/g, '_').slice(0, 80);
}
/** 复制到剪贴板（iOS 上优先 clipboard API，失败回退 execCommand） */
async function copyText(t) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(t);
      return true;
    }
  } catch (e) {}
  try {
    const ta = document.createElement('textarea');
    ta.value = t;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, t.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}

/** 本次作业的分类顺序：先用手动添加的顺序，再补上记录里出现过的其他分类 */
function tagOrderOfHw() {
  const order = S.myTags.slice();
  S.records.forEach(r => {
    if (r.assignmentId !== S.hwId) return;
    (r.tags || []).forEach(t => { if (t && !order.includes(t)) order.push(t); });
  });
  return order;
}

/** 学生在本作业的归类：分类顺序里最早命中的那个 */
function tagGroupOf(r, order) {
  const ts = (r && r.tags) || [];
  for (const t of order) if (ts.includes(t)) return t;
  return '';
}

function openRosterExportSheet() {
  const hw = curHw();
  const list = classStudents();
  if (!list.length) { toast('当前班级没有学生', 'bad'); return; }
  const order = tagOrderOfHw();
  const cnt = new Map();
  list.forEach(s => {
    const g = tagGroupOf(getRec(S.hwId, s.id), order);
    cnt.set(g, (cnt.get(g) || 0) + 1);
  });
  const named = order.filter(t => cnt.get(t));
  const grpTxt = named.map(t => t + ' ' + cnt.get(t)).join(' · ');
  const noneN = cnt.get('') || 0;

  const body =
    '<div class="hint" style="margin-top:0">当前作业：<b>' + esc(hw ? hw.title : '未选作业') + '</b>' +
      ' · ' + list.length + ' 人</div>' +

      '<div class="t">按学号排序导出</div>' +
      '<div class="d">按名单顺序一行一人，适合和班级花名册核对。</div>' +
    '</button>' +
    '<button class="exp-opt" data-mode="tag"' + (named.length ? '' : ' disabled') + '>' +

        ? '同一类的学生排在一起，分类按「本次分类」添加的先后排列：' + esc(grpTxt) +
          (noneN ? ' · 未分类 ' + noneN : '')
        : '这次作业还没有分类，先在名单上方「＋ 添加」几个分类再导出。') + '</div>' +
    '</button>' +
    '<div class="hint">两种方式都会带「分类」列；按分类导出时，文件末尾还有分类人数汇总，方便后续跟踪。</div>';

  const close = openSheet('导出登记情况', body, root => {
    root.querySelectorAll('.exp-opt[data-mode]').forEach(b => {
      if (b.disabled) return;
      b.onclick = () => { close(); exportRosterCSV(b.dataset.mode); };
    });

function exportRosterCSV(mode) {
  mode = mode === 'tag' ? 'tag' : 'no';
  const hw = curHw();
  const cls = curClass();
  const list = classStudents();
  if (!list.length) { toast('当前班级没有学生', 'bad'); return; }
  const order = tagOrderOfHw();
  const data = list.map(s => {
    const r = getRec(S.hwId, s.id);
    return { s, r, g: tagGroupOf(r, order) };
  });
  if (mode === 'tag') {
    const pos = t => { const i = order.indexOf(t); return i < 0 ? 9999 : i; };
    data.sort((a, b) => (pos(a.g) - pos(b.g)) || (a.s.no - b.s.no));
  }
  const head = ['序号', '姓名', '分类', '状态', '优秀作业', '备注',
    '作业标题', '作业类型', '布置时间', '截止时间', '记录更新时间'];
  const rows = [head];
  data.forEach(({ s, r }) => {
    rows.push([
      s.no, s.name, (r.tags || []).join(' / '),
      STATUS[r.status] ? STATUS[r.status].label : '未登记',
      r.excellent ? '是' : '',
      r.note || '',
      hw ? hw.title : '',
      hw ? hwTypeOf(hw).label : '',
      hw ? fmtFull(hw.assignedAt) : '',
      hw ? fmtFull(hw.dueAt) : '',
      r.updatedAt ? fmtFull(r.updatedAt) : ''
    ]);
  });

  if (mode === 'tag') {
    rows.push([]);
    rows.push(['分类汇总', '人数']);
    order.forEach(t => {
      const n = data.filter(x => x.g === t).length;
      if (n) rows.push([t, n]);
    });
    const n0 = data.filter(x => !x.g).length;
    if (n0) rows.push(['未分类', n0]);
  }

  const cnt = { pending: 0, submitted: 0, missing: 0, makeup: 0, leave: 0, exempt: 0 };
  data.forEach(x => { cnt[statusOf(x.s.id)]++; });
  rows.push([]);
  rows.push(['合计', list.length + ' 人', '已交', cnt.submitted + cnt.makeup,
    '未交', cnt.missing, '未登记', cnt.pending, '请假', cnt.leave, '免交', cnt.exempt]);

  const name = safeName((cls ? cls.name : '班级') + '_' + (hw ? hw.title : '未选作业') +
    '_' + (mode === 'tag' ? '按分类' : '按学号') + '_' + todayStr()) + '.csv';
  download(name, toCSV(rows));
  toast(mode === 'tag' ? '已按分类顺序导出' : '已按学号顺序导出', 'ok');
}

/* ---------------------------------------------------------------
   单次作业的「未交名单」：查看 / 复制 / 导出
   --------------------------------------------------------------- */
function openMissSheet(hwId) {
  const hw = S.assignments.find(a => a.id === hwId);
  if (!hw) return;
  const list = classStudents(hw.classId);
  if (!list.length) { toast('该班级还没有学生', 'bad'); return; }
  const cls = S.classes.find(c => c.id === hw.classId);
  const stOf = s => getRec(hw.id, s.id).status;

  const miss = list.filter(s => stOf(s) === 'missing');
  const pend = list.filter(s => stOf(s) === 'pending');
  const doneN = list.filter(s => { const st = stOf(s); return st === 'submitted' || st === 'makeup'; }).length;
  const rate = list.length ? Math.round(doneN / list.length * 100) : 0;

  let withPend = false;

  const body =
    '<div class="miss-sum">' +
      '<div><b style="color:#cf3a3a">' + miss.length + '</b><span>未交</span></div>' +
      '<div><b style="color:#8b9b98">' + pend.length + '</b><span>未登记</span></div>' +
      '<div><b style="color:#0f9155">' + doneN + '</b><span>已交 · ' + rate + '%</span></div>' +
    '</div>' +
    (pend.length
      ? '<div class="switch-row" style="margin-top:12px">' +
          '<div><div class="t">同时包含未登记</div><div class="d">' + pend.length + ' 人还没登记，一起列出</div></div>' +
          '<div class="switch" id="msPend"></div>' +
        '</div>'
      : '') +
    '<div class="miss-list" id="msList"></div>' +
    '<div style="display:flex;gap:8px;margin-top:14px">' +
      '<button class="btn" id="msCopy" style="flex:1">复制姓名</button>' +
      '<button class="btn pri" id="msCsv" style="flex:1">导出 CSV</button>' +
    '</div>' +
    '<div class="hint" style="margin-top:9px;line-height:1.6">复制出的姓名用「、」相连，可直接粘到微信里发课代表。</div>';

  const close = openSheet('未交名单 · ' + (cls ? cls.name : ''), body, root => {
    const sw = root.querySelector('#msPend');
    const listBox = root.querySelector('#msList');
    const btnCopy = root.querySelector('#msCopy');
    const btnCsv = root.querySelector('#msCsv');

    const current = () => withPend ? miss.concat(pend) : miss.slice();

    const draw = () => {
      const arr = current();
      listBox.innerHTML = arr.length
        ? arr.map(s => {
            const isP = stOf(s) === 'pending';
            const noTxt = String(s.no).length < 2 ? '0' + s.no : String(s.no);
            return '<span class="miss-chip' + (isP ? ' p' : '') + '"><em>' + esc(noTxt) + '</em>' +
              esc(s.name) + '</span>';
          }).join('')
        : '<div class="empty-state" style="padding:18px 0 6px">' +
            (miss.length ? '已取消勾选' : '本班没有未交学生') + '</div>';
      const empty = arr.length === 0;
      btnCopy.disabled = empty;
      btnCsv.disabled = empty;
      btnCopy.style.opacity = empty ? .45 : 1;
      btnCsv.style.opacity = empty ? .45 : 1;
    };

    if (sw) {
      sw.onclick = () => {
        withPend = !withPend;
        sw.classList.toggle('on', withPend);
        draw();
      };
    }

    btnCopy.onclick = async () => {
      const names = current().map(s => s.name);
      if (!names.length) return;
      const ok = await copyText(names.join('、'));
      toast(ok ? '已复制 ' + names.length + ' 个姓名' : '复制失败，请长按列表手动选择', ok ? 'ok' : 'bad');
    };

    btnCsv.onclick = () => {
      const arr = current();
      if (!arr.length) return;
      exportMissCSV(hw, cls, arr);
      close();
    };

    draw();
  });
}

function exportMissCSV(hw, cls, arr) {

  const rows = [head];
  arr.forEach(s => {
    const r = getRec(hw.id, s.id);
    rows.push([
      s.no, s.name, STATUS[r.status] ? STATUS[r.status].label : '未登记',
      (r.tags || []).join(' / '), r.note || '',
      hw.title || '', hw.dueAt ? fmtFull(hw.dueAt) : ''
    ]);
  });
  rows.push(['', '合计 ' + arr.length + ' 人', '', '', '', '', '']);
  const fn = safeName((cls ? cls.name : '班级') + '_' + (hw.title || '作业') + '_未交名单_' + todayStr()) + '.csv';

  toast('未交名单已导出（' + arr.length + ' 人）', 'ok');

function exportMistakeCSV() {
  const mk = classMistakes();
  if (!mk.length) { toast('当前班级还没有错题记录', 'bad'); return; }
  const head = ['班级', '作业', '题号', '错误人数', '学生', '知识点', '说明', '记录时间'];
  const cls = curClass();
  const rows = [head];
  mk.slice().sort((a, b) => (parseFloat(a.questionNo) || 0) - (parseFloat(b.questionNo) || 0) || a.createdAt - b.createdAt).forEach(m => {
    const stu = m.studentId ? (m.studentNo + ' ' + m.studentName) : '（未点名）';
    rows.push([cls ? cls.name : '', m.assignmentTitle || '', m.questionNo, mkCount(m),
      stu, (m.knowledge || []).join(' / '), m.note || '', fmtFull(m.createdAt)]);
  });
  rows.push([]);
  rows.push(['合计', '', '', mk.reduce((s, m) => s + mkCount(m), 0), '', '', '', '']);
  download('错题汇总_' + (cls ? cls.name : '') + '_' + todayStr() + '.csv', toCSV(rows));
  toast('错题 CSV 已导出（' + mk.length + ' 条）', 'ok');
}

function exportBackup() {

  const a = document.createElement('a');
  a.href = url;

}

/** 分享备份：调系统分享面板（微信/邮件/文件 App/iCloud），手机↔电脑搬家最方便 */
async function shareBackup() {
  const name = '化学作业登记_备份_' + todayStr() + '.json';
  const file = new File([JSON.stringify(buildBackupData())], name, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: name });
      return;                                   // 用户取消分享不提示
    } catch (e) {
      if (e && e.name === 'AbortError') return;
    }
  }

}

/* ---------------------------------------------------------------
   15b. 成绩登记
   --------------------------------------------------------------- */
function classExams(cid) {
  const id = cid || S.classId;
  return S.exams.filter(e => e.classId === id).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
}
function curExam() { return S.exams.find(e => e.id === S.examId) || null; }
const scoreKey = (eid, sid) => eid + '::' + sid;
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const fmtScore = v => (Math.round(Number(v) * 10) / 10).toString();

/** 当前（或指定）考试下某生的成绩：null=未录，{absent:true}=缺考 */
function scoreOf(sid, eid) {
  const rec = S.scores.get(scoreKey(eid || S.examId, sid));
  if (!rec) return null;
  if (rec.absent) return { absent: true, score: null };
  return { absent: false, score: Number(rec.score) };
}

function examRecorded(eid) {
  const exam = eid ? S.exams.find(e => e.id === eid) : curExam();
  if (!exam) return 0;
  let n = 0;
  classStudents(exam.classId).forEach(s => { if (S.scores.has(scoreKey(exam.id, s.id))) n++; });
  return n;
}

function examNumbers() {
  const exam = curExam();
  const list = classStudents();
  if (!exam) return null;
  const vals = [];
  let recorded = 0, absents = 0;
  list.forEach(s => {
    const r = scoreOf(s.id);
    if (!r) return;
    recorded++;
    if (r.absent) { absents++; return; }
    if (isFinite(r.score)) vals.push(r.score);
  });
  const n = vals.length;
  const sum = vals.reduce((a, b) => a + b, 0);
  const avg = n ? sum / n : 0;
  const sorted = vals.slice().sort((a, b) => a - b);
  const median = !n ? 0 : (n % 2 ? sorted[(n - 1) / 2] : (sorted[n / 2 - 1] + sorted[n / 2]) / 2);
  const sd = n ? Math.sqrt(vals.reduce((a, v) => a + (v - avg) * (v - avg), 0) / n) : 0;
  const pass = vals.filter(v => v >= exam.full * 0.6).length;
  const good = vals.filter(v => v >= exam.full * 0.85).length;
  return {
    vals, n, recorded, absents, total: list.length, full: exam.full,
    avg,
    median,
    sd,
    max: n ? sorted[n - 1] : 0,
    min: n ? sorted[0] : 0,
    pass,
    good,
    passRate: n ? pass / n : 0,
    goodRate: n ? good / n : 0
  };
}

/** 名次表：同分并列 */
function examRankMap() {
  const list = classStudents();
  const arr = list.map(s => {
    const r = scoreOf(s.id);
    return { sid: s.id, v: (r && !r.absent && isFinite(r.score)) ? r.score : null };
  }).filter(x => x.v != null).sort((a, b) => b.v - a.v);
  const map = new Map();
  let lastV = null, lastR = 0;
  arr.forEach((x, i) => {
    if (lastV === null || x.v !== lastV) { lastR = i + 1; lastV = x.v; }
    map.set(x.sid, lastR);
  });
  return map;
}

function pushExamUndo(unit) {
  S.examUndo.push(unit);
  if (S.examUndo.length > 100) S.examUndo.shift();
  renderExamVoiceUI();
}

/** 写入一条成绩（val: {score} / {absent:true}） */
async function writeScore(sid, val, opts) {
  opts = opts || {};
  const exam = curExam();
  if (!exam) return false;
  const id = scoreKey(exam.id, sid);
  const rec = {
    id, examId: exam.id, classId: exam.classId, studentId: sid,
    absent: !!val.absent,
    score: val.absent ? null : Number(val.score),
    updatedAt: Date.now()
  };
  if (!opts.noUndo) pushExamUndo({ examId: exam.id, batch: [{ sid, before: scoreOf(sid) }] });
  S.scores.set(id, rec);
  await DB.put('scores', rec);
  return true;
}

async function clearScore(sid, opts) {
  opts = opts || {};
  const exam = curExam();
  if (!exam) return false;
  const id = scoreKey(exam.id, sid);
  if (!opts.noUndo) pushExamUndo({ examId: exam.id, batch: [{ sid, before: scoreOf(sid) }] });
  S.scores.delete(id);
  await DB.del('scores', id);
  return true;
}

/** 一次登记多人 → 整批算一个撤销单元 */
async function writeScoreBatch(items) {
  const exam = curExam();
  if (!exam) return 0;
  const batch = [];
  for (const it of items) {
    const before = scoreOf(it.stu.id);
    await writeScore(it.stu.id, it, { noUndo: true });
    batch.push({ sid: it.stu.id, before });
  }
  if (batch.length) pushExamUndo({ examId: exam.id, batch });
  return batch.length;
}

async function undoExam() {
  const e = S.examUndo.pop();
  if (!e) { toast('没有可撤销的操作', ''); return; }
  const old = S.examId;
  S.examId = e.examId;                     // writeScore 依赖 curExam()
  const list = e.batch || [{ sid: e.sid, before: e.before }];
  for (let i = list.length - 1; i >= 0; i--) {
    const b = list[i];
    if (b.before == null) await clearScore(b.sid, { noUndo: true });
    else await writeScore(b.sid, b.before, { noUndo: true });
  }
  S.examId = old;
  renderExam();
  renderExamVoiceUI();
  toast('已撤销 ' + list.length + ' 条成绩登记', 'ok');
}

/* ---- 语音 / 手输解析 ---- */
const SCORE_ABSENT_RE = /(缺考|未考|没考|没参加|缺席|弃考|免考)/;

/** 按「分」和标点切句；分数后面直接接名字也能切开 */
function splitScoreSegs(raw) {
  let s = String(raw || '').replace(/[\uFF01-\uFF5E]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  s = s.replace(/分\s*/g, '分\u0001');
  return s.split(/[\u0001，。、；,;!?！？\n\r]|然后|接着|还有|以及/)
    .map(x => x.trim()).filter(Boolean);
}

/** 单句 → {stu, score, absent, fuzzy, error} */
function parseScoreSeg(seg, exam, index) {
  const out = { stu: null, score: null, absent: false, fuzzy: false, dist: 0, error: '', ambiguous: null };
  let text = seg;

  if (SCORE_ABSENT_RE.test(text)) {
    out.absent = true;
    text = text.replace(SCORE_ABSENT_RE, ' ');
  }
  // 负数不是有效分数（考试没有负分），直接拒绝，避免「-5分」被读成 5 分
  if (/[-]\s*[0-9]/.test(text) || /负\s*[0-9零〇一二三四五六七八九十]/.test(text)) {
    out.error = '分数不能为负';
    return out;
  }
  if (!out.absent && /满分/.test(text)) {
    out.score = exam.full;
    text = text.replace(/满分/g, ' ');
  }
  // 带「分」的数字（阿拉伯或中文）
  if (out.score == null && !out.absent) {
    const m = text.match(/([0-9]{1,3}(?:\.[0-9]{1,2})?|[零〇一二两三四五六七八九十百]{1,4})\s*分/);
    if (m) {
      const v = /^[0-9]/.test(m[1]) ? parseFloat(m[1]) : cnToInt(m[1]);
      if (isFinite(v)) {
        out.score = v;
        text = text.slice(0, m.index) + ' ' + text.slice(m.index + m[0].length);
      }
    }
  }
  // 没有「分」字：只认阿拉伯数字，且排除「34号」里的序号
  if (out.score == null && !out.absent) {
    const nums = [];
    const re = /([0-9]{1,3}(?:\.[0-9]{1,2})?)/g;
    let mm;
    while ((mm = re.exec(text)) !== null) {
      const after = text.slice(mm.index + mm[0].length).replace(/^\s+/, '');
      nums.push({ raw: mm[0], index: mm.index, end: mm.index + mm[0].length, isNo: after.startsWith('号') });
    }
    const free = nums.filter(x => !x.isNo);
    if (free.length) {
      const pick = free[free.length - 1];
      out.score = parseFloat(pick.raw);
      text = text.slice(0, pick.index) + ' ' + text.slice(pick.end);
    }
  }

  // 找人
  const rest = text.trim();
  if (!rest) { out.error = '没听到姓名或序号'; return out; }
  const r = parseUtterance(rest, index);
  if (!r.items.length) {
    if (r.ambiguous && r.ambiguous.length) { out.ambiguous = r.ambiguous; out.error = 'ambiguous'; return out; }
    out.error = '没匹配到「' + rest + '」';
    return out;
  }
  if (r.items.length > 1) { out.error = '一句里有多个学生，请分开念'; return out; }
  const it = r.items[0];
  out.stu = it.stu;
  out.fuzzy = !!it.fuzzy;
  out.dist = it.dist || 0;

  // 校验分数
  if (!out.absent) {
    if (out.score == null) { out.error = '没听到分数'; return out; }
    if (!isFinite(out.score)) { out.error = '分数看不清'; return out; }
    if (out.score < 0) { out.error = '分数不能为负'; return out; }
    if (out.score > exam.full) { out.error = out.score + ' 分超过满分 ' + exam.full; return out; }
    out.score = Math.round(out.score * 10) / 10;
  }
  return out;
}

function parseScorePlan(raw, exam) {
  const index = buildAliasIndex(S.classId);
  const segs = splitScoreSegs(raw);
  const items = [], errors = [], ambiguous = [];
  const at = new Map();                    // studentId → items 下标（同一人说了两次，以后者为准）
  segs.forEach(seg => {
    const r = parseScoreSeg(seg, exam, index);
    if (r.stu && !r.error) {
      if (at.has(r.stu.id)) items[at.get(r.stu.id)] = r;
      else { at.set(r.stu.id, items.length); items.push(r); }
      return;
    }
    if (r.ambiguous) {
      ambiguous.push({ text: seg, names: r.ambiguous[0].names });
      return;
    }
    errors.push({ text: seg, msg: r.error });
  });
  return { items, errors, ambiguous };
}

async function handleScoreVoice(text) {
  const box = $('#examVoiceText');
  if (!box) return;
  if (!text || !text.trim()) return;
  const exam = curExam();
  if (!exam) { toast('请先新建一次考试', 'bad'); return; }

  if (UNDO_RE.test(text)) {
    await undoExam();
    box.innerHTML = '<span class="hit">撤销</span>' + esc(text);
    return;
  }

  const plan = parseScorePlan(text, exam);
  if (!plan.items.length) {
    const msg = plan.ambiguous.length
      ? plan.ambiguous.map(a => '「' + esc(a.text) + '」读音接近 ' + a.names.map(s => esc(s.no + ' ' + s.name)).join(' / ')).join('；')
      : (plan.errors.length ? plan.errors.map(e => esc(e.text + '：' + e.msg)).join('；') : '未匹配到学生');
    box.innerHTML = '<span style="opacity:.55">' + esc(text) + '</span>　' + msg;
    if (plan.errors.length) toast(plan.errors[0].msg, 'bad');
    return;
  }

  const n = await writeScoreBatch(plan.items);
  box.innerHTML = plan.items.map(it =>
    '<span class="hit' + (it.fuzzy ? ' fuzzy' : '') + '">' + (it.fuzzy ? '≈' : '') +
    esc(it.stu.no + ' ' + it.stu.name) + '</span>' +
    '<span class="vtag">' + (it.absent ? '缺考' : fmtScore(it.score) + '分') + '</span>'
  ).join('') +
    (plan.errors.length ? '　<span style="opacity:.65">' + plan.errors.map(e => esc(e.text + '：' + e.msg)).join('；') + '</span>' : '');

  renderExam();
  toast('已登记 ' + n + ' 人成绩，可撤销', 'ok');
}

  wrap.innerHTML =

    cell(pct(st.passRate), '及格率') +
    cell(pct(st.goodRate), '优秀率') +

function renderExamRoster() {
  const wrap = $('#examRoster');
  const sub = $('#examRosterSub');
  if (!wrap) return;
  const exam = curExam();
  const list = classStudents();

  if (!exam) {
    wrap.innerHTML = '<div class="empty-state" style="grid-column:1/-1">先新建一次考试</div>';
    if (sub) sub.textContent = '';
    return;
  }
  if (!list.length) {
    wrap.innerHTML = '<div class="empty-state" style="grid-column:1/-1">当前班级还没有学生<br>先在「登记 → 导入名单」里导入</div>';
    if (sub) sub.textContent = '';
    return;
  }

  const rows = list.map(s => ({ s, r: scoreOf(s.id) }));
  if (S.examSort === 'no') {
    rows.sort((a, b) => (a.s.no - b.s.no) || a.s.name.localeCompare(b.s.name, 'zh'));
  } else {
    rows.sort((a, b) => {
      const av = a.r && !a.r.absent && isFinite(a.r.score) ? a.r.score : -Infinity;
      const bv = b.r && !b.r.absent && isFinite(b.r.score) ? b.r.score : -Infinity;
      if (bv !== av) return bv - av;
      return a.s.no - b.s.no;
    });
  }
  const rankMap = examRankMap();
  let recorded = 0;

  wrap.innerHTML = rows.map(x => {
    const s = x.s, r = x.r;
    const noTxt = String(s.no).length < 2 ? '0' + s.no : String(s.no);
    let cls = 'sc-card', val = '<span class="sc-val">未录</span>';
    if (r) {
      recorded++;
      if (r.absent) {
        cls += ' abs';
        val = '<span class="sc-val">缺考</span>';
      } else {
        const pct = exam.full ? r.score / exam.full : 0;
        cls += pct >= 0.9 ? ' hi' : (pct < 0.6 ? ' low' : ' mid');
        val = '<span class="sc-val">' + fmtScore(r.score) + '<small>分</small></span>';
      }
    } else {
      cls += ' none';
    }
    const rk = rankMap.get(s.id);
    const badge = (S.examSort === 'score' && rk)
      ? '<span class="sc-rank' + (rk <= 3 ? ' r' + rk : '') + '">' + rk + '</span>' : '';
    return '<div class="' + cls + '" data-sid="' + s.id + '">' + badge +
      '<div class="sc-top"><span class="sc-no">' + esc(noTxt) + '</span>' +
      '<span class="sc-nm">' + esc(s.name) + '</span></div>' + val + '</div>';
  }).join('');

  if (sub) sub.textContent = '';   // 已录人数已在顶部统计，不重复

  $$('#examRoster .sc-card').forEach(el => {
    let timer = null, x0 = 0, y0 = 0;
    const stop = () => { if (timer) { clearTimeout(timer); timer = null; } };
    el.onclick = () => {
      if (S.scoreLongAt && Date.now() - S.scoreLongAt < 700) { S.scoreLongAt = 0; return; }
      openScoreSheet(el.dataset.sid);
    };
    el.onpointerdown = ev => {
      x0 = ev.clientX; y0 = ev.clientY;
      stop();
      timer = setTimeout(() => {
        timer = null;
        S.scoreLongAt = Date.now();
        openStudentTrend(el.dataset.sid);
      }, 520);
    };
    el.onpointermove = ev => {
      if (Math.abs(ev.clientX - x0) > 8 || Math.abs(ev.clientY - y0) > 8) stop();
    };
    el.onpointerup = el.onpointercancel = el.onpointerleave = stop;
  });
}

function renderExamDist() {

    '<div style="text-align:right;margin:-5px 0 9px">' +

      '<button class="btn" id="scAbsent" style="flex:1">缺考</button>' +
      '<button class="btn danger" id="scClear" style="flex:1">清除</button>' +
    '</div>' +
    '<button class="btn pri block" id="scSave" style="margin-top:9px">保存</button>';

  const close = openSheet('登记成绩', body, root => {
    const inp = root.querySelector('#scVal');
    setTimeout(() => { try { inp.focus(); inp.select(); } catch (e) {} }, 140);

      close(); renderExam();
      toast(stu.name + ' ' + fmtScore(v) + ' 分', 'ok');

  });

      };

      S.examUndo = [];
      close();

      toast('考试已删除', 'ok');

  });

/** 该班全部考试，按日期从早到晚 */
function examChrono(cid) {
  const id = cid || S.classId;
  return S.exams.filter(e => e.classId === id).sort((a, b) => {
    const da = a.date || '', db = b.date || '';
    if (da !== db) return da < db ? -1 : 1;
    return (a.createdAt || 0) - (b.createdAt || 0);
  });
}

function openStudentTrend(sid) {
  const stu = S.students.find(s => s.id === sid);
  if (!stu) return;
  const exams = examChrono(stu.classId);
  if (!exams.length) { toast('这个班还没有考试', 'bad'); return; }
  const peers = S.students.filter(s => s.classId === stu.classId);

  const rows = exams.map(e => {
    const vals = [];
    peers.forEach(s => {
      const r = S.scores.get(scoreKey(e.id, s.id));
      if (r && !r.absent && isFinite(r.score)) vals.push(Number(r.score));
    });
    const rec = S.scores.get(scoreKey(e.id, sid));
    const abs = !!(rec && rec.absent);
    const score = (rec && !rec.absent && isFinite(rec.score)) ? Number(rec.score) : null;
    const avg = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
    const rank = score == null ? null : vals.filter(v => v > score).length + 1;
    return { e, score, abs, avg, n: vals.length, rank };
  });

  const vals = rows.filter(r => r.score != null).map(r => r.score);
  const n = vals.length;
  const avg = n ? vals.reduce((a, b) => a + b, 0) / n : 0;
  const best = n ? Math.max.apply(null, vals) : 0;
  const worst = n ? Math.min.apply(null, vals) : 0;
  let trend = '';
  if (n >= 2) {
    const d = vals[n - 1] - vals[n - 2];
    trend = (d > 0 ? '↑ 进步 ' : d < 0 ? '↓ 退步 ' : '→ 持平 ') + (d === 0 ? '' : fmtScore(Math.abs(d)) + ' 分');
  }
  const cell = (v, l) => '<div class="stat-cell"><div class="n">' + v + '</div><div class="l">' + l + '</div></div>';

  const body =
    '<div class="hint" style="margin-top:0">' + esc(stu.no + ' 号 · ' + stu.name) + ' · 共 ' + exams.length + ' 次考试</div>' +
    '<div class="trend-sum">' +
      cell(n || '—', '有效次数') +
      cell(n ? fmtScore(avg) : '—', '个人均分') +
      cell(n ? fmtScore(best) : '—', '最高') +
      cell(n ? fmtScore(worst) : '—', '最低') +
    '</div>' +
    (trend ? '<div class="hint">最近一次较上一次：' + esc(trend) + '</div>' : '') +
    '<div class="trend-list" style="margin-top:10px">' + rows.map(r => {
      const w = r.score == null ? 0 : Math.max(3, Math.round(r.score / (r.e.full || 100) * 100));
      const cls = r.abs ? ' abs' : (r.score == null ? ' none' : '');
      const sc = r.abs
        ? '<span class="tsc" style="font-size:11px;color:var(--warn)">缺考</span>'
        : (r.score == null
          ? '<span class="tsc" style="font-size:11px;color:var(--ink3)">未录</span>'
          : '<span class="tsc">' + fmtScore(r.score) + '<small>分</small></span>');
      const meta = r.avg == null ? '' :
        '班均 ' + fmtScore(r.avg) + (r.rank ? ' · 班里第 ' + r.rank + ' 名' : '');
      return '<div class="trend-row' + cls + '">' +
          '<span class="tname" title="' + esc(r.e.name) + '">' + esc(r.e.name) + '</span>' +
          '<span class="tbar"><i style="width:' + w + '%"></i></span>' + sc +
        '</div>' +
        (meta ? '<div class="trend-leg" style="margin:-5px 0 1px 92px">' + esc(meta) + '</div>' : '');
    }).join('') + '</div>' +
    '<div class="hint">柱子长度 = 得分占满分比例。</div>';

  openSheet('成绩对比', body);
}

/* ---- 解析表格里的成绩 ---- */
function normStuName(v) {
  return String(v == null ? '' : v)
    .replace(/[\s\u3000]+/g, '')
    .replace(/[（(].*?[)）]/g, '')
    .replace(/同学$/, '');
}

function parseScoreCell(v, full) {
  let s = String(v == null ? '' : v).trim()
    .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 65248));
  if (!s) return { skip: true };
  if (/^(缺考|缺|没考|未考|缺席|弃考)$/.test(s)) return { absent: true };
  if (/^(免考|免|免测|不考)$/.test(s)) return { skip: true };
  if (/^[-—–/]+$/.test(s)) return { skip: true };
  const num = s.replace(/分/g, '').replace(/[（(].*?[)）]/g, '').trim();
  const n = Number(num);
  if (!isFinite(n)) return { error: '不是分数' };
  if (n < 0) return { error: '负分' };
  if (n > full) return { error: '超满分 ' + full };
  return { score: n };
}

/**
 * 二维表 → 成绩条目
 * 支持 [序号 姓名 分数] / [姓名 分数] / [序号 分数] / 有表头的任意列顺序
 */
function parseScoreRows(rows, exam) {
  const out = { items: [], problems: [], skipped: 0, headerFound: false, total: 0, dupes: 0 };
  const clean = (rows || [])
    .map(r => (r || []).map(c => String(c == null ? '' : c).trim()))
    .filter(r => r.some(v => v));
  if (!clean.length) return out;

  let hIdx = -1, nameCol = -1, noCol = -1, scoreCol = -1;
  for (let i = 0; i < Math.min(6, clean.length); i++) {
    const r = clean[i];
    const ni = r.findIndex(c => /姓名|名字|学生姓名/.test(c));
    const si = r.findIndex(c => /分数|成绩|得分|分值/.test(c));
    const oi = r.findIndex(c => /序号|学号|编号|考号/.test(c));
    if (ni >= 0 && si >= 0) { hIdx = i; nameCol = ni; scoreCol = si; noCol = oi; break; }
  }
  const data = hIdx >= 0 ? clean.slice(hIdx + 1) : clean;
  out.headerFound = hIdx >= 0;
  out.total = data.length;
  if (!data.length) return out;

  const width = data.reduce((m, r) => Math.max(m, r.length), 0);
  const isScoreCell = v => /^(缺考|缺|没考|未考|缺席|弃考|免考|免)$/.test(v) ||
    (isFinite(parseScoreCell(v, exam.full).score));
  const isNameCell = v => /[\u4e00-\u9fa5]/.test(v) && !/姓名|名字|分数|成绩|序号|学号|合计|统计|平均|最高|最低/.test(v);
  const ratio = (c, fn) => {
    let ok = 0, tot = 0;
    data.slice(0, 40).forEach(r => {
      const v = String(r[c] == null ? '' : r[c]).trim();
      if (!v) return;
      tot++;
      if (fn(v)) ok++;
    });
    return tot ? ok / tot : 0;
  };
  // 1,2,3… 这种连续整数列是序号列，不当成分数
  const seqLike = c => {
    let prev = null, ok = 0, tot = 0;
    data.slice(0, 40).forEach(r => {
      const v = String(r[c] == null ? '' : r[c]).trim();
      if (!v) return;
      tot++;
      const n = Number(v);
      if (Number.isInteger(n) && (prev == null || n === prev + 1)) { ok++; prev = n; }
      else prev = null;
    });
    return tot >= 3 && ok === tot;
  };

  // 先认姓名列，再认分数列，最后才认序号列 —— 顺序错了会把分数列当序号
  if (nameCol < 0) {
    let bestName = -1, sName = 0;
    for (let c = 0; c < width; c++) {
      if (c === scoreCol) continue;
      const rn = ratio(c, isNameCell);
      if (rn > sName) { sName = rn; bestName = c; }
    }
    if (sName >= 0.5) nameCol = bestName;
  }
  if (scoreCol < 0) {
    // 从右往左找：像分数、且不是序号/姓名的那一列
    for (let c = width - 1; c >= 0; c--) {
      if (c === nameCol) continue;
      if (seqLike(c)) continue;
      if (ratio(c, isScoreCell) >= 0.7) { scoreCol = c; break; }
    }
    if (scoreCol < 0) {
      for (let c = width - 1; c >= 0; c--) {
        if (c !== nameCol) { scoreCol = c; break; }
      }
    }
  }
  if (noCol < 0) {
    let bestNo = -1, sNo = 0;
    for (let c = 0; c < width; c++) {
      if (c === nameCol || c === scoreCol) continue;
      const ro = ratio(c, v => /^\d{1,4}$/.test(v));
      if (ro > sNo && ro > 0.6) { sNo = ro; bestNo = c; }
    }
    noCol = bestNo;
  }
  if (nameCol >= 0 && nameCol === scoreCol) nameCol = -1;
  if (noCol >= 0 && (noCol === scoreCol || noCol === nameCol)) noCol = -1;

  // 名单索引
  const list = S.students.filter(s => s.classId === exam.classId);
  const byName = new Map(), byNo = new Map();
  list.forEach(s => {
    const k = normStuName(s.name);
    if (k) { if (byName.has(k)) byName.set(k, null); else byName.set(k, s); }
    byNo.set(String(Number(s.no)), s);
  });
  const seen = new Map();

  data.forEach(r => {
    const rawName = nameCol >= 0 ? String(r[nameCol] == null ? '' : r[nameCol]).trim() : '';
    const rawNo = noCol >= 0 ? String(r[noCol] == null ? '' : r[noCol]).trim() : '';
    const rawSc = scoreCol >= 0 ? String(r[scoreCol] == null ? '' : r[scoreCol]).trim() : '';
    if (!rawName && !rawNo) return;
    if (/姓名|名字|合计|平均|统计|最高|最低|及格率|优秀率/.test(rawName)) { out.skipped++; return; }

    const sc = scoreCol < 0 ? { error: '没找到分数列' } : parseScoreCell(rawSc, exam.full);
    if (sc.skip) { out.skipped++; return; }
    if (sc.error) {
      out.problems.push({ label: rawName || ('序号 ' + rawNo), value: rawSc, msg: sc.error });
      return;
    }

    let stu = null;
    const nm = normStuName(rawName);
    if (nm && byName.has(nm)) stu = byName.get(nm);
    // 只有表格里没写姓名时，才用序号兜底；写了名字但对不上，就是真的对不上
    if (!stu && !nm && rawNo) {
      stu = byNo.get(String(Number(rawNo))) || byNo.get(rawNo.replace(/^0+/, '')) || null;
    }
    if (!stu) {
      out.problems.push({
        label: rawName || ('序号 ' + rawNo),
        value: rawSc,
        msg: nm && byName.get(nm) === null ? '重名，无法确定' : '名单里没有'
      });
      return;
    }

    const item = { stu, absent: !!sc.absent };
    if (!sc.absent) item.score = sc.score;
    if (seen.has(stu.id)) {
      out.items[seen.get(stu.id)] = item;
      out.dupes++;
    } else {
      seen.set(stu.id, out.items.length);
      out.items.push(item);
    }
  });

  return out;
}
