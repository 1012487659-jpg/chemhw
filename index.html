<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="化学作业登记">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f766e">
<title>化学作业登记</title>
<style>
/* ============ 基础 ============ */
:root{
  --bg:#f2f6f5;
  --card:#ffffff;
  --ink:#0f1f1d;
  --ink2:#5f716e;
  --ink3:#8b9b98;
  --line:#e3eae8;
  --line2:#eef3f2;
  --brand:#0f766e;
  --brand-d:#0b5c56;
  --brand-l:#e6f4f2;
  --ok:#0f9155;
  --ok-l:#e7f6ee;
  --bad:#cf3a3a;
  --bad-l:#fdeceb;
  --warn:#b8730a;
  --warn-l:#fdf3e2;
  --indigo:#5450c8;
  --indigo-l:#edecfb;
  --cyan:#0b7d94;
  --cyan-l:#e5f5f8;
  --gray:#8b9b98;
  --gray-l:#eff3f2;
  --r:14px;
  --r-s:10px;
  --sh:0 1px 2px rgba(15,31,29,.05),0 4px 14px rgba(15,31,29,.05);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;padding:0;
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",sans-serif;
  font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(66px + var(--safe-b));
  overscroll-behavior-y:none;
  touch-action:manipulation;
}
button,.stu,.chip,.tp,.status-btn{touch-action:manipulation}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{
  border:1px solid var(--line);background:#fff;border-radius:var(--r-s);
  padding:9px 11px;outline:none;width:100%;
  transition:border-color .15s,box-shadow .15s;
  appearance:none;-webkit-appearance:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-l)}
textarea{resize:vertical;min-height:72px;line-height:1.55}
input::placeholder,textarea::placeholder{color:#aab6b3;opacity:1}
select{
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235f716e' stroke-width='2'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 8px center;background-size:16px;
  padding-right:30px;
}
.hide{display:none !important}

/* ============ 顶栏 ============ */
.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(255,255,255,.92);
  backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
  padding:calc(7px + var(--safe-t)) 12px 7px;
}
.topbar-row{display:flex;align-items:center;gap:8px}
.logo{
  display:flex;align-items:center;gap:6px;font-weight:700;font-size:15px;
  letter-spacing:.2px;color:var(--brand-d);white-space:nowrap;
}
.logo svg{width:19px;height:19px}
.class-select{
  flex:1;min-width:0;
  display:flex;align-items:center;gap:6px;
  background:var(--brand-l);border-radius:999px;padding:3px 4px 3px 11px;
}
.class-select select{
  border:0;background-color:transparent;padding:4px 26px 4px 0;
  font-weight:600;color:var(--brand-d);font-size:14px;
  background-position:right 4px center;
}
.class-select select:focus{box-shadow:none}
.icon-btn{
  width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink2);flex:none;
}
.icon-btn:active{background:var(--line2)}
.icon-btn svg{width:19px;height:19px}

/* ============ 视图容器 ============ */
main{padding:12px 12px 18px;max-width:760px;margin:0 auto}
.view{animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.card{
  background:var(--card);border-radius:var(--r);box-shadow:var(--sh);
  padding:12px;margin-bottom:9px;
}
.card-h{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:12.5px;font-weight:600;color:var(--ink3);
  margin:-1px 0 9px;letter-spacing:.2px;
}
.card-h .sub{font-weight:400;color:var(--ink3);font-size:12px}

/* ============ 作业条 ============ */
.hw-box{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:11px 12px;margin-bottom:9px}
.hw-box .hw-top{display:flex;align-items:flex-start;gap:7px}
.hw-box .hw-title{font-size:15px;font-weight:700;flex:1;min-width:0;word-break:break-word;line-height:1.35}
.hw-box .hw-title .empty{color:var(--ink3);font-weight:500;font-size:14px}
.hw-sub{
  display:flex;flex-wrap:wrap;align-items:center;gap:4px 9px;margin-top:5px;
  font-size:11.5px;color:var(--ink2);
}
/* 作业条里「切换 / 编辑」收成轻量文字按钮，不再单独占一行 */
.hw-sub .hw-acts{margin-left:auto;display:flex;align-items:center;gap:9px}
.hw-acts button{font-size:12px;font-weight:600;color:var(--brand-d);padding:1px 0}
.hw-acts button:active{opacity:.6}
.hw-acts button.sep-l{padding-left:9px;border-left:1px solid var(--line)}
.hw-note{
  margin-top:4px;font-size:11.5px;color:var(--ink3);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;
}
.hw-sub span{display:inline-flex;align-items:center;gap:4px}
.hw-sub b{font-weight:600;color:var(--ink)}
.badge{
  display:inline-block;padding:1.5px 7px;border-radius:6px;
  font-size:11.5px;font-weight:600;line-height:1.6;white-space:nowrap;
}
.bg-write{background:#e8f0fe;color:#1a56c4}
.bg-lab{background:#f0eafd;color:#6d28d9}
.bg-calc{background:#fdf0e3;color:#b45309}
.bg-recite{background:#e2f6f8;color:#0b7d94}

/* ============ 统计条 ============ */
.stat-strip{
  display:flex;align-items:stretch;
  background:var(--card);border-radius:var(--r);box-shadow:var(--sh);
  padding:7px 2px;margin-bottom:9px;
}
.stat-cell{
  flex:1;min-width:0;position:relative;
  background:none;box-shadow:none;border-radius:0;
  padding:1px 3px;text-align:center;
}
.stat-cell+.stat-cell::before{
  content:'';position:absolute;left:0;top:14%;bottom:14%;width:1px;background:var(--line2);
}
.stat-cell .n{font-size:18px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.stat-cell .l{font-size:10px;color:var(--ink3);margin-top:0}

/* ============ 语音区 ============ */
.voice-box{
  background:linear-gradient(150deg,#0f766e,#0c8a80 55%,#12968a);
  border-radius:14px;padding:10px 11px;margin-bottom:9px;color:#fff;
  box-shadow:0 4px 14px rgba(15,118,110,.18);
}
.voice-row{display:flex;align-items:center;gap:10px}
/* 文字批量登记输入框（替代原麦克风） */
.voice-row input{
  flex:1;min-width:0;height:44px;border-radius:10px;
  background:rgba(255,255,255,.94);border:none;outline:none;
  padding:0 12px;font-size:14.5px;color:var(--ink);
}
.voice-row input::placeholder{color:#8ba39f;font-size:13px}
.mic.send{
  width:auto;border-radius:10px;padding:0 15px;height:44px;
  font-size:14.5px;font-weight:700;letter-spacing:1px;
}
.mic{
  width:50px;height:50px;border-radius:50%;flex:none;
  background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.5);
  display:flex;align-items:center;justify-content:center;color:#fff;
  transition:transform .12s,background .2s;
}
.mic svg{width:22px;height:22px}
.mic:active{transform:scale(.94)}
.mic.on{
  background:#fff;color:var(--brand);border-color:#fff;
  animation:pulse 1.6s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(255,255,255,.55)}
  70%{box-shadow:0 0 0 16px rgba(255,255,255,0)}
  100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}
}
.voice-info{flex:1;min-width:0}
.voice-status{font-size:12.5px;opacity:.9;min-height:18px;line-height:1.35}
.voice-text{
  font-size:13px;font-weight:600;margin-top:2px;min-height:18px;
  word-break:break-all;line-height:1.35;
}
.voice-text .hit{
  background:rgba(255,255,255,.26);border-radius:5px;padding:1px 5px;margin-right:3px;
  display:inline-block;margin-bottom:2px;
}
/* 读音模糊命中：加虚线与 ≈ 前缀，提醒「按读音认的，不是字面一致」 */
.voice-text .hit.fuzzy{
  background:rgba(255,255,255,.12);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.55);
}
.voice-text .vtag{
  display:inline-block;margin:0 3px 2px 0;padding:1px 6px;border-radius:5px;
  background:#fff;color:#0b5c56;font-size:11px;font-weight:700;
}
.voice-text .vtag.t{background:rgba(255,255,255,.22);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
.voice-mini{
  display:flex;gap:5px;margin-top:7px;
}
.voice-mini #examUndoBtn{flex:0 1 auto;padding-left:16px;padding-right:16px}
.voice-mini button{
  flex:1;background:rgba(255,255,255,.14);color:#fff;border-radius:8px;
  padding:5px 6px;font-size:12px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.voice-mini button:active{background:rgba(255,255,255,.28)}
.voice-mini button:disabled{opacity:.4}
.voice-mini button.off{opacity:.55;font-weight:500;background:rgba(255,255,255,.09)}

/* 语音诊断提示条 */

/* ============ 快速输入 ============ */
.quick-row{display:flex;gap:6px;margin-bottom:9px}
.quick-row input{flex:1}
.quick-row select{width:82px;flex:none;font-size:13px;padding:9px 20px 9px 9px;background-position:right 4px center}
.quick-row button{
  flex:none;padding:0 14px;background:var(--brand);color:#fff;border-radius:var(--r-s);
  font-weight:600;font-size:14px;
}
.quick-row button:active{background:var(--brand-d)}

/* ============ 筛选 ============ */
.filter-row{
  display:flex;gap:5px;overflow-x:auto;padding:0 0 8px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.filter-row::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:5px 11px;border-radius:999px;font-size:12.5px;
  background:#fff;color:var(--ink2);border:1px solid var(--line);
  font-weight:500;white-space:nowrap;
}
.chip .c{font-size:11.5px;opacity:.7;margin-left:2px}
.chip.active{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
.chip.active .c{opacity:.85}
.chip.sel-mode{margin-left:auto;border-style:dashed}
/* 「已交」的下一层：全部已交 + 本次手动添加的分类 */
.sub-row{
  display:flex;align-items:center;gap:6px;
  padding:0 0 9px;margin-top:-3px;
}
/* 中间的分类可横向滑动，右侧「未分类」始终固定可见 */
.sub-scroll{
  flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:6px;
  overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;padding:1px 0;
}
.sub-scroll::-webkit-scrollbar{display:none}
.sub-row .sub-lb{
  flex:none;font-size:11px;color:var(--ink3);font-weight:600;
  padding-right:1px;letter-spacing:.2px;
}
.sub-row .chip{padding:4px 10px;font-size:12.5px;background:#f5f9f8;border-color:#dfeae7}
.sub-row .chip.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.sub-row .chip.zero{opacity:.5}
/* 兜底的「未分类」：虚线，和真正的分类区分开 */
.sub-row .chip.none-chip{background:#fff;border-style:dashed;color:var(--ink3)}
.sub-row .chip.none-chip.active{background:var(--ink3);border-color:var(--ink3);color:#fff}

/* ============ 名单网格（一行多个） ============ */
.roster{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(104px,1fr));
  gap:7px;
}
/* 空态/提示卡片必须独占整行，否则会被网格挤成一窄条 */
.roster > .card{grid-column:1 / -1}
.stu{
  position:relative;display:block;
  background:#fff;border-radius:11px;
  padding:6px 8px 9px;
  box-shadow:0 1px 2px rgba(15,31,29,.05);
  border:1px solid transparent;
  min-height:55px;overflow:hidden;
  transition:background .12s,border-color .12s,transform .08s;
  touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
.stu:active{transform:scale(.97)}
.stu::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--gray);
}
.stu[data-status="submitted"]::after{background:var(--ok)}
.stu[data-status="missing"]::after{background:var(--bad)}
.stu[data-status="makeup"]::after{background:var(--warn)}
.stu[data-status="leave"]::after{background:var(--indigo)}
.stu[data-status="exempt"]::after{background:var(--cyan)}
.stu.picked{background:var(--brand-l);border-color:var(--brand)}
.stu.picked::before{
  content:'✓';position:absolute;top:0;right:0;width:17px;height:17px;
  background:var(--brand);color:#fff;font-size:11px;line-height:17px;text-align:center;
  border-bottom-left-radius:8px;z-index:2;
}
.stu.flash{animation:flash .9s ease}
@keyframes flash{
  0%{background:#fff7cc;box-shadow:0 0 0 2px #f3d34a}
  100%{background:#fff;box-shadow:0 1px 2px rgba(15,31,29,.06)}
}
/* 自动定位：登记后把视线引向下一个未登记学生 */
.stu.locate{
  border-color:var(--brand);
  animation:locate 1.2s ease-out 1;
  z-index:1;
}
@keyframes locate{
  0%{box-shadow:0 0 0 0 rgba(19,120,109,.42)}
  60%{box-shadow:0 0 0 8px rgba(19,120,109,0)}
  100%{box-shadow:0 1px 2px rgba(15,31,29,.06)}
}
.stu.locate::before{
  content:'';position:absolute;inset:0;
  border-radius:11px;pointer-events:none;
  box-shadow:inset 0 0 0 2px rgba(19,120,109,.45);
  animation:locateIn 1.2s ease-out forwards;
}
@keyframes locateIn{0%,55%{opacity:1}100%{opacity:0}}
.stu-top{display:flex;align-items:baseline;gap:4px;min-width:0}
.stu-no{
  flex:none;font-size:10.5px;font-weight:700;color:var(--ink3);
  font-variant-numeric:tabular-nums;line-height:1.35;letter-spacing:.2px;
}
.stu[data-status="submitted"] .stu-no{color:var(--ok)}
.stu[data-status="missing"] .stu-no{color:var(--bad)}
.stu-name{
  flex:1;min-width:0;font-size:13px;font-weight:600;line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.star{flex:none;color:#e8a500;font-size:11px;line-height:1.35}
.stu-bot{
  display:flex;align-items:center;gap:4px;margin-top:3px;padding-right:17px;
  min-height:15px;
}
.stu-st{
  flex:none;font-size:10px;font-weight:600;padding:0 5px;border-radius:4px;
  line-height:15px;height:15px;white-space:nowrap;
}
.stu-tagc{
  flex:0 1 auto;min-width:0;font-size:9.5px;color:var(--brand-d);background:var(--brand-l);
  border-radius:4px;padding:0 4px;line-height:15px;height:15px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62px;
}
.stu-nt{flex:none;font-size:9px;color:var(--ink3);line-height:15px}
.stu-more{
  position:absolute;right:3px;bottom:4px;
  width:20px;height:20px;display:flex;align-items:center;justify-content:center;
  color:var(--ink3);font-size:14px;font-weight:700;line-height:1;border-radius:5px;
}
.stu-more:active{background:var(--line2)}
.tag{
  font-size:10.5px;padding:1px 6px;border-radius:5px;
  background:var(--brand-l);color:var(--brand-d);font-weight:600;line-height:1.6;
}
.tag.mut{background:var(--gray-l);color:var(--ink2);font-weight:500}
.st-submitted{background:var(--ok-l);color:var(--ok)}
.st-missing{background:var(--bad-l);color:var(--bad)}
.st-makeup{background:var(--warn-l);color:var(--warn)}
.st-leave{background:var(--indigo-l);color:var(--indigo)}
.st-exempt{background:var(--cyan-l);color:var(--cyan)}
.st-pending{background:var(--gray-l);color:var(--gray)}

/* ============ 底部批量条 ============ */
/* 操作栏：固定悬浮在底部导航上方，滚动到哪里都能看到、都能点 */
.bulk-bar{
  position:fixed;left:12px;right:12px;bottom:calc(66px + var(--safe-b) + 6px);z-index:70;
  display:flex;gap:7px;background:rgba(255,255,255,.94);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:8px;border-radius:13px;box-shadow:0 -2px 16px rgba(15,31,29,.09);
  border:1px solid var(--line);
}
/* 多选模式：上面一行分类，下面一行操作 */
.bulk-bar.multi{flex-direction:column;gap:6px;align-items:stretch}
.bulk-status{
  display:flex;gap:5px;width:100%;overflow-x:auto;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
  padding:1px 1px 2px;
}
.bulk-status::-webkit-scrollbar{display:none}
.bulk-bar .bulk-status button{
  flex:0 0 auto;padding:7px 8px;font-size:11.5px;border-radius:8px;
  background:var(--line2);color:var(--ink2);font-weight:600;
  display:flex;align-items:center;gap:4px;white-space:nowrap;
}
.bulk-bar .bulk-status button i{width:6px;height:6px;border-radius:50%;display:block;flex:none}
.bulk-bar .bulk-status button:disabled{opacity:.45}
.bulk-tip{display:block;font-size:12px;color:var(--ink3);padding:7px 2px;white-space:nowrap}
.bulk-acts{display:flex;gap:6px;width:100%}
.bulk-bar button{
  flex:1;padding:9px 6px;border-radius:9px;font-size:13px;font-weight:600;
  background:var(--line2);color:var(--ink2);
  display:flex;align-items:center;justify-content:center;gap:4px;
}
.bulk-bar button.pri{background:var(--brand);color:#fff}
.bulk-bar button.soft{background:var(--brand-l);color:var(--brand-d)}
.bulk-bar button.danger{background:var(--bad-l);color:var(--bad)}
.bulk-bar button:active{opacity:.82}
/* 窄屏收紧，保证「未登记→未交 (n)」单行不掉行 */
@media (max-width:380px){
  .bulk-bar{gap:5px;padding:7px}
  .bulk-bar button{font-size:11.5px;padding:9px 3px;white-space:nowrap;letter-spacing:-.2px}
}

/* ============ 通用按钮 ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  padding:9px 14px;border-radius:var(--r-s);font-size:14px;font-weight:600;
  background:var(--line2);color:var(--ink);
}
.btn:active{opacity:.82}
.btn.pri{background:var(--brand);color:#fff}
.btn.ghost{background:var(--brand-l);color:var(--brand-d)}
.btn.danger{background:var(--bad-l);color:var(--bad)}
.btn.block{display:flex;width:100%}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45}

/* ============ 作业列表 ============ */
.hw-item{
  display:flex;gap:10px;align-items:flex-start;padding:11px 0;
  border-bottom:1px solid var(--line2);
}
.hw-item:last-child{border-bottom:0}
.hw-item.cur{background:var(--brand-l);margin:0 -13px;padding:11px 13px;border-radius:9px;border-bottom-color:transparent}
.hw-item-main{flex:1;min-width:0}
.hw-item-t{font-weight:600;font-size:14.5px;word-break:break-word}
.hw-item-m{font-size:12px;color:var(--ink3);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.hw-item-bar{height:4px;background:var(--line2);border-radius:2px;margin-top:7px;overflow:hidden}
.hw-item-bar i{display:block;height:100%;background:var(--ok);border-radius:2px}
.hw-item-act{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.hw-miss{
  margin-left:auto;background:none;border:0;padding:2px 0 2px 8px;
  color:var(--bad);font-size:11.5px;font-weight:600;font-family:inherit;
  display:inline-flex;align-items:center;gap:2px;border-radius:5px;
  -webkit-tap-highlight-color:transparent;
}
.hw-miss:active{opacity:.6}
.hw-miss.zero{color:var(--ink3);font-weight:500}

/* 未交名单弹层 */
.miss-sum{display:flex;gap:8px;margin-bottom:4px}
.miss-sum div{
  flex:1;background:var(--bg);border-radius:9px;padding:8px 10px;text-align:center;
}
.miss-sum b{display:block;font-size:17px;line-height:1.25;font-variant-numeric:tabular-nums}
.miss-sum span{font-size:11px;color:var(--ink3)}
.miss-list{
  display:flex;flex-wrap:wrap;gap:6px;
  margin-top:10px;max-height:36vh;overflow:auto;
  padding:2px;
}
.miss-chip{
  background:var(--bad-l);color:var(--bad);border-radius:7px;
  padding:4px 8px;font-size:12.5px;font-weight:600;
  font-variant-numeric:tabular-nums;line-height:1.4;
}
.miss-chip.p{background:var(--gray-l);color:var(--ink2);font-weight:500}
.miss-chip em{font-style:normal;opacity:.65;font-weight:400;margin-right:3px;font-size:11px}
.hw-item.cur .hw-item-act .btn{background:#fff}

/* ============ 本次分类条 ============ */
.tagbar{
  display:flex;align-items:center;gap:5px;
  width:-webkit-fit-content;width:fit-content;max-width:100%;
  margin:8px 0 3px;overflow:hidden;padding:1px;
}
/* 分类再多也只让中间这段横向滚动，右侧「＋ 添加」始终可见 */
.tagbar-scroll{
  flex:0 1 auto;min-width:0;display:flex;align-items:center;gap:5px;
  overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;padding:1px 0;
}
.tagbar-scroll::-webkit-scrollbar{display:none}
/* 分类 chip 上：允许横向滚动、禁止垂直滚动起步——垂直拖动留给「调整顺序」 */
.tagbar-scroll .tchip[data-t]{touch-action:pan-x}
/* 排序模式：拖动换位，不让滚动接管；虚线边框提示当前处于排序中 */
.tagbar.sorting .tchip[data-t]{touch-action:none;border-style:dashed}
@keyframes tagPulse{0%,100%{box-shadow:0 0 0 0 rgba(11,125,148,.0)}50%{box-shadow:0 0 0 3px rgba(11,125,148,.18)}}
.tagbar.sorting .tchip[data-t]{animation:tagPulse 1.6s ease-in-out infinite}
.tagbar-lb{
  flex:none;font-size:11px;color:var(--ink3);font-weight:600;
  padding-right:2px;letter-spacing:.2px;
}
.tchip{
  flex:0 0 auto;font-size:11.5px;font-weight:600;line-height:1;
  padding:6px 10px;border-radius:14px;
  background:var(--line2);color:var(--ink2);
  border:1px solid transparent;white-space:nowrap;
}
.tchip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.tchip.add{background:#fff;border:1px dashed var(--line);color:var(--ink3);padding:5px 9px;font-size:12px;font-weight:600}
.tchip:active{opacity:.8}
.tagbar-hint{flex:none;font-size:11px;color:var(--ink3);white-space:nowrap}

/* ============ 成绩页 ============ */
.exam-box{
  background:var(--card);border-radius:var(--r);box-shadow:var(--sh);
  padding:11px 12px;margin-bottom:9px;
}
.exam-top{display:flex;align-items:center;gap:8px}
.exam-sel{
  flex:1;min-width:0;display:flex;align-items:center;gap:4px;
  background:var(--brand-l);border-radius:9px;padding:2px 8px;
}
.exam-sel select{
  border:0;background-color:transparent;padding:7px 24px 7px 2px;
  font-weight:700;font-size:15px;color:var(--brand-d);width:100%;
}
.exam-meta{
  display:flex;flex-wrap:wrap;gap:5px 12px;margin-top:8px;
  font-size:12px;color:var(--ink2);
}
.exam-meta b{font-weight:600;color:var(--ink)}

.exam-stats{
  display:grid;grid-template-columns:repeat(4,1fr);gap:7px 0;
  background:var(--card);border-radius:var(--r);box-shadow:var(--sh);
  padding:8px 3px;margin-bottom:9px;
}
.exam-stats .stat-cell{padding:2px}
.exam-stats .stat-cell .n{font-size:17px}
.exam-stats .stat-cell .l{font-size:10px}

/* 分数段分布 */
.dist{margin-top:4px}
.dist-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:12px}
.dist-row .lb{flex:none;width:74px;white-space:nowrap;color:var(--ink2);font-variant-numeric:tabular-nums;font-size:11.5px}
.dist-row .tk{flex:1;height:8px;background:var(--line2);border-radius:4px;overflow:hidden}
.dist-row .tk i{display:block;height:100%;border-radius:4px;transition:width .3s}
.dist-row .vl{flex:none;width:34px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink2)}

/* 成绩名单 */
.score-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:7px;
}
.sc-card{
  position:relative;background:var(--card);border-radius:var(--r-s);
  border:1px solid var(--line);padding:7px 8px;min-height:62px;
  display:flex;flex-direction:column;justify-content:space-between;
  overflow:hidden;touch-action:manipulation;
  transition:border-color .12s,transform .08s;
}
.sc-card:active{transform:scale(.975)}
.sc-card .sc-top{display:flex;align-items:baseline;gap:4px;min-width:0}
.sc-card .sc-no{
  font-size:10px;font-weight:700;color:var(--ink3);font-variant-numeric:tabular-nums;flex:none;
}
.sc-card .sc-nm{
  font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;min-width:0;
}
.sc-card .sc-val{
  font-size:20px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;
  color:var(--ink);
}
.sc-card .sc-val small{font-size:10.5px;font-weight:500;color:var(--ink3);margin-left:1px}
.sc-card.none .sc-val{font-size:12px;font-weight:500;color:var(--ink3);letter-spacing:.3px}
.sc-card.abs{border-color:#f0dcb8;background:#fffcf4}
.sc-card.abs .sc-val{font-size:13px;font-weight:600;color:var(--warn)}
.sc-card.hi{border-color:#bfe3ce;background:#f4fbf7}
.sc-card.hi .sc-val{color:var(--ok)}
.sc-card.low{border-color:#f3cfcd;background:#fdf6f5}
.sc-card.low .sc-val{color:var(--bad)}
.sc-card.mid .sc-val{color:var(--brand-d)}
.sc-card .sc-rank{
  position:absolute;top:0;right:0;font-size:9px;font-weight:700;
  padding:2px 5px;border-bottom-left-radius:7px;background:var(--line2);color:var(--ink3);
  font-variant-numeric:tabular-nums;
}
.sc-card .sc-rank.r1{background:#fbeec8;color:#8a6100}
.sc-card .sc-rank.r2{background:#e9eef2;color:#5c6b75}
.sc-card .sc-rank.r3{background:#f6e6da;color:#8a5432}

.exam-act{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.exam-act .btn{width:100%;padding-left:4px;padding-right:4px}

/* 成绩分析：中位数 / 标准差 / 及格率 … */
.dist-foot{
  display:flex;align-items:baseline;gap:6px;margin-top:9px;
  font-size:11.5px;color:var(--ink3);
}
.dist-foot b{color:var(--ink);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.dist-foot span{margin-left:auto}

/* 个人多次成绩对比 */
.pick-list{display:flex;flex-direction:column;gap:6px;margin-top:8px;max-height:56vh;overflow-y:auto}
.pick-row{
  display:flex;align-items:center;gap:8px;padding:9px 11px;
  border:1px solid var(--line);border-radius:10px;background:#fff;text-align:left;width:100%;
}
.pick-row:active{background:var(--brand-l)}
.pick-row .no{
  flex:none;min-width:26px;font-size:11px;font-weight:700;color:var(--ink3);
  font-variant-numeric:tabular-nums;
}
.pick-row .nm{font-size:14px;font-weight:600;color:var(--ink)}
.pick-row .meta{margin-left:auto;font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}

.trend-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:2px 0 12px}
.trend-sum .stat-cell{padding:7px 3px;background:var(--gray-l);box-shadow:none}
.trend-sum .stat-cell .n{font-size:16px}
.trend-list{display:flex;flex-direction:column;gap:8px}
.trend-row{display:flex;align-items:center;gap:8px;font-size:12px}
.trend-row .tname{
  flex:none;width:84px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.trend-row .tbar{flex:1;height:10px;background:var(--line2);border-radius:5px;overflow:hidden;position:relative}
.trend-row .tbar i{display:block;height:100%;border-radius:5px;background:var(--brand);min-width:2px}
.trend-row.abs .tbar i{background:var(--warn);opacity:.45}
.trend-row.none .tbar i{display:none}
.trend-row .tsc{
  flex:none;width:44px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;
  color:var(--ink);
}
.trend-row .tsc small{font-size:9.5px;color:var(--ink3);font-weight:500;margin-left:1px}
.trend-leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--ink3);margin-top:10px}

/* ============ 空态 ============ */
.empty-state{
  text-align:center;padding:26px 16px;color:var(--ink3);font-size:13.5px;
}
.empty-state .big{font-size:15px;color:var(--ink2);font-weight:600;margin-bottom:5px}

/* ============ 表单 ============ */
.field{margin-bottom:11px}
.field label{display:block;font-size:12.5px;color:var(--ink2);font-weight:600;margin-bottom:5px}
.field label .req{color:var(--bad)}
.field-row{display:flex;gap:8px}
.field-row > *{flex:1;min-width:0}
.hint{font-size:11.5px;color:var(--ink3);margin-top:4px;line-height:1.45}

/* 照片 */
.photo-grid{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
.photo-item{position:relative;width:70px;height:70px;border-radius:9px;overflow:hidden;background:var(--line2)}
.photo-item img{width:100%;height:100%;object-fit:cover;display:block}
.photo-item .del{
  position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;
  background:rgba(0,0,0,.55);color:#fff;font-size:12px;line-height:18px;text-align:center;
}
.photo-item .ocr-btn{
  position:absolute;right:3px;bottom:3px;width:24px;height:20px;border-radius:7px;
  background:rgba(15,50,45,.62);color:#fff;font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.photo-item .ocr-btn:active{background:rgba(15,50,45,.9)}
.photo-add{
  width:70px;height:70px;border-radius:9px;border:1.5px dashed #cdd8d5;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;color:var(--ink3);font-size:10.5px;background:#fafcfb;
}
.photo-add svg{width:18px;height:18px}

/* ============ Sheet 弹层 ============ */
.sheet-mask{
  position:fixed;inset:0;z-index:100;background:rgba(11,26,24,.42);
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;transition:opacity .2s;
  padding:0;
}
.sheet-mask.show{opacity:1}
.sheet-panel{
  width:100%;max-width:560px;max-height:88vh;background:#fff;
  border-radius:18px 18px 0 0;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .24s cubic-bezier(.32,.72,0,1);
  padding-bottom:var(--safe-b);
}
.sheet-mask.show .sheet-panel{transform:none}
.sheet-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px 11px;border-bottom:1px solid var(--line2);
  font-weight:700;font-size:15.5px;flex:none;
}
.sheet-close{
  width:30px;height:30px;border-radius:50%;background:var(--line2);
  display:flex;align-items:center;justify-content:center;
  color:var(--ink2);font-size:14px;flex:none;
}
.sheet-body{padding:14px 16px 20px;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* 状态选择按钮组 */
.status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px}
.status-btn{
  padding:10px 4px;border-radius:10px;background:var(--gray-l);color:var(--ink2);
  font-size:13.5px;font-weight:600;border:1.5px solid transparent;
  display:flex;flex-direction:column;align-items:center;gap:2px;
}
.status-btn .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.55}
.status-btn.on{background:#fff;border-color:currentColor;box-shadow:0 0 0 3px rgba(15,118,110,.07)}
.status-btn[data-s="submitted"]{color:var(--ok)}
.status-btn[data-s="missing"]{color:var(--bad)}
.status-btn[data-s="makeup"]{color:var(--warn)}
.status-btn[data-s="leave"]{color:var(--indigo)}
.status-btn[data-s="exempt"]{color:var(--cyan)}
.status-btn[data-s="pending"]{color:var(--gray)}
.status-btn[data-s="pending"].on{background:#fff;border-color:var(--gray)}
.status-btn.on{background-color:#fff}

/* 分类选择 */
.tag-pick{display:flex;flex-wrap:wrap;gap:6px}
.tag-pick .tp{
  padding:5px 11px;border-radius:999px;font-size:12.5px;
  border:1px solid var(--line);background:#fff;color:var(--ink2);
  font-weight:500;
}
.tag-pick .tp.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
/* 编辑名单列表 */
.edit-roster{max-height:46vh;overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:11px}
.er-row{display:flex;align-items:center;gap:9px;padding:9px 11px;border-bottom:1px solid var(--line)}
.er-row:last-child{border-bottom:none}
.er-no{min-width:34px;text-align:center;font-size:12px;font-weight:600;color:#0b5c56;background:#e6f4f2;border-radius:7px;padding:3px 0;flex:none}
.er-name{flex:1;font-size:14.5px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.er-btn{flex:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 11px;font-size:12.5px;color:var(--ink)}
.er-btn.danger{color:#b3392f;border-color:#ecc9c4}
/* 添加分类弹窗里的已添加列表：整块交给拖动排序手势，不让页面滚动接管 */
#ntList .tp{touch-action:none}

/* 开关行 */
.switch-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 0;border-top:1px solid var(--line2);margin-top:4px;
}
.switch-row .t{font-size:14px;font-weight:600}
.switch-row .d{font-size:11.5px;color:var(--ink3);margin-top:1px}
.switch{
  width:46px;height:27px;border-radius:999px;background:#d5dedb;position:relative;
  flex:none;transition:background .18s;
}
.switch::after{
  content:'';position:absolute;top:2.5px;left:2.5px;width:22px;height:22px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .18s;
}
.switch.on{background:var(--brand)}
.switch.on::after{transform:translateX(19px)}

/* ============ 名单导入预览 ============ */
.ri-sum{font-size:13px;color:var(--ink2);margin:12px 0 6px}
.ri-sum b{color:var(--brand-d);font-size:15px;font-variant-numeric:tabular-nums}
.ri-box{
  border:1px solid var(--line);border-radius:9px;
  max-height:230px;overflow:auto;-webkit-overflow-scrolling:touch;
}
.ri-row{
  display:grid;grid-template-columns:40px 78px 1fr 62px;gap:6px;
  padding:6px 9px;font-size:12.5px;align-items:center;
  border-bottom:1px solid var(--line2);cursor:pointer;
}
.ri-row:last-child{border-bottom:0}
.ri-row.head{
  position:sticky;top:0;z-index:1;background:#f6faf9;
  font-weight:700;color:var(--ink2);font-size:11.5px;cursor:default;
}
.ri-row .no{font-weight:700;color:var(--brand-d);font-variant-numeric:tabular-nums}
.ri-row .sid{color:var(--ink3);font-size:11.5px;font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-row .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-row.bad{background:#fdf5f4}
.ri-row.bad .nm,.ri-row.bad .no{color:var(--bad)}
.ri-row.bad .sid{color:#c99}
.ri-row.off{opacity:.45;text-decoration:line-through}
.ri-st{font-size:10.5px;font-weight:600;text-align:right;white-space:nowrap}
.ri-st.ok{color:var(--ok)}
.ri-st.no{color:var(--bad)}

/* ============ 登记导出选项 ============ */
.exp-opt{
  display:block;width:100%;text-align:left;background:#fff;
  border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:9px;
}
.exp-opt:active{background:var(--brand-l)}
.exp-opt[disabled]{opacity:.55}
.exp-opt .t{font-size:14.5px;font-weight:700;color:var(--ink)}
.exp-opt .d{font-size:11.5px;color:var(--ink3);margin-top:4px;line-height:1.55}

/* ============ 成绩导入预览 ============ */
.si-box{
  border:1px solid var(--line);border-radius:9px;
  max-height:250px;overflow:auto;-webkit-overflow-scrolling:touch;margin-top:2px;
}
.si-row{
  display:grid;grid-template-columns:42px 1fr 60px 62px;gap:6px;
  padding:6px 9px;font-size:12.5px;align-items:center;
  border-bottom:1px solid var(--line2);
}
.si-row:last-child{border-bottom:0}
.si-row.head{
  position:sticky;top:0;z-index:1;background:#f6faf9;
  font-weight:700;color:var(--ink2);font-size:11.5px;
}
.si-row .no{font-weight:700;color:var(--brand-d);font-variant-numeric:tabular-nums}
.si-row .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si-row .sc{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.si-row.bad{background:#fdf5f4}
.si-row.bad .nm{color:var(--bad);font-weight:500}
.si-st{font-size:10.5px;font-weight:600;text-align:right;white-space:nowrap;color:var(--ok)}
.si-st.no{color:var(--bad);white-space:normal;line-height:1.25}
.si-st.abs{color:var(--warn)}

/* ============ 错题 ============ */
.seg{
  display:flex;background:var(--line2);border-radius:9px;padding:3px;margin-bottom:11px;
  overflow-x:auto;scrollbar-width:none;
}
.seg::-webkit-scrollbar{display:none}
.seg button{
  flex:1;padding:6px 10px;border-radius:7px;font-size:13px;color:var(--ink2);
  font-weight:600;white-space:nowrap;
}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(15,31,29,.1)}

.mis-row{
  display:flex;gap:9px;align-items:flex-start;padding:10px 0;
  border-bottom:1px solid var(--line2);
}
.mis-row:last-child{border-bottom:0}
.mis-q{
  flex:none;min-width:42px;padding:3px 8px;border-radius:7px;background:var(--bad-l);
  color:var(--bad);font-weight:700;font-size:12.5px;text-align:center;
}
.mis-main{flex:1;min-width:0;font-size:13.5px}
.mis-main .who{font-weight:600}
.mis-main .kn{color:var(--ink2);font-size:12.5px;margin-top:2px}
.mis-main .nt{color:var(--ink3);font-size:12px;margin-top:2px;word-break:break-word}
.mis-del{flex:none;color:var(--ink3);font-size:15px;padding:2px 4px}

.bar-item{margin-bottom:9px}
.bar-item .bl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
.bar-item .bl b{font-weight:600}
.bar-item .bl span{color:var(--ink3);font-size:12px}
.bar-track{height:8px;background:var(--line2);border-radius:4px;overflow:hidden}
.bar-track i{display:block;height:100%;border-radius:4px;background:var(--brand);transition:width .35s}

/* ============ 统计 ============ */
.donut-wrap{display:flex;align-items:center;gap:14px;padding:4px 0 6px}
.donut{width:104px;height:104px;flex:none;position:relative}
.donut svg{transform:rotate(-90deg);display:block}
.donut .ctr{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
}

.legend .lg{display:flex;align-items:center;gap:6px;font-size:12.5px}
.legend .lg i{width:8px;height:8px;border-radius:2px;flex:none}

/* 卡片标题右侧的小动作按钮 */

/* 导出按钮：两列紧凑 */
.exp-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.exp-grid .btn{padding:8px 6px;font-size:13px}

/* 日志折叠 */
.log-more{
  width:100%;margin-top:9px;padding:7px;border-radius:8px;
  background:var(--line2);color:var(--ink2);font-size:12px;font-weight:600;
}
.log-more:active{opacity:.7}

.log-row{font-size:12px;color:var(--ink2);padding:6px 0;border-bottom:1px solid var(--line2);display:flex;gap:7px}
.log-row:last-child{border-bottom:0}
.log-row .tm{color:var(--ink3);flex:none;font-variant-numeric:tabular-nums}

/* ============ Tabbar ============ */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:60;
  display:flex;background:rgba(255,255,255,.95);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-top:1px solid var(--line);
  padding-bottom:var(--safe-b);
}
.tabbar button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;

}
.tabbar button svg{width:20px;height:20px}

/* ============ Toast ============ */
#toast{

<script>
"use strict";
/* ==================================================================
   化学作业登记  ·  单文件应用
   数据层：IndexedDB   登记入口：文字批量输入（解析引擎 parseUtterance）
   ================================================================== */

/* ---------------------------------------------------------------
   0. 基础工具
   --------------------------------------------------------------- */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}
function fmtDT(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  return `${d.getMonth() + 1}月${d.getDate()}日 ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fmtFull(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function toLocalInput(ts) {
  const d = new Date(ts);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fromLocalInput(v) {
  if (!v) return 0;
  const t = new Date(v).getTime();
  return isNaN(t) ? 0 : t;
}
function relDay(ts) {
  if (!ts) return '';
  const a = new Date(ts); const b = new Date();
  const d0 = new Date(a.getFullYear(), a.getMonth(), a.getDate()).getTime();
  const d1 = new Date(b.getFullYear(), b.getMonth(), b.getDate()).getTime();
  const diff = Math.round((d0 - d1) / 86400000);
  if (diff === 0) return '今天';
  if (diff === 1) return '明天';
  if (diff === -1) return '昨天';
  if (diff > 1 && diff < 7) return diff + '天后';
  if (diff < -1 && diff > -7) return (-diff) + '天前';
  return '';
}
let toastTimer = null;
function toast(msg, kind) {
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'show' + (kind ? ' ' + kind : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, 1900);
}

/* ---------------------------------------------------------------
   1. 中文数字归一化  <->  整数
   --------------------------------------------------------------- */
const CN_DIGIT = {
  '零': 0, '〇': 0, '一': 1, '壹': 1, '二': 2, '贰': 2, '两': 2, '三': 3, '叁': 3,
  '四': 4, '肆': 4, '五': 5, '伍': 5, '六': 6, '陆': 6, '七': 7, '柒': 7,
  '八': 8, '捌': 8, '九': 9, '玖': 9
};
const CN_UNIT = { '十': 10, '拾': 10, '百': 100, '佰': 100, '千': 1000, '仟': 1000 };
const NUM_CHARS = '0123456789零〇一二两三四五六七八九十百千万亿壹贰叁肆伍陆柒捌玖拾佰仟';

/**
 * 中文数字 / 阿拉伯数字混合串 → 整数
 * 「十二」→12  「二十五」→25  「一百零三」→103  「12」→12
 * 无法识别时返回 NaN
 */
function cnToInt(str) {
  if (str == null) return NaN;
  const s = String(str).trim();
  if (!s) return NaN;
  if (/^\d+$/.test(s)) return parseInt(s, 10);
  let section = 0, num = null, ok = false;
  for (const ch of s) {
    if (Object.prototype.hasOwnProperty.call(CN_DIGIT, ch)) {
      num = CN_DIGIT[ch]; ok = true;
    } else if (Object.prototype.hasOwnProperty.call(CN_UNIT, ch)) {
      const u = CN_UNIT[ch];
      if (num === null) num = 1;          // 「十二」：十前面没有数字按 1 处理
      section += num * u;
      num = null; ok = true;
    }
  }
  if (!ok) return NaN;
  return section + (num || 0);
}

/** 整数 → 中文读法（用于生成别名词表，「12」→「十二」） */
function intToCn(n) {
  n = Number(n);
  if (!isFinite(n) || n < 0) return '';
  if (n === 0) return '零';
  const D = '零一二三四五六七八九';
  if (n < 10) return D[n];
  if (n < 20) return '十' + (n % 10 ? D[n % 10] : '');
  if (n < 100) {
    const t = Math.floor(n / 10), r = n % 10;
    return D[t] + '十' + (r ? D[r] : '');
  }
  if (n < 1000) {
    const h = Math.floor(n / 100), r = n % 100;
    let s = D[h] + '百';
    if (r === 0) return s;
    if (r < 10) return s + '零' + D[r];
    return s + intToCn(r);
  }
  return String(n);
}

/* ---------------------------------------------------------------
   2. 常量
   --------------------------------------------------------------- */
const STATUS = {
  pending:   { label: '未登记', cls: 'st-pending',   color: '#8b9b98' },
  submitted: { label: '已交',   cls: 'st-submitted', color: '#0f9155' },
  missing:   { label: '未交',   cls: 'st-missing',   color: '#cf3a3a' },
  makeup:    { label: '补交',   cls: 'st-makeup',    color: '#b8730a' },
  leave:     { label: '请假',   cls: 'st-leave',     color: '#5450c8' },
  exempt:    { label: '免交',   cls: 'st-exempt',    color: '#0b7d94' }
};
const STATUS_KEYS = ['pending', 'submitted', 'missing', 'makeup', 'leave', 'exempt'];

/* 作业类型：每个班可在表单里自己增删改名（存进班级 typeList）。
   HW_TYPES 只用于兼容旧数据（type 字段还是 write/lab 等旧键） */
const HW_TYPES = {
  write:  { label: '书面', cls: 'bg-write' },
  lab:    { label: '实验', cls: 'bg-lab' },
  calc:   { label: '计算', cls: 'bg-calc' },
  recite: { label: '背诵', cls: 'bg-recite' }
};
const DEFAULT_HW_TYPES = ['书面', '实验', '计算', '背诵'];
const HW_TYPE_COLORS = [
  { bg: '#e8f0fe', fg: '#1a56c4' }, { bg: '#f0eafd', fg: '#6d28d9' },
  { bg: '#fdf0e3', fg: '#b45309' }, { bg: '#e2f6f8', fg: '#0b7d94' },
  { bg: '#e7f6ec', fg: '#15803d' }, { bg: '#fdeaea', fg: '#b3392f' },
  { bg: '#f3f0fa', fg: '#5450c8' }, { bg: '#fdeff5', fg: '#be185d' }
];
/** 当前班级的类型列表（缺省时补默认并落库） */
function classTypes() {
  const c = curClass();
  if (!c) return DEFAULT_HW_TYPES.slice();
  if (!Array.isArray(c.typeList)) c.typeList = DEFAULT_HW_TYPES.slice();
  return c.typeList;
}
async function saveTypes() { const c = curClass(); if (c) await DB.put('classes', c); }
/** 作业类型 → {label, bg, fg}：优先 hw.typeLabel，旧数据走 HW_TYPES 映射 */
function hwTypeOf(hw) {
  let label = hw.typeLabel || '';
  if (!label && HW_TYPES[hw.type]) label = HW_TYPES[hw.type].label;
  if (!label) return { label: '', bg: '#eef3f2', fg: '#5f716e' };
  const list = classTypes();
  let i = list.indexOf(label);
  if (i < 0) {
    const legacy = Object.keys(HW_TYPES).find(k => HW_TYPES[k].label === label);
    i = legacy ? DEFAULT_HW_TYPES.indexOf(label) : 0;
    if (i < 0) i = 0;
  }
  const c = HW_TYPE_COLORS[i % HW_TYPE_COLORS.length];
  return { label, bg: c.bg, fg: c.fg };
}
function typeBadge(hw) {
  const t = hwTypeOf(hw);
  return t.label ? '<span class="badge" style="background:' + t.bg + ';color:' + t.fg + '">' + esc(t.label) + '</span>' : '';
}

/* ---------------------------------------------------------------
   3. IndexedDB 数据层
   --------------------------------------------------------------- */
const DB_NAME = 'chem_hw_db';
const DB_VER = 2;
const STORES = ['classes', 'students', 'assignments', 'records', 'mistakes', 'logs', 'exams', 'scores'];

const DB = {
  db: null,
  open() {
    return new Promise((resolve, reject) => {
      if (!('indexedDB' in window)) { reject(new Error('浏览器不支持 IndexedDB')); return; }
      const req = indexedDB.open(DB_NAME, DB_VER);
      req.onupgradeneeded = () => {
        const d = req.result;
        STORES.forEach(name => {
          if (!d.objectStoreNames.contains(name)) {
            const os = d.createObjectStore(name, { keyPath: 'id' });
            if (name !== 'classes') os.createIndex('classId', 'classId', { unique: false });
            if (name === 'records') os.createIndex('assignmentId', 'assignmentId', { unique: false });
            if (name === 'scores') os.createIndex('examId', 'examId', { unique: false });
          }
        });
      };
      req.onsuccess = () => { DB.db = req.result; resolve(); };
      req.onerror = () => reject(req.error);
      req.onblocked = () => reject(new Error('数据库被其他标签页占用，请关闭其他页面后重试'));
    });
  },
  _os(name, mode) { return DB.db.transaction(name, mode).objectStore(name); },
  put(name, val) {
    return new Promise((res, rej) => {
      const r = DB._os(name, 'readwrite').put(val);
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  },
  putMany(name, arr) {
    return new Promise((res, rej) => {
      if (!arr.length) { res(); return; }
      const tx = DB.db.transaction(name, 'readwrite');
      const os = tx.objectStore(name);
      arr.forEach(v => os.put(v));
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  },
  del(name, key) {
    return new Promise((res, rej) => {
      const r = DB._os(name, 'readwrite').delete(key);
      r.onsuccess = () => res();
      r.onerror = () => rej(r.error);
    });
  },
  all(name) {
    return new Promise((res, rej) => {
      const r = DB._os(name, 'readonly').getAll();
      r.onsuccess = () => res(r.result || []);
      r.onerror = () => rej(r.error);
    });
  },
  clear(name) {
    return new Promise((res, rej) => {
      const r = DB._os(name, 'readwrite').clear();
      r.onsuccess = () => res();
      r.onerror = () => rej(r.error);
    });
  },
  async wipeAll() {
    for (const n of STORES) await DB.clear(n);
  }
};

const recKey = (hwId, sid) => hwId + '::' + sid;

function curClass()      { return S.classes.find(c => c.id === S.classId) || null; }
function curHw()         { return S.assignments.find(a => a.id === S.hwId) || null; }

/** 兜底：保证始终存在一个可用班级（删空班级后自动补建） */
async function ensureClass() {
  if (S.classId && S.classes.some(c => c.id === S.classId)) return S.classId;
  if (!S.classes.length) {
    const c = { id: uid(), name: '高一(1)班', createdAt: Date.now() };
    await DB.put('classes', c);
    S.classes.push(c);
  }
  S.classId = S.classes[0].id;
  S.hwId = null;
  return S.classId;
}
function classStudents(cid) {
  const id = cid || S.classId;
  return S.students.filter(s => s.classId === id).sort((a, b) => (a.no - b.no) || a.name.localeCompare(b.name, 'zh'));
}
function classHw(cid) {
  const id = cid || S.classId;
  return S.assignments.filter(a => a.classId === id).sort((a, b) => (b.assignedAt || 0) - (a.assignedAt || 0));
}
function classMistakes(cid) {
  const id = cid || S.classId;
  return S.mistakes.filter(m => m.classId === id);
}
function getRec(hwId, sid) {
  return S.records.get(recKey(hwId, sid)) || {
    id: recKey(hwId, sid), assignmentId: hwId, classId: S.classId, studentId: sid,
    status: 'pending', tags: [], excellent: false, note: '', updatedAt: 0
  };
}
function statusOf(sid) {
  if (!S.hwId) return 'pending';
  return getRec(S.hwId, sid).status;
}

async function addLog(entry) {
  const log = Object.assign({ id: uid(), ts: Date.now() }, entry);
  S.logs.unshift(log);
  if (S.logs.length > 3000) S.logs.length = 3000;
  try { await DB.put('logs', log); } catch (e) { /* 日志失败不阻塞主流程 */ }
}

/**
 * 设置学生状态（唯一入口，所有变更都会写日志）
 * opts: { source, silent, noUndo, force }
 */
async function setStatus(sid, status, opts) {
  opts = opts || {};
  const hw = curHw();
  if (!hw) { toast('请先选择或新建一次作业', 'bad'); return false; }
  if (!STATUS[status]) return false;
  const stu = S.students.find(s => s.id === sid);
  if (!stu) return false;

  const key = recKey(hw.id, sid);
  const prev = S.records.get(key);
  const before = prev ? prev.status : 'pending';
  if (before === status && !opts.force && !opts.tag) return false;

  const rec = Object.assign({
    id: key, assignmentId: hw.id, classId: hw.classId, studentId: sid,
    status: 'pending', tags: [], excellent: false, note: '', updatedAt: 0
  }, prev || {});
  rec.status = status;
  const tagsBefore = (rec.tags || []).slice();
  // 本次分类：登记的同时把分类打上。**每个学生只保留一个分类**，
  // 打新分类时自动替换旧分类（不是追加）。
  if (opts.tag) {
    rec.tags = [opts.tag];
    rememberTag(opts.tag);                 // 用过的分类留在本次分类条上
  }
  rec.updatedAt = Date.now();
  S.records.set(key, rec);                 // 内存先落地，界面可立即重绘

  // 撤销栈同步入栈（放在 await 之前，保证按钮状态即时刷新）
  if (!opts.noUndo) {
    S.undoStack.push({ hwId: hw.id, sid, before, after: status, tagsBefore, ts: Date.now() });
    if (S.undoStack.length > 80) S.undoStack.shift();
    renderVoiceUI();
  }

  await DB.put('records', rec);
  await addLog({
    classId: hw.classId, hwId: hw.id, sid,
    name: stu.name, from: before, to: status,
    source: opts.source || 'manual'
  });
  return true;
}

/* 批量改状态：整批只入一个撤销单元，撤销时一次性全部回退 */
async function setStatusBatch(ids, status, opts) {
  opts = opts || {};
  const batch = [];
  for (const sid of ids) {
    const before = statusOf(sid);
    if (before === status && !opts.force && !opts.tag) continue;
    const tagsBefore = ((getRec(S.hwId, sid).tags) || []).slice();
    const ok = await setStatus(sid, status, {
      source: opts.source || 'manual', noUndo: true, force: opts.force, tag: opts.tag
    });
    if (ok) batch.push({ sid, before, tagsBefore });
  }
  if (batch.length) {
    S.undoStack.push({ hwId: S.hwId, batch, ts: Date.now() });
    if (S.undoStack.length > 80) S.undoStack.shift();
    renderVoiceUI();
  }
  return batch.length;
}

async function patchRec(sid, patch, opts) {
  opts = opts || {};
  const hw = curHw();
  if (!hw) return;
  const key = recKey(hw.id, sid);
  const prev = S.records.get(key);
  const rec = Object.assign({
    id: key, assignmentId: hw.id, classId: hw.classId, studentId: sid,
    status: 'pending', tags: [], excellent: false, note: '', updatedAt: 0
  }, prev || {}, patch);
  rec.updatedAt = Date.now();
  S.records.set(key, rec);
  await DB.put('records', rec);
  const stu = S.students.find(s => s.id === sid);
  if (patch.tags) {
    await addLog({ classId: hw.classId, hwId: hw.id, sid, name: stu ? stu.name : '',
      from: '分类', to: patch.tags.length ? patch.tags.join('/') : '（清空）', source: opts.source || 'manual' });
  }
  if ('excellent' in patch) {
    await addLog({ classId: hw.classId, hwId: hw.id, sid, name: stu ? stu.name : '',
      from: '优秀', to: patch.excellent ? '优秀作业' : '取消优秀', source: opts.source || 'manual' });
  }
  if ('note' in patch) {
    await addLog({ classId: hw.classId, hwId: hw.id, sid, name: stu ? stu.name : '',
      from: '备注', to: patch.note ? '已填写' : '已清空', source: opts.source || 'manual' });
  }
}

     整串交给 cnToInt() 转整数，按序号查表。
     因为整串读取，「十二」→ 12、「二十四」→ 24，

     仅当名单里真实存在该序号时才会命中（受限匹配）。

   边界保护：单字数字（一/二/…/9）必须后跟「号」或为整句内容，

const PY_MAP = (() => {
  const m = new Map();
  PY_GROUPS.split('|').forEach(g => {
    const i = g.indexOf(':');
    if (i < 0) return;
    const py = g.slice(0, i), cs = g.slice(i + 1);
    for (const ch of cs) m.set(ch, py);
  });
  return m;
})();

/** 取字符串的无声调全拼；非汉字（标点、数字）直接丢弃 */
function pyOf(str) {
  let out = '';
  for (const ch of String(str || '')) {
    const p = PY_MAP.get(ch);
    if (p) out += p;
    else if (/[a-z0-9]/i.test(ch)) out += ch.toLowerCase();
  }
  return out;
}

/** 编辑距离（插/删/替换各算 1），超过 limit 立即返回 limit+1 */
function levDist(a, b, limit) {
  const n = a.length, m = b.length;
  if (Math.abs(n - m) > limit) return limit + 1;
  let prev = new Array(m + 1), cur = new Array(m + 1);
  for (let j = 0; j <= m; j++) prev[j] = j;
  for (let i = 1; i <= n; i++) {
    cur[0] = i;
    let rowMin = i;
    for (let j = 1; j <= m; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
      if (cur[j] < rowMin) rowMin = cur[j];
    }
    if (rowMin > limit) return limit + 1;
    const t = prev; prev = cur; cur = t;
  }
  return prev[m];
}

function buildAliasIndex(classId) {
  const list = classStudents(classId);
  const byNo = new Map();        // 序号(整数) -> 学生
  const nameMap = new Map();     // 姓名别名 -> 学生 | null(重名作废)

  const putName = (alias, stu) => {
    if (!alias || alias.length < 2) return;  // 单字姓名不参与，避免与数字「一」冲突
    const prev = nameMap.get(alias);
    if (prev === undefined) nameMap.set(alias, stu);
    else if (prev && prev.id !== stu.id) nameMap.set(alias, null); // 班内重名 → 该别名作废
  };

  const pyList = [];             // 读音候选：{ py, stu }
  const pySeen = new Set();

  list.forEach(s => {
    const n = Number(s.no);
    if (isFinite(n)) byNo.set(n, s);
    putName(s.name, s);
    if (s.name.length >= 3) putName(s.name.slice(1), s); // 去姓（仅 ≥3 字，且唯一）

    // 读音候选：全名 + 去姓名字（≥3 字时）
    const cands = [s.name];
    if (s.name.length >= 3) cands.push(s.name.slice(1));
    cands.forEach(c => {
      const py = pyOf(c);
      if (py.length < 4) return;       // 太短容易误配
      const k = py + '#' + s.id;
      if (pySeen.has(k)) return;
      pySeen.add(k);
      pyList.push({ py, stu: s, short: c !== s.name });
    });
  });
  // 同一读音既可能是全名也可能是去姓名 → 交给歧义判定处理，这里只按长度降序
  pyList.sort((a, b) => b.py.length - a.py.length);

  const byFirst = new Map();
  for (const [alias, stu] of nameMap) {
    if (!stu) continue;                    // 重名冲突的别名直接丢弃
    const f = alias[0];
    if (!byFirst.has(f)) byFirst.set(f, []);
    byFirst.get(f).push({ alias, stu });
  }
  for (const arr of byFirst.values()) {
    arr.sort((a, b) => b.alias.length - a.alias.length);  // 同一位置优先最长
  }
  return { byNo, byFirst, pyList };
}

const UNDO_RE = /(撤销|撤回|回退|上一步|取消上一步|说错了|收回)/;

/* ---------------------------------------------------------------
   语音文本归一化
   全角转半角；标点与空白统一替换为分隔符 SEP。
   注意不能直接删标点，否则「十二 十五」会粘连成「十二十五」被当成 35。
   --------------------------------------------------------------- */
const SEP = '\u0001';
const RANGE = '\u0002';                  // 区间连接符专用标记（1-3 / 1~3 / 1到3）
const V_RANGE = /[-~～—–－]/g;           // 短横、波浪号、破折号都算"到"
const V_PUNCT = /[，。、；：！？,.;:!?（）()【】\[\]「」『』《》…·/\\|]/g;
function normVoice(raw) {
  return String(raw || '')
    .replace(/[\uFF01-\uFF5E]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(V_RANGE, SEP + RANGE + SEP)
    .replace(V_PUNCT, SEP)
    .replace(/\s+/g, SEP)
    .replace(/\u0001+/g, SEP)
    .replace(/\u0002+/g, RANGE);
}

/* ---------------------------------------------------------------
   状态词 —— 语音分类批量登记
   一句话里说出分类（已交 / 未交 / 补交 / 请假 / 免交），
   该分类作用于这句话里的所有学生。
   按长度降序参与正则，保证「未交作业」先于「未交」、「未交」先于「交」。
   --------------------------------------------------------------- */
const ST_MAP = {
  '未交作业': 'missing', '没交作业': 'missing',
  '未交': 'missing', '没交': 'missing', '没带': 'missing', '没写': 'missing',
  '没做': 'missing', '未完成': 'missing', '未提交': 'missing', '交了没': 'missing',
  '补交': 'makeup', '补做': 'makeup', '补上': 'makeup',
  '已交': 'submitted', '交了': 'submitted', '交上': 'submitted', '交齐': 'submitted',
  '交完了': 'submitted', '交完': 'submitted', '全交': 'submitted', '都交': 'submitted',
  '全部交': 'submitted', '全齐': 'submitted',
  '请假': 'leave', '病假': 'leave', '事假': 'leave',
  '免交': 'exempt', '不用交': 'exempt', '免做': 'exempt', '不交': 'exempt',
  '未登记': 'pending', '没登记': 'pending', '漏登记': 'pending'
};
const ST_RE = new RegExp('(' + Object.keys(ST_MAP).sort((a, b) => b.length - a.length).join('|') + ')', 'g');
const ALL_RE = /(全班|所有人|全部同学|每个同学|每个人|全体)/;

function detectStatusTokens(s) {
  const out = [];
  ST_RE.lastIndex = 0;
  let m;
  while ((m = ST_RE.exec(s)) !== null) {
    out.push({ status: ST_MAP[m[1]], start: m.index, end: m.index + m[1].length });
  }
  return out;
}

/* 分类词：本次分类 + 学生身上已有的（长词优先，供语音识别） */
const escRe = s => String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
let TAG_RE_CACHE = { src: '', re: null };
function tagRegex() {
  const tags = collectAllTags().filter(t => t && t.length >= 2);
  const src = tags.sort((a, b) => b.length - a.length).map(escRe).join('|');
  if (TAG_RE_CACHE.src !== src) TAG_RE_CACHE = { src, re: src ? new RegExp('(' + src + ')', 'g') : null };
  return TAG_RE_CACHE.re;
}
function detectTagTokens(s) {
  const re = tagRegex();
  if (!re) return [];
  const out = [];
  let m;
  re.lastIndex = 0;
  while ((m = re.exec(s)) !== null) {
    out.push({ tag: m[1], start: m.index, end: m.index + m[1].length });
    if (m[1].length === 0) re.lastIndex++;
  }
  return out;
}

/* 序号区间：「一到十号」「第1至第10号」 */
const NUM_CLS = '[0-9零〇一二两三四五六七八九十百千万亿壹贰叁肆伍陆柒捌玖拾佰仟]';
const RANGE_RE = new RegExp(
  '(?:第)?(' + NUM_CLS + '+)(?:号)?' + SEP + '*(?:到|至|' + RANGE + ')' + SEP + '*(?:第)?(' + NUM_CLS + '+)(?:号)?', 'g');

/**
 * 从一段识别文本中抽取学生
 * @param text  识别文本（或已归一化的文本）
 * @param index buildAliasIndex 的结果
 * @param opts  { skip:[[start,end],…] 预占片段（状态词），下标基于归一化后的串 }
 * @returns { hits:Student[], items:[{stu,pos,len,fuzzy,dist}], undo, tokens, ambiguous }
 */
function parseUtterance(text, index, opts) {
  opts = opts || {};
  const raw = String(text || '');
  const s = opts.normalized ? raw : normVoice(raw);
  const undo = UNDO_RE.test(raw);

  const chars = s.split('');
  const used = new Array(chars.length).fill(false);
  (opts.skip || []).forEach(rg => {
    for (let k = rg[0]; k < rg[1] && k < used.length; k++) used[k] = true;
  });

  const found = [];             // { stu, pos, len, fuzzy, dist }

  /* ---- 第一遍：姓名最长匹配 —— 先把人名整段吃掉 ---- */
  let i = 0;
  while (i < chars.length) {
    if (used[i]) { i++; continue; }
    const cands = index.byFirst.get(chars[i]);
    let hit = null;
    if (cands) {
      for (const c of cands) {
        if (s.slice(i, i + c.alias.length) !== c.alias) continue;
        let free = true;
        for (let k = 0; k < c.alias.length; k++) { if (used[i + k]) { free = false; break; } }
        if (!free) continue;
        hit = c;
        break;
      }
    }
    if (hit) {
      found.push({ stu: hit.stu, pos: i, len: hit.alias.length, fuzzy: false, dist: 0 });
      for (let k = 0; k < hit.alias.length; k++) used[i + k] = true;
      i += hit.alias.length;
    } else {
      i += 1;
    }
  }

  /* ---- 第二遍之一：序号区间「一到十号」 ---- */
  RANGE_RE.lastIndex = 0;
  let rm;
  while ((rm = RANGE_RE.exec(s)) !== null) {
    let blocked = false;
    for (let k = 0; k < rm[0].length; k++) { if (used[rm.index + k]) { blocked = true; break; } }
    if (blocked) continue;
    const a0 = cnToInt(rm[1]), b0 = cnToInt(rm[2]);
    if (!isFinite(a0) || !isFinite(b0)) continue;
    const lo = Math.min(a0, b0), hi = Math.max(a0, b0);
    if (hi - lo > 100) continue;
    for (let n = lo; n <= hi; n++) {
      const stu = index.byNo.get(n);
      if (stu) found.push({ stu, pos: rm.index, len: 0, fuzzy: false, dist: 0 });
    }
    for (let k = 0; k < rm[0].length; k++) used[rm.index + k] = true;
  }

  /* ---- 第二遍之二：剩余文本抽取「连续数字串」，整串转整数后按序号查表 ----
     连续数字串整体读取，因此「十二」= 12、「二十四」= 24，
     绝不会退化成 1+2 或 2+14。                                            */
  let rest = '';
  const posMap = [];               // rest 下标 -> 原文下标
  for (let k = 0; k < chars.length; k++) {
    if (!used[k]) { rest += chars[k]; posMap.push(k); }
  }

  const NUM_RE = /[0-9零〇一二两三四五六七八九十百千万亿壹贰叁肆伍陆柒捌玖拾佰仟]+/g;
  let m;
  while ((m = NUM_RE.exec(rest)) !== null) {
    const run = m[0];
    const after = rest.charAt(m.index + run.length);
    // 单字数字（1~9 / 一~九）必须后跟「号」或处在分隔/结尾处才生效，
    // 避免「张一明」这类不在名单里的名字被误判成 1 号。
    // 「2和4」「3与5」「1及2」这类并列写法也要放行。
    if (run.length === 1) {
      const origPos = posMap[m.index];
      const beforeOrig = (origPos != null && origPos > 0) ? s.charAt(origPos - 1) : '';
      const beforeHan = /[\u4e00-\u9fa5]/.test(beforeOrig);
      if (after !== '号' && after !== '' && after !== SEP && !/[和与及跟]/.test(after)) continue;
      // 「张三」「李四」这类名字结尾的单字数字不是序号（否则「张三 62分」会记到 3 号）
      const isJoiner = /[和与及跟]/.test(beforeOrig);
      if (beforeHan && !isJoiner && (after === '' || after === SEP)) continue;
    }
    const n = cnToInt(run);
    if (!isFinite(n)) continue;
    const stu = index.byNo.get(n);
    if (stu) {
      const p0 = posMap[m.index];
      found.push({ stu, pos: p0 === undefined ? chars.length : p0, len: run.length, fuzzy: false, dist: 0 });
      for (let k = 0; k < run.length; k++) {
        const idx = posMap[m.index + k];
        if (idx !== undefined) used[idx] = true;
      }
    } else {
      /* 序号截断 / 多识别容错：念「五十一」常被识别成「五十」（丢尾字）。
         精确序号查不到人时，只在 n+1…n+9（截断丢字）与 n-1（多识别一字）里找候选；
         只有**唯一**候选才采用（防止 50/51 都在班里时误登记），并带 ≈ 模糊标记。 */
      const cands = [];
      for (let d = 1; d <= 9; d++) { const c = index.byNo.get(n + d); if (c) cands.push(c); }
      const prev = index.byNo.get(n - 1);
      if (prev && !cands.includes(prev)) cands.push(prev);
      if (cands.length === 1) {
        const p0 = posMap[m.index];
        found.push({ stu: cands[0], pos: p0 === undefined ? chars.length : p0, len: run.length, fuzzy: true, dist: 1 });
        for (let k = 0; k < run.length; k++) {
          const idx = posMap[m.index + k];
          if (idx !== undefined) used[idx] = true;
        }
      }
    }
  }

  /* ---- 第三遍：读音模糊匹配 ---- 
     ASR 常把同音字听错（李娜→李那）。把未被精确命中的连续汉字片段转成
     无声调全拼，与名单里每个姓名的全拼做等长替换比对：
       · 6 字母以内（2 字名）要求完全同音（距离 0）
       · 11 字母以内允许 1 处差异，更长允许 2 处
     同一位置若撞上两个人的读音，宁可不猜，交给人工确认。               */
  const amb = [];
  if (index.pyList && index.pyList.length) {
    /* 短名字（全拼 ≤5）只认同音，长名字允许 1~2 处差异。
       「敏/明」「静/晶」这类 in/ing、n/l 混淆往往差一个字母，
       所以比对长度允许 ±1。 */
    const tryMatch = (c, P, pos) => {
      const L = c.py.length;
      if (L <= 5) {
        if (pos + L > P.length) return null;
        return P.substr(pos, L) === c.py ? { d: 0, len: L } : null;
      }
      const lim = L <= 10 ? 1 : 2;
      let best = null;
      [L, L + 1, L - 1].forEach(len => {
        if (len <= 0 || pos + len > P.length) return;
        const d = levDist(P.substr(pos, len), c.py, lim);
        if (d > lim) return;
        if (!best || d < best.d || (d === best.d && len > best.len)) best = { d, len };
      });
      return best;
    };

    let p = 0;
    while (p < chars.length) {
      if (used[p] || chars[p] === SEP || !PY_MAP.has(chars[p])) { p++; continue; }
      let P = '', pm = [];
      let q = p;
      while (q < chars.length && !used[q] && chars[q] !== SEP && PY_MAP.has(chars[q])) {
        const py = PY_MAP.get(chars[q]);
        for (let k = 0; k < py.length; k++) pm.push(q);
        P += py;
        q++;
      }

      let pos = 0;
      while (pos < P.length) {
        let best = null, bestC = null;
        for (const c of index.pyList) {
          const r = tryMatch(c, P, pos);
          if (!r) continue;
          if (!best || r.d < best.d || (r.d === best.d && r.len > best.len)) { best = r; bestC = c; }
        }
        if (!best) { pos++; continue; }

        // 同一个跨度上还有别人也能对上 → 读音撞车，宁可不猜
        let rival = null;
        for (const c of index.pyList) {
          if (c.stu.id === bestC.stu.id) continue;
          const r = tryMatch(c, P, pos);
          if (r && r.len === best.len && r.d <= best.d) { rival = c; break; }
        }
        if (rival) {
          amb.push({
            text: chars.slice(pm[pos], pm[pos + best.len - 1] + 1).join(''),
            names: [bestC.stu, rival.stu]
          });
          pos += best.len;
          continue;
        }

        const c0 = pm[pos], c1 = pm[pos + best.len - 1];
        for (let k = c0; k <= c1; k++) used[k] = true;
        found.push({ stu: bestC.stu, pos: c0, len: c1 - c0 + 1, fuzzy: true, dist: best.d });
        pos += best.len;
      }
      p = q;
    }
  }

  // 按在语流中出现的先后排序，并去重（同一学生只登记一次）
  found.sort((a, b) => a.pos - b.pos);
  const items = [];
  const seen = new Set();
  found.forEach(f => {
    if (seen.has(f.stu.id)) return;
    seen.add(f.stu.id);
    items.push(f);
  });
  return {
    hits: items.map(it => it.stu),
    items, undo,
    tokens: items.map(it => String(it.stu.no)),
    ambiguous: amb
  };
}

/**
 * 把一句话拆成「分组 -> 学生」的执行计划
 * 一句话里可以有多组分类：「张三 李四 补交，王五 请假」
 */
function buildVoicePlan(raw) {
  const index = buildAliasIndex(S.classId);
  const sel = $('#quickStatus');
  const def = sel && sel.value ? sel.value : 'submitted';
  const defTag = S.quickTag || '';

  const segs = String(raw || '')
    .split(/[，。；！？,.;!?]|然后|接着|还有|以及/)
    .map(x => x.trim())
    .filter(Boolean);

  const groups = [];
  const ambiguous = [];
  const seen = new Set();

  const push = (stu, status, tag, meta) => {
    if (seen.has(stu.id)) return;
    seen.add(stu.id);
    const key = status + '|' + (tag || '');
    let g = groups.find(x => x.key === key);
    if (!g) { g = { key, status, tag: tag || '', items: [] }; groups.push(g); }
    g.items.push(Object.assign({ stu, pos: 0, len: stu.name.length, fuzzy: false }, meta || {}));
  };

  /* 一个词（状态词/分类词）的归属：先找它后面最近的，再退回前面最近的 */
  const pickScope = (toks, it, field) => {
    if (!toks.length) return null;
    if (toks.length === 1) return toks[0][field];
    const ns = it.pos, ne = it.pos + (it.len || 0);
    let best = null;
    for (const t of toks) { if (t.start >= ne) { best = t; break; } }
    if (!best) for (const t of toks) { if (t.end <= ns) best = t; }
    return best ? best[field] : null;
  };

  segs.forEach(segText => {
    const s0 = normVoice(segText);
    const toks = detectStatusTokens(s0);
    const tagToks = detectTagTokens(s0);
    const isAll = ALL_RE.test(s0);

    // 全班 + 状态/分类，一次标完
    if (isAll && (toks.length || tagToks.length)) {
      const st = toks.length ? toks[0].status : def;
      const tg = tagToks.length ? tagToks[0].tag : defTag;
      classStudents().forEach(stu => push(stu, st, tg));
      return;
    }

    // 状态词、分类词都先占位，避免被当成某个名字的读音
    const skip = toks.map(t => [t.start, t.end]).concat(tagToks.map(t => [t.start, t.end]));
    const r = parseUtterance(segText, index, { skip });
    r.ambiguous.forEach(a => ambiguous.push(a));
    if (!r.items.length) return;

    r.items.forEach(it => {
      const st = pickScope(toks, it, 'status') || def;
      let tg = pickScope(tagToks, it, 'tag');
      // 只出现一个分类词时，它管这一小段里的所有人
      if (!tg && tagToks.length === 1) tg = tagToks[0].tag;
      if (!tg) tg = defTag;
      push(it.stu, st, tg, { fuzzy: it.fuzzy, dist: it.dist, pos: it.pos, len: it.len });
    });
  });

  return { groups, ambiguous, def };
}

/* ---------------------------------------------------------------
   8. 语音运行时（状态机 + iOS 断点续听）
   --------------------------------------------------------------- */
const Voice = { listening: false, _userWants: false, adapter: { available: false, name: '文字输入' }, init() {}, start() {}, stop() {} };

function setVoiceStatus(t) { const el = $('#voiceStatus'); if (el) el.textContent = t; }
function renderVoiceUI() {
  $('#btnVoiceUndo').disabled = S.undoStack.length === 0;
  const aj = $('#btnAutoJump');
  if (aj) {
    const on = autoJumpOn();
    aj.textContent = '自动定位 ' + (on ? '开' : '关');
    aj.classList.toggle('off', !on);
  }
  renderExamVoiceUI();
}

/** 处理一句批量登记文本（文字输入与原语音共用同一解析管线） */
async function handleVoiceText(text) {
  const box = $('#voiceText');
  if (!text || !text.trim()) return;

  if (UNDO_RE.test(text)) {
    await doUndo('voice');
    box.innerHTML = '<span class="hit">撤销</span>' + esc(text);
    return;
  }

  const plan = buildVoicePlan(text);
  const all = [];
  plan.groups.forEach(g => g.items.forEach(it => all.push(it)));

  if (!all.length) {
    if (plan.ambiguous.length) {
      box.innerHTML = '<span style="opacity:.55">' + esc(text) + '</span>　' +
        plan.ambiguous.map(a => '「' + esc(a.text) + '」读音接近 ' +
          a.names.map(s => esc(s.no + ' ' + s.name)).join(' / ')).join('；');
      return;
    }
    const nv = normVoice(text);
    const onlyStatus = detectStatusTokens(nv).length > 0 || detectTagTokens(nv).length > 0;
    box.innerHTML = '<span style="opacity:.55">' + esc(text) + '</span>　' +
      (onlyStatus ? '只听到分类，没听到姓名或序号' : '未匹配到名单');
    return;
  }

  const batch = [];
  let dupCount = 0;
  for (const g of plan.groups) {
    for (const it of g.items) {
      const before = statusOf(it.stu.id);
      const rec = getRec(S.hwId, it.stu.id);
      const hasTag = g.tag ? (rec.tags || []).includes(g.tag) : true;
      if (before === g.status && hasTag) { dupCount++; continue; }
      const tagsBefore = (rec.tags || []).slice();
      await setStatus(it.stu.id, g.status, { source: 'voice', noUndo: true, tag: g.tag });
      batch.push({ sid: it.stu.id, before, tagsBefore });
    }
  }

  // 整句（可能跨多个分类）作为**一个**撤销单元，避免撤销几十次
  if (batch.length) {
    S.undoStack.push({ hwId: S.hwId, batch, ts: Date.now() });
    if (S.undoStack.length > 80) S.undoStack.shift();
  }

  // 结果回显：≈ 表示按读音匹配（不是字面一致），后面跟分类 + 状态
  box.innerHTML = plan.groups.map(g => {
    const stTag = g.status === plan.def ? '' :
      '<span class="vtag">' + (STATUS[g.status] ? STATUS[g.status].label : g.status) + '</span>';
    const tgTag = g.tag ? '<span class="vtag t">' + esc(g.tag) + '</span>' : '';
    return g.items.map(it =>
      '<span class="hit' + (it.fuzzy ? ' fuzzy' : '') + '">' +
      (it.fuzzy ? '≈' : '') + esc(it.stu.no + ' ' + it.stu.name) + '</span>'
    ).join('') + tgTag + stTag;
  }).join('') +
    (dupCount ? '<span style="opacity:.6">（' + dupCount + ' 人已是该状态）</span>' : '') +
    (plan.ambiguous.length ? '<span style="opacity:.6">（' + plan.ambiguous.length + ' 处读音有歧义，未登记）</span>' : '');

  if (batch.length) {
    const names = all.slice(0, 3).map(it => it.stu.name).join('、');
    toast('已登记 ' + batch.length + ' 人：' + names + (all.length > 3 ? '…' : ''), 'ok');
  }
  renderRegister();
  flashStudents(all.map(it => it.stu.id));
  // 少量连念时把视线带到下一个人；大范围批量登记不动屏幕
  if (all.length <= 5) jumpToNextPending([all[all.length - 1].stu.id]);
}

function flashStudents(ids) {
  ids.forEach(id => {
    const el = document.querySelector('.stu[data-sid="' + id + '"]');
    if (el) { el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 900); }
  });
}

/* ---------------------------------------------------------------
   自动定位：登记完成后把视线带到「下一个未登记」的学生
   --------------------------------------------------------------- */
const AUTOJUMP_KEY = 'chemhw_autojump';

function autoJumpOn() {
  try { return localStorage.getItem(AUTOJUMP_KEY) !== '0'; } catch (e) { return true; }
}
function setAutoJump(on) {
  try { localStorage.setItem(AUTOJUMP_KEY, on ? '1' : '0'); } catch (e) {}
  renderVoiceUI();
}

/** 按班级顺序找到 afterSid 之后（含绕回队首）的第一个未登记学生 */
function nextPendingAfter(afterSid) {
  const list = classStudents();
  if (!list.length) return null;
  let start = 0;
  if (afterSid) {
    const i = list.findIndex(s => s.id === afterSid);
    if (i >= 0) start = i + 1;
  }
  for (let k = 0; k < list.length; k++) {
    const s = list[(start + k) % list.length];
    if (s.id === afterSid) continue;            // 全班只剩他自己时不要原地跳
    if (statusOf(s.id) === 'pending') return s;
  }
  return null;
}

/** 把卡片滚进舒适视区并短暂描边 */
function revealCard(el) {
  if (!el) return;
  const r = el.getBoundingClientRect();
  const vh = window.innerHeight || 800;
  // 只有明显在视区外才滚动，避免每次登记都晃屏
  if (r.top < vh * 0.20 || r.bottom > vh * 0.70) {
    try { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    catch (e) { el.scrollIntoView(); }
  }
  el.classList.remove('locate');
  void el.offsetWidth;                          // 重启动画
  el.classList.add('locate');
  clearTimeout(el._locTimer);
  el._locTimer = setTimeout(() => el.classList.remove('locate'), 1300);
}

/**
 * 批量登记后调用。只在「刚登记的人之后还有未登记」时才移动，
 * 全部登记完则保持安静（统计条已经显示 0）。
 */
function jumpToNextPending(afterIds) {
  if (!autoJumpOn()) return;
  const last = afterIds && afterIds.length ? afterIds[afterIds.length - 1] : null;
  const nxt = nextPendingAfter(last);
  if (!nxt) return;
  const el = document.querySelector('.stu[data-sid="' + nxt.id + '"]');
  if (!el) return;                              // 当前筛选下不可见，不强跳
  revealCard(el);
}

/** 撤销 */
async function doUndo(source) {
  const e = S.undoStack.pop();
  if (!e) { toast('没有可撤销的操作'); return; }
  if (e.hwId !== S.hwId) {
    // 切换到该操作所属作业再撤销
    S.hwId = e.hwId;
    await loadRecordsFor(null);
  }

  // 批量（语音一次念了多人）作为一个单元整体撤销
  if (e.batch && e.batch.length) {
    for (let i = e.batch.length - 1; i >= 0; i--) {
      const b = e.batch[i];
      await setStatus(b.sid, b.before, { source: 'undo', noUndo: true, force: true, silent: true });
      if (b.tagsBefore) await patchRec(b.sid, { tags: b.tagsBefore }, { source: 'undo' });
    }
    toast('已撤销 ' + e.batch.length + ' 人的登记', 'ok');
    renderRegister();
    renderVoiceUI();
    return;
  }

  await setStatus(e.sid, e.before, { source: 'undo', noUndo: true, force: true, silent: true });
  if (e.tagsBefore) await patchRec(e.sid, { tags: e.tagsBefore }, { source: 'undo' });
  const stu = S.students.find(s => s.id === e.sid);
  toast('已撤销：' + (stu ? stu.name : '该学生') + ' 回到「' + STATUS[e.before].label + '」', 'ok');
  renderRegister();
  renderVoiceUI();
}

/* ---------------------------------------------------------------
   9.1 本次分类：分类默认是空的，用「＋ 添加」现场建；
       选中的分类会在点卡片 / 批量登记时顺带打上
   适合默写、背诵这类「全对 / 需订正 / 重默」三档作业
   --------------------------------------------------------------- */
const MYTAGS_KEY = hwId => 'chem_mytags_' + hwId;

/** 本次作业的手动分类：按作业分别记住，换作业自动重载；从没加过就是空 */
function ensureMyTags() {
  if (S.myTagsHw === S.hwId) return;
  S.myTagsHw = S.hwId;
  S.myTags = [];
  S.subTag = '';
  S.quickTag = '';                       // 换作业后不沿用上一个作业的分类
  if (!S.hwId) return;
  try {
    const arr = JSON.parse(localStorage.getItem(MYTAGS_KEY(S.hwId)) || '[]');
    if (Array.isArray(arr)) {
      S.myTags = arr
        .filter(t => typeof t === 'string' && t.trim())
        .map(t => t.trim())
        .slice(0, 12);
    }
  } catch (e) {}
}

function saveMyTags() {
  if (!S.hwId) return;
  try { localStorage.setItem(MYTAGS_KEY(S.hwId), JSON.stringify(S.myTags)); } catch (e) {}
}

/** 添加并选中；已存在则只选中，不重复 */
function addMyTag(t) {
  t = String(t == null ? '' : t).trim().slice(0, 12);
  if (!t) return '';
  if (!S.myTags.includes(t)) {
    if (S.myTags.length >= 12) { toast('本次最多 12 个分类，请先长按删除一个', 'bad'); return ''; }
    rememberTag(t);
  }
  S.quickTag = t;
  return t;
}

/** 记进本次分类条，但不改变当前选中项（用于语音/详情里现场用到的分类） */
function rememberTag(t) {
  t = String(t == null ? '' : t).trim().slice(0, 12);
  if (!t || !S.hwId || S.myTags.includes(t)) return;
  if (S.myTags.length >= 12) return;
  S.myTags.push(t);
  saveMyTags();
}

function removeMyTag(t) {
  const i = S.myTags.indexOf(t);
  if (i < 0) return;
  S.myTags.splice(i, 1);
  saveMyTags();
  if (S.quickTag === t) S.quickTag = '';
  if (S.subTag === t) S.subTag = '';
}

function renderTagBar() {
  const bar = $('#tagBar');
  if (!bar) return;
  ensureMyTags();
  if (!curHw() || !classStudents().length) {
    bar.innerHTML = ''; bar.style.display = 'none'; return;
  }
  bar.style.display = '';
  if (S.tagSortMode && !S.myTags.length) S.tagSortMode = false;
  const sortMode = !!S.tagSortMode;
  // 只认本次手动加过的分类；其余情况一律「不加」
  const cur = sortMode ? '' : (S.myTags.includes(S.quickTag) ? S.quickTag : '');
  if (!sortMode) S.quickTag = cur;          // 分类被删/改名后，选中项跟着回落
  bar.innerHTML =
    '<span class="tagbar-lb"' + (sortMode ? ' style="color:#0f766e"' : '') + '>' +
      (sortMode ? '拖动排序中' : '本次分类') + '</span>' +
    '<div class="tagbar-scroll" id="tagChips">' +
      '<button class="tchip' + (!sortMode && !cur ? ' on' : '') + '" data-t="">不加</button>' +
      S.myTags.map(t => '<button class="tchip' + (cur === t ? ' on' : '') + '" data-t="' + esc(t) + '">' + esc(t) + '</button>').join('') +
    '</div>' +
    (sortMode
      ? '<button class="tchip add" id="tagSortDone">完成</button>'
      : '<button class="tchip add" id="tagAddBtn" aria-label="添加分类">＋ 添加</button>');
  if (sortMode) bar.classList.add('sorting'); else bar.classList.remove('sorting');
  bar.onclick = ev => {
    if (S.tagLongAt && Date.now() - S.tagLongAt < 600) { S.tagLongAt = 0; return; }
    if (ev.target.closest('#tagSortDone')) { S.tagSortMode = false; renderTagBar(); toast('顺序已保存', 'ok'); return; }
    if (ev.target.closest('#tagAddBtn')) { openNewTagSheet(); return; }
    if (S.tagSortMode) return;                  // 排序模式里点一下不换选中
    const b = ev.target.closest('.tchip');
    if (!b) return;
    const t = b.dataset.t;
    S.quickTag = (t && S.quickTag !== t) ? t : '';
    renderTagBar();
  };
  /* 长按分类词 = 重命名 / 删除 / 调整顺序；排序模式里按住拖动 = 换位 */
  bar.onpointerdown = ev => {
    const b = ev.target.closest('.tchip[data-t]');
    if (!b || !b.dataset.t) return;
    const t = b.dataset.t, x0 = ev.clientX, y0 = ev.clientY;
    if (bar._pt) clearTimeout(bar._pt);
    if (S.tagSortMode) {
      startTagChipDrag(b, t, x0, y0);
      return;
    }
    bar._pt = setTimeout(() => {
      bar._pt = null;
      S.tagLongAt = Date.now();             // 吞掉松手后那次 click
      openTagMenu(t);
    }, 550);
    bar.onpointermove = e2 => {
      if (Math.abs(e2.clientX - x0) > 8 || Math.abs(e2.clientY - y0) > 8) {
        if (bar._pt) { clearTimeout(bar._pt); bar._pt = null; }
      }
    };
  };
  bar.onpointerup = bar.onpointercancel = bar.onpointerleave = () => {
    if (bar._pt) { clearTimeout(bar._pt); bar._pt = null; }
  };
}

/** 排序模式：按住分类 chip 拖动，越过相邻分类即换位（实时重排） */
function startTagChipDrag(b, t, x0, y0) {
  let moved = false, ghost = null, w = b.offsetWidth;
  const stop = was => {
    if (ghost) { ghost.remove(); ghost = null; }
    b.style.opacity = '';
    window.removeEventListener('pointermove', mv);
    window.removeEventListener('pointerup', up);
    window.removeEventListener('pointercancel', up);
    if (was) renderTagBar();
  };
  const mv = e => {
    if (!moved) {
      if (Math.hypot(e.clientX - x0, e.clientY - y0) < 6) return;
      moved = true;
      ghost = b.cloneNode(true);
      ghost.style.cssText = 'position:fixed;z-index:999;pointer-events:none;opacity:.92;' +
        'box-shadow:0 6px 18px rgba(15,50,45,.28);left:' + (x0 - w / 2) + 'px;top:' + (y0 - 18) +
        'px;width:' + w + 'px;';
      document.body.appendChild(ghost);
      b.style.opacity = .35;
      if (navigator.vibrate) { try { navigator.vibrate(8); } catch (_) {} }
    }
    ghost.style.left = (e.clientX - w / 2) + 'px';
    ghost.style.top = (e.clientY - 18) + 'px';
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const tgt = el && el.closest ? el.closest('#tagChips .tchip[data-t]') : null;
    const tt = tgt && tgt.dataset.t;
    if (tt && tt !== t && S.myTags.includes(tt)) {
      const from = S.myTags.indexOf(t);
      if (from < 0) return;
      S.myTags.splice(from, 1);
      const to = S.myTags.indexOf(tt);
      if (to < 0) return;
      S.myTags.splice(to, 0, t);
      saveMyTags();
      renderTagBar();                      // 实时重排（b 引用失效也无妨，ghost 独立存在）
      if (navigator.vibrate) { try { navigator.vibrate(8); } catch (_) {} }
    }
  };
  const up = () => stop(moved);
  window.addEventListener('pointermove', mv);
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
}

function openNewTagSheet() {
  const body =
    '<div class="field"><label>新分类名</label>' +
      '<input id="ntIn" placeholder="如：全对 / 需订正 / 重默" autocomplete="off" maxlength="12">' +

      '</div>' +
      '<div class="hint">点一下即可连续登记；每个学生只保留一个分类，打新的会替换旧的。长按分类可改名或删除。</div>' +
    '</div>' +
    (S.myTags.length
      ? '<div class="hint" style="margin:0 0 6px">本次已添加（点一下改名，按住拖动排序）：</div>' +
        '<div class="tag-pick" id="ntList" style="margin-bottom:10px">' +
          S.myTags.map(t => '<button class="tp" data-edit="' + esc(t) + '">' + esc(t) + ' ✎</button>').join('') +
